# jira_template.payment_brand.yaml — the field mapping for the 4-level plan (D11.6, D-A15).
#
# The second half of the DOMAIN SEAM (with `si_profile`): how this domain's Solution Intent maps
# onto JPMC's Jira hierarchy, and which controls fields its issues must carry. A new domain
# rewrites this file; `jira_author` never changes.
#
# ── The hierarchy is JPMC's, and each level has ONE source (D-A15) ─────────────────────────
#   Initiative  → the document itself (§1 identity · §2 problem · §4 objectives)   available at v1
#   Deliverable → §7, one per D-id                                                 available at v1
#   Epic        → §8, ONE PER REQUIREMENT                                          available at v1
#   Story       → §16 impacts + gaps, and §7 non-code work                         **v2 ONLY**
#
# **A business requirement is epic-sized, not story-sized.** "Carry the 2-byte indicator in field
# 48" needs parser changes, validation changes, test updates and certification — a body of work,
# not a unit. That is why §8 maps to Epic and never to Story.
#
# **Stories exist only after G2.** They are derived from validating epics against real code; v1
# can produce three of the four levels and no more. This is why G3 must follow G2 — for a reason
# now, not by convention.
#
# **§16 granularity IS story granularity** (D-A15). The decision about how finely to scope work
# was made when Arm 1 split its entries; this file does not re-litigate it.

domain: payment_brand
hierarchy: [initiative, deliverable, epic, story]

levels:

  initiative:
    source: "the document — §1 identity, §2 problem, §4 objectives"
    issue_type: Initiative
    fields:
      summary: "frame.title"
      description: "§1 executive summary"
      business_case: "§2 problem statement + §4 objectives"
      success_criteria: "§15"

  deliverable:
    source: "§7 Deliverables — one per D-id"
    issue_type: Deliverable
    parent: initiative
    fields:
      local_id: "D-id (the SI's own, carried verbatim — it is the idempotency anchor)"
      summary: "the deliverable name"
      description: "what 'delivered' means for it (§7)"
      kind: "code | non_code"

  epic:
    source: "§8 Business requirements — one epic per requirement"
    issue_type: Epic
    parent: deliverable          # via the §8→§7 `Deliverable:` trace — LOAD-BEARING (D-A15):
                                 # it physically builds the parent-child hierarchy, so an orphan
                                 # requirement yields an Epic with no parent.
    fields:
      local_id: "R-id"
      summary: "the requirement title"
      description: "the requirement description + its enumerated assertions"
      assertion_refs: "R<n>.<m> list"

  story:
    source: "§16 derived system impacts (impacts AND gaps) + §7 non-code work"
    issue_type: Story
    parent: epic
    fields:
      local_id: "S<n>"
      summary: "the unit of work"
      description: "what changes and why, grounded in the §16 entry's evidence"
      evidence: "§16 entry id, or the D-id for non-code work"
      # Exactly one of these three must be set — see `story_classification` below.
      code_location: "path[:symbol] the story changes"
      flag: "new_build | non_code"
      acceptance_criteria: "how completion is verified — ADDED by the translation, not copied"

# ── What the translation ADDS (D-A15's scope-vs-specification point) ───────────────────────
# §16 says *what is impacted*; a story says *what work is done and how completion is verified*.
# Acceptance criteria and testability are authored here and exist nowhere upstream — which is why
# story authoring is a translation, not a copy.
story_classification:
  rule: "exactly one of code_location | flag"
  code_location: "the story changes named code — the §16 entry's evidence supplies it"
  new_build: "no code exists yet (a dispositioned §16 gap) — nothing to name, and saying so is
              the honest outcome rather than inventing a path"
  non_code: "certification packages, filings, runbooks, reporting submissions — derived from a
             §7 deliverable, not from any code location"

# ── Controls (from UI_INPUT.jira.controls) — required on every pushed issue ────────────────
controls:
  required: [seal_id, control_owner, risk_classification]
  labels: [agentic-pdlc, payment-brand]

# ── What must NOT happen ───────────────────────────────────────────────────────────────────
# A Technical Specification reads like technical requirements but is NOT story-level: it
# specifies the EXTERNAL CONTRACT and is code-blind about our system by construction — the
# network has never seen our codebase. It cannot know which module parses field 48, that
# settlement recon validates field counts and will break, or whether we already partially
# support it. So the flow is: tech letter → §8 epics + §10 constraints → Arm 1 against code →
# stories. Never tech letter → stories.
forbidden:
  - "reading stories off a Technical Specification's text"
  - "a story with neither a code_location nor a flag"
  - "an epic with no parent deliverable (the §8→§7 trace was broken)"
  - "a §16 entry that yields no story and carries no explicit disposition"
