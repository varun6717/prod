frame:
  title: Discover Brand Routing
  intent: Implement Discover as a routable card brand end-to-end
  overview: Merchant Services must accept Discover as a first-class routable brand
    across authorization, routing and settlement reconciliation. Today brand identification
    relies on PAN-range lookup, which cannot distinguish co-badged products; the mandate
    introduces an explicit brand indicator carried on the authorization message. Delivery
    spans the authorization parser, the routing tables, settlement reconciliation,
    and a certification package for the network.
  scope_hints:
  - routing
  - settlement reconciliation touchpoints
  stakeholders:
  - Payments Eng
  - Brand Compliance
