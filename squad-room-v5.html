<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro Squad Room · v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f; --bg2:#0f1216; --panel:#111418; --panel2:#151920;
  --line:rgba(236,232,225,.09); --line2:rgba(236,232,225,.2);
  --text:#ece8e1; --mut:#a09b91; --dim:#726e66; --soft:#d2cdc3;
  --cy:#8fb8c9; --vi:#a79bd0; --mg:#c99ab0; --gr:#86c2a0; --am:#d8a94e; --rd:#d98274; --bl:#8fa9cf;
  --ac:#c9a66b; --ac2:#e6d3ac;
  --solid:#12151a; --bar:rgba(10,12,15,.84); --card2:#0e1114; --on-ac:#14110a;
  --t-pl:#a9bfdf; --t-po:#9fd0b4; --t-eng:#bdb9b0; --t-am:#e2bd72; --t-vi:#c2b8e6;
  --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
  --head:"Fraunces","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme=light]{
  --bg:#f5f2ec; --bg2:#fff; --panel:#fffdf9; --panel2:#fff;
  --line:rgba(30,28,22,.1); --line2:rgba(30,28,22,.24);
  --text:#1a1c20; --mut:#5f5b53; --dim:#8a857b; --soft:#34363b;
  --cy:#3a7a90; --vi:#5d4fa3; --mg:#9c4f70; --gr:#2f7d58; --am:#9a6a10; --rd:#b24a3c; --bl:#3d629c;
  --solid:#fffdf9; --bar:rgba(250,248,243,.9); --card2:#fbf9f4; --on-ac:#fff;
  --t-pl:#3d629c; --t-po:#2f7d58; --t-eng:#5f5b53; --t-am:#8a5d0c; --t-vi:#5d4fa3;
}
:root[data-theme=light] #modal{background:rgba(40,36,28,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr;min-width:1180px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;transition:background .8s;
  background:radial-gradient(1100px 420px at 50% -160px,color-mix(in srgb,var(--ac) 13%,transparent),transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 96px);
  mask-image:linear-gradient(180deg,#000,transparent 55%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:3px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac)}
code,.mono{font-family:var(--mono);font-size:.9em}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2)}

/* top bar */
#top{display:flex;align-items:center;gap:9px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--bar);backdrop-filter:blur(16px);position:relative;z-index:30}
.brand{white-space:nowrap;display:flex;align-items:center;gap:11px;font:500 17px var(--head);letter-spacing:.01em}
.brand i{color:var(--ac);font-weight:400}
.brand small{white-space:nowrap;display:block;font:500 9px var(--mono);color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
.logo{width:30px;height:30px;border:1px solid var(--ac);display:grid;place-items:center;position:relative}
.logo::before{content:"";position:absolute;inset:3px;border:1px solid color-mix(in srgb,var(--ac) 35%,transparent)}
.logo::after{content:"N";font:500 15px var(--head);color:var(--ac)}
nav{display:flex;gap:16px;margin:0 6px 0 10px}
nav button{white-space:nowrap;padding:6px 0;color:var(--mut);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid transparent}
nav button.on{color:var(--text);border-color:var(--ac)}
.domains{display:flex;gap:0;border:1px solid var(--line2);border-radius:3px}
.dom{display:flex;align-items:center;gap:7px;padding:6px 11px;color:var(--mut);position:relative;font-size:12px}
.dom+.dom{border-left:1px solid var(--line2)}
.dom i{width:6px;height:6px;background:var(--c);transform:rotate(45deg)}
.dom.on{color:var(--text);background:color-mix(in srgb,var(--c) 14%,transparent)}
.dom .pend{position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--am);border:2px solid var(--bg)}
.dom .pend.me{animation:pulse 1.4s infinite}
.sp{flex:1}
.psw{width:9px;height:9px;transform:rotate(45deg);display:inline-block;margin-right:3px}
.sws{display:inline-flex;gap:3px;padding:7px 6px;border:1px solid var(--line2);border-radius:3px}.sws i{width:8px;height:8px;border-radius:50%}
.tb{padding:6px 10px;border:1px solid var(--line2);border-radius:3px;color:var(--mut);display:inline-flex;align-items:center;gap:7px;position:relative;white-space:nowrap;font-size:12px}
.tb:hover{color:var(--text);border-color:var(--ac)}
.tb.go{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:600}
.tb.stop{background:var(--rd);color:#fff;border:0}
.badge{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:var(--am);color:var(--on-ac);font:600 9.5px/16px var(--mono);text-align:center;padding:0 4px}
.menu{position:absolute;top:calc(100% + 8px);right:0;width:310px;background:var(--solid);border:1px solid var(--line2);border-radius:4px;padding:6px;box-shadow:0 24px 70px rgba(0,0,0,.45);z-index:50;text-align:left;white-space:normal}
.menu .mi{display:flex;gap:10px;align-items:center;padding:9px;width:100%;text-align:left;color:var(--text)}
.menu .mi:hover{background:var(--line)}
.menu .mi small{color:var(--mut);display:block}
.menu h6{margin:8px 9px;font:500 9.5px var(--mono);color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font:500 10px var(--mono);color:var(--c,#888);border:1px solid var(--c,#888);background:color-mix(in srgb,var(--c,#888) 10%,transparent);flex:none;position:relative}
.av.sm{width:20px;height:20px;font-size:8px}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:var(--gr);border:2px solid var(--bg)}

/* rail — a timeline */
#rail{padding:16px 22px 10px;border-bottom:1px solid var(--line)}
.railgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 0}
.st{position:relative;display:block;text-align:left;border-top:1px solid var(--line2);padding:12px 16px 6px 0;min-width:0;transition:.4s}
.st::after{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--line2)}
.st .ph{font:500 9px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.st .hd{font:500 15px var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.st .hd .n{font-style:italic;color:var(--ac);margin-right:8px}
.st .dots{display:flex;gap:3px;margin:8px 0 7px;align-items:center;font:500 9.5px var(--mono);color:var(--dim)}
.st .dots i{width:14px;height:2px;background:var(--line2)}
.st .dots i.d{background:var(--ac)}
.st .dots i.n{background:var(--ac2);animation:pulse 1.2s infinite}
.st .gs{display:flex;gap:4px;flex-wrap:wrap;min-height:19px}
.st.opt{border-top-style:dashed}
.st.done{border-top-color:var(--ac)}
.st.done::after{background:var(--ac);border-color:var(--ac)}
.st.active{border-top-color:var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 11%,transparent),transparent 75%)}
.st.active::after{background:var(--ac2);border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 24%,transparent);animation:breath 2.4s ease-in-out infinite}
.st.active::before{content:"In session";position:absolute;top:13px;right:14px;font:500 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.st.skipped{opacity:.4}
.st.sel{background:var(--panel)}
.st.todo .hd{color:var(--mut)}
#rail .gov{grid-column:3/-1;display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-left:2px solid var(--am);font-size:11px;color:var(--mut)}
#rail .gov.off{opacity:.4}
#rail .gov b{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--t-am)}
.legend{grid-column:1/3;display:flex;gap:12px;align-items:center;font-size:10px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:6px;height:6px;margin-right:5px;transform:rotate(45deg)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 9px var(--mono);letter-spacing:.08em;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap;text-transform:uppercase}
.chip.pl{color:var(--t-pl)}.chip.po{color:var(--t-po)}.chip.eng{color:var(--t-eng)}.chip.adv{color:var(--t-am);border-style:dashed}.chip.dual{color:var(--t-vi)}
.chip.pending{background:color-mix(in srgb,currentColor 14%,transparent);animation:pulse 1.4s infinite}
.chip.cleared{color:var(--gr);border-color:var(--gr);border-style:solid}
.pill{display:inline-block;font:500 9.5px var(--mono);letter-spacing:.04em;padding-left:10px;position:relative;white-space:nowrap}
.pill::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;margin-top:-2.5px;background:currentColor;transform:rotate(45deg)}
.pill.gov{color:var(--t-po)}.pill.ev{color:var(--t-pl)}.pill.local,.pill.draft,.pill.rec{color:var(--t-eng)}.pill.pub{color:var(--gr)}
.stt{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.stt.approved{color:var(--gr)}.stt.review{color:var(--am)}.stt.draft{color:var(--mut)}.stt.saved{color:var(--t-pl)}
.role{font:500 8.5px var(--mono);letter-spacing:.08em;padding:0 4px;border:1px solid var(--line2);border-radius:2px;color:var(--mut)}

/* main */
#main{display:grid;grid-template-columns:250px 1fr 380px;min-height:0}
.col{min-height:0;overflow:auto;padding:18px 18px 18px 22px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line);padding:0;display:flex;flex-direction:column;overflow:hidden}
h5{margin:20px 0 9px;font:500 9.5px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
h5:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px}
.person{display:flex;align-items:center;gap:10px;padding:7px 8px;width:100%;text-align:left;border-left:2px solid transparent}
.person:hover{background:var(--line)}
.person.me{border-left-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.person b{display:block;font-weight:500;font-size:13px}.person small{color:var(--mut);font-size:10.5px}
.person .wait{white-space:nowrap;margin-left:auto;font:500 9px var(--mono);letter-spacing:.06em;color:var(--am);border:1px solid var(--am);padding:1px 5px;border-radius:2px;animation:pulse 1.4s infinite}
.person .stw{margin-left:auto;color:var(--ac);font-size:11px}
.agent{display:flex;gap:13px;align-items:center}
.orb{width:44px;height:44px;border-radius:50%;flex:none;position:relative;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 64%)}
.orb::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid transparent;border-top-color:var(--ac);border-right-color:color-mix(in srgb,var(--ac) 35%,transparent);animation:spin 6s linear infinite}
.orb::after{content:"";position:absolute;inset:39%;border-radius:50%;background:var(--ac2);box-shadow:0 0 12px var(--ac);animation:breath 3s ease-in-out infinite}
.orb.run::before{animation-duration:.9s}
.orb.sm{width:28px;height:28px}.orb.sm::before{inset:3px}
.agent b{font:500 16px var(--head)}.agent small{color:var(--mut);display:block;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.stat{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 11px}
.stat b{font:400 26px/1.1 var(--head);display:block;color:var(--text)}.stat span{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.govrow{display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px}.govrow span{color:var(--mut)}.govrow b{font-weight:500}

/* conversation */
#center{display:flex;flex-direction:column;min-height:0;min-width:0}
.chd{padding:16px 26px 12px;border-bottom:1px solid var(--line)}
.chd h2{margin:0;font:400 22px/1.2 var(--head);letter-spacing:-.005em}.chd small{color:var(--mut);font-size:11.5px}
.banner{margin:10px 26px 0;padding:9px 14px;font-size:12px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2)}
.banner.me{border-left:2px solid var(--am);color:var(--t-am);background:color-mix(in srgb,var(--am) 8%,transparent)}
.banner.other{color:var(--mut)}
.banner button{margin-left:auto}
#chat{flex:1;overflow:auto;padding:20px 26px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:13px;animation:rise .35s ease both;max-width:840px}
.msg .body{min-width:0;flex:1}
.msg .meta{font-size:11px;color:var(--dim);margin-bottom:4px}.msg .meta b{color:var(--text);font-weight:600;margin-right:6px;letter-spacing:.01em}
.bub{font-size:13.5px;line-height:1.62;color:var(--soft);max-width:100%}
.msg.agent .bub{border-left:1px solid var(--ac);padding-left:14px;color:var(--text)}
.msg.sys{align-self:stretch;max-width:none;display:flex;align-items:center;gap:14px;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.msg.sys::before,.msg.sys::after{content:"";flex:1;height:1px;background:var(--line)}
.msg.sys.win{color:var(--gr)}
.runc,.gatec,.gapc,.ivc{border:1px solid var(--line2);border-radius:4px;background:var(--card2);padding:14px 16px;width:100%}
.runc .rh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.runc .rh b{font:500 13px var(--mono)}
.spin{width:11px;height:11px;border:1px solid var(--line2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
.tr{font:11px/1.8 var(--mono);color:var(--mut)}.tr div::before{content:"— ";color:var(--dim)}.tr div.cur::before{content:"› ";color:var(--ac)}.tr div.cur{color:var(--text)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.file{display:inline-flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line2);border-left:2px solid var(--ac);border-radius:2px;font:500 11px var(--mono)}
.file:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.gatec{border-top:2px solid var(--am)}.gatec.cleared{border-top-color:var(--gr)}
.gatec .rh b{font:500 15px var(--head)}
.gatec .gq{font:italic 400 15px/1.5 var(--head);color:var(--soft);margin:8px 0 10px}
.checks{margin:8px 0;padding:0;list-style:none;font-size:11.5px;color:var(--mut)}.checks li::before{content:"✓  ";color:var(--gr)}
.gact{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:3px;border:1px solid var(--line2);font-weight:500;font-size:12px;letter-spacing:.01em}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.ok{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}.btn.warn{border-color:var(--am);color:var(--am)}.btn.dng{border-color:var(--rd);color:var(--rd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.gapc{border-top:2px solid var(--rd)}.gapc.ok{border-top-color:var(--gr)}
.ivc label{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:11.5px;color:var(--mut)}
.cos{display:flex;gap:20px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.gauge{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--v)*1%),var(--line) 0);position:relative;flex:none}
.gauge::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card2)}
.gauge b{position:relative;z-index:1;font:400 28px var(--head)}
.bars{flex:1;font-size:11px;color:var(--mut)}.bars div{display:grid;grid-template-columns:110px 1fr 26px;gap:10px;align-items:center;margin:4px 0}
.bars i{height:2px;background:var(--line2);position:relative}.bars i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--ac)}
.note{margin-top:10px;padding:8px 12px;border-left:2px solid var(--am);background:color-mix(in srgb,var(--am) 7%,transparent);font-size:11.5px}
.note.ok{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 7%,transparent)}
.typing{font:italic 12px var(--head);color:var(--mut);padding:0 26px 4px;height:20px}
#comp{border-top:1px solid var(--line);padding:12px 26px 16px;background:var(--bar)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sug{padding:5px 12px;border-radius:3px;border:1px solid var(--line2);font-size:11.5px;color:var(--mut)}
.sug:hover{color:var(--text);border-color:var(--ac)}
.sug.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:600}
.sug.sw{border-color:var(--am);color:var(--t-am)}
.inrow{display:flex;gap:10px;align-items:center}
.inrow input{padding:11px 14px}
.guide{margin:10px 26px 0;padding:12px 16px;border:1px solid var(--line2);border-left:2px solid var(--ac);background:var(--panel);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.guide .gk{font:500 9px var(--mono);letter-spacing:.18em;color:var(--ac);text-transform:uppercase}
.guide h4{margin:3px 0 5px;font:500 17px var(--head)}
.guide p{margin:3px 0;font-size:12px;color:var(--soft)}
.guide p b.l{font:500 9px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-right:8px}
.guide .gctl{display:flex;flex-direction:column;gap:6px;min-width:180px}
.guide .gctl .btn{text-align:center}
.guide .gctl div{display:flex;gap:6px}.guide .gctl div .btn{flex:1;padding:5px 6px;font-size:11px}

/* right */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;padding:0 12px}
.tabs button{flex:1;padding:13px 4px 11px;color:var(--mut);border-bottom:1px solid transparent;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.tabs button.on{color:var(--text);border-color:var(--ac)}
.rp{flex:1;overflow:auto;padding:18px 22px}
.rp h3{margin:2px 0 4px;font:400 21px var(--head)}
.row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
button.row:hover{background:var(--line)}
.row .nm{font:500 11.5px var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.row small{color:var(--mut)}
.row.next{border-bottom-color:var(--ac);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 12%,transparent),transparent)}
.row.ghost{opacity:.45}
.muted{color:var(--mut);font-size:11.5px}
.conn{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line)}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--gr)}
.conn b{font-weight:500}

/* ===== room pet ===== */
#center{position:relative}
#pet{position:absolute;right:26px;z-index:6;width:46px;height:46px;padding:0;line-height:0}
#pet svg{width:46px;height:46px;overflow:visible;animation:petbob 3.2s ease-in-out infinite;transform-origin:50% 100%}
#pet .pb{fill:var(--panel);stroke:var(--ac);stroke-width:1.6;stroke-linejoin:round}
#pet .pl{fill:none;stroke:var(--ac);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#pet .pl.thin{stroke-width:.9;opacity:.7}
#pet .eye{fill:var(--ac);transform-box:fill-box;transform-origin:center;animation:petblink 4.5s infinite}
#pet .ant{fill:var(--ac2);stroke:none;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s infinite}
#pet .tail{transform-box:fill-box;transform-origin:0 100%;animation:petwag 1.8s ease-in-out infinite}
#pet.work svg{animation:petbob .5s ease-in-out infinite}
#pet.work .ant{animation:pulse .35s infinite}
#pet.alert svg{animation:petalert .9s ease-in-out infinite}
#pet.wait .eye{animation:petlook 3s ease-in-out infinite}
#pet.party svg{animation:petparty .8s ease-in-out infinite}
#pet.hop svg{animation:pethop .5s ease-out 2}
.psay{position:absolute;right:54px;bottom:16px;white-space:nowrap;font:500 11px/1.3 var(--sans);color:var(--text);background:var(--solid);border:1px solid var(--ac);border-radius:10px 10px 2px 10px;padding:6px 10px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:rise .25s ease}
.petmi svg{width:30px;height:30px;overflow:visible}
.petmi .pb{fill:none;stroke:var(--ac);stroke-width:1.8}.petmi .pl{fill:none;stroke:var(--ac);stroke-width:1.6}.petmi .eye,.petmi .ant{fill:var(--ac)}
@keyframes petbob{50%{transform:translateY(-3px)}}
@keyframes petblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes petwag{50%{transform:rotate(-16deg)}}
@keyframes petalert{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-5deg)}75%{transform:translateY(-7px) rotate(5deg)}}
@keyframes petlook{0%,100%{transform:translateX(0)}30%{transform:translateX(-1.6px)}70%{transform:translateX(1.6px)}}
@keyframes petparty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes pethop{50%{transform:translateY(-12px)}}

/* ===== slash command menu ===== */
#slash{position:absolute;left:26px;z-index:8;width:360px;background:var(--solid);border:1px solid var(--line2);border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.4);padding:4px;animation:rise .15s ease}
#slash .sh{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:7px 9px 5px;display:flex;gap:8px;align-items:center}
#slash .sh button{color:var(--ac);font:inherit;letter-spacing:.06em}
#slash .si{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:7px 9px;border-radius:3px}
#slash .si b{font:600 12px var(--mono);min-width:76px}

#slash .si .r{margin-left:auto;color:var(--ac);font:500 10.5px var(--mono);white-space:nowrap}
#slash .si.on,#slash button.si:hover{background:color-mix(in srgb,var(--ac) 14%,transparent)}
#slash .sf{font:500 9.5px var(--mono);color:var(--dim);padding:6px 9px 5px;border-top:1px solid var(--line);margin-top:4px}
.sug.slashb{margin-left:auto;font-family:var(--mono);font-size:10.5px}
.skact{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
button.row{cursor:pointer}
.mb .note .btn{padding:4px 10px;font-size:11px}

/* ===== output contract UI ===== */
.outs{display:flex;flex-direction:column;gap:5px}
.orow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line2);border-left:2px solid var(--ac);border-radius:3px;background:var(--card2)}

.contract{margin-top:9px;font:500 10.5px var(--mono);color:var(--gr)}.contract.bad{color:var(--am)}
.ck{font-size:11.5px;color:var(--t-po);margin-top:3px}.ck.bad{color:var(--am)}

/* ===== threads + mini next button ===== */
.thbar{margin-top:8px}
.thstart{font:600 11px var(--sans);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:3px;padding:4px 11px;background:color-mix(in srgb,var(--ac) 8%,transparent)}
.thstart:hover{background:var(--ac);color:var(--on-ac)}
.thlink{font:500 10.5px var(--mono);color:var(--dim);letter-spacing:.02em}.thlink:hover{color:var(--ac)}
.thline{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:8px;padding:6px 10px;border:1px solid var(--line2);border-left:2px solid var(--ac);border-radius:3px;background:var(--card2);font-size:12px}

.thprev{color:var(--mut);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thprev i{font-style:normal;color:var(--ac);font:500 10px var(--mono);margin-right:4px}
.thline .r{color:var(--ac);font:500 10.5px var(--mono);white-space:nowrap}
.thread{margin-top:8px;border-left:2px solid var(--ac);padding:8px 0 4px 14px;display:flex;flex-direction:column;gap:10px}
.thh{display:flex;align-items:baseline;gap:9px;font-size:12px}

.tht{font-size:13px;line-height:1.55;color:var(--soft)}

.thin{display:flex;gap:7px;align-items:center}.thin input{padding:7px 10px;font-size:12px}.thin .btn{padding:6px 10px;font-size:11px;white-space:nowrap}
.menh{display:flex;gap:5px;flex-wrap:wrap}.menh:empty{display:none}.menh .sug{font-size:11px;padding:3px 8px}
.nextb{margin-left:auto;font:600 10.5px var(--mono);letter-spacing:.04em;color:var(--mut);border:1px solid var(--line2);border-radius:3px;padding:3px 9px;white-space:nowrap}
.nextb:hover{color:var(--on-ac);background:var(--ac);border-color:var(--ac)}.nextb:disabled{opacity:.35}
:root[data-theme=light] .av.sm{background:#fff}

/* ===== lobby ===== */

.ltop{display:flex;align-items:center;gap:10px;padding:16px 0;font-size:12px}

.lcard{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-left:2px solid var(--c);border-radius:4px;padding:11px 12px;margin-bottom:9px;background:var(--card2)}
button.lcard:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card2))}
.lc1{display:flex;align-items:center;gap:8px;font-size:12px}.lc1 .mono{color:var(--mut);font-size:10.5px}
.lflag{margin-left:auto;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--am);border:1px solid var(--am);border-radius:2px;padding:1px 5px}

.lnew:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}.lnew:disabled{opacity:.5}
.lnew .plus{width:46px;height:46px;border-radius:50%;border:1px solid var(--ac);color:var(--ac);font:300 28px/44px var(--sans)}
.lnew b{font:600 15px var(--head)}.lnew small{color:var(--mut);font-size:11.5px;line-height:1.5}

.lfh{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.lfh h2{margin:0;font:600 20px var(--head);flex:1}.lfh .muted{display:inline-flex;align-items:center;gap:6px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.lseg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}.lseg button{flex:1;padding:7px 8px;font-size:11.5px;color:var(--mut)}.lseg button+button{border-left:1px solid var(--line2)}
.lseg button.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--text)}
.linv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lper{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 9px;border:1px solid var(--line2);border-radius:3px;font-size:12px}

.lper.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}.lper.on .r{color:var(--ac)}.lper.own{grid-column:1/-1}

.ldom b{display:block;font-size:13px}.ldom small{color:var(--mut);font-size:10.5px}
.ldom.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px var(--c)}.ldom:disabled{opacity:.45;cursor:not-allowed}
.lskills{margin-top:10px;border:1px solid color-mix(in srgb,var(--c,var(--ac)) 55%,transparent);border-radius:4px;padding:12px 14px;background:color-mix(in srgb,var(--c,var(--ac)) 6%,transparent);animation:rise .3s ease}

.lstat{display:flex;gap:18px;margin:8px 0;font-size:12px;color:var(--mut)}.lstat b{font:600 20px var(--head);color:var(--text);margin-right:4px}

.lspin .nlogo .orbit,.lspin .nlogo .links{animation-duration:1.6s}

.btn.lnewb{background:var(--ac);border-color:var(--ac);color:var(--on-ac);font-weight:600}

<main id="main">

    <div id="chdr"></div>

</main>

<script>
/* ============================================================

 governance_readiness:{name:()=>'governance-readiness.md',dest:'local',body:d=>`# Governance readiness (Stage 3f)\nRuns alongside Working Hub — not a Working Hub gate, but go-live timing depends on it.\n${tbl(['Track','Trigger','Status'],[['Risk Materiality (RMC)','Change to production payment flow','Assessment opened'],['NPA','New product/capability?','Screening'],['BAR','Business architecture review','Not started']])}\n- Re-check at Stage 4 and Stage 5`},
 arch_assessment:{name:()=>'initiative-arch-assessment.md',dest:'gov',gate:'GW-I2',body:d=>`# Initiative architecture assessment\n**Author:** ${PEOPLE.ar.name} (AR)\n## Significance\nArchitecturally significant — ${d.seal}.\n## Impacted applications\n${d.apps.map(a=>'- '+a).join('\n')}\n## Constraints (NFR)\n- ${d.nfr.split(' · ').join('\n- ')}\n## Recommendation\nProceed to design with L1 architecture attached.`},
 pci_scope:{name:()=>'pci-scope-analysis.md',dest:'ev',body:(d,r)=>`# PCI scope analysis\nBaseline: attestation${src(r)}.\n${tbl(['Component','In scope today','After'],[['Card-on-File API','Yes','No — tokens only'],['Token Vault','Yes','Yes'],['Lifecycle Event Bus','No','No'],['Merchant batch store','Yes','No']])}\n> Net: 2 components leave PCI scope.`},
 l1_arch:{name:()=>'L1-architecture.md',dest:'gov',gate:'GW-I2',note:'condition only',body:d=>`# L1 architecture\n## Context\n${d.apps[0]} → **${d.seal.split(' (')[0]}** → ${d.apps[1]} → ${d.apps[2]}\n## Containers\n${tbl(['Container','Responsibility'],[[d.seal.split(' (')[0],d.deliverables[1]],[d.apps[0],'Entry point, validation'],[d.apps[3],'System of record']])}\n## Key decisions\n- Event-driven integration between ${d.apps[1]} and ${d.apps[2]}\n- No new data store holding sensitive data`},
 functional_deliverable:{name:()=>'functional-deliverable.md',dest:'gov',gate:'GW-RD1',body:d=>`# Functional deliverable — ${d.deliverables[0]}\n## Functional scope\n- ${d.problem}\n- Applies across: ${d.apps.join(', ')}\n## Business Acceptance Criteria (BAC)\n- BAC-1: ${d.outcome}\n- BAC-2: No regression in existing flows\n- BAC-3: ${d.nfr.split(' · ')[0]}\n## Out of scope\n- ${d.deliverables[3]} (separate deliverable)`},
 epic_list:{name:()=>'epic-list.md',dest:'gov',gate:'GW-RD1',note:'registered entity',body:d=>`# Epic list\n${tbl(['Epic','Title','Application'],d.epics.map((e,i)=>[d.key+'-E'+(i+1),e,d.apps[i%d.apps.length]]))}`},
 fee_diff:{name:()=>'fee-schedule-diff.md',dest:'local',body:()=>`# Fee schedule diff\n${tbl(['Line item','Live','Proposed','Notice required'],[['Assessment pass-through','0.13%','0.14%','No'],['Authorization fee','$0.05','$0.05','No'],['Markup — tier 2','0.30%','0.34%','Yes'],['Statement fee','$7.50','$5.00','Yes']])}`},
 experience_flow:{name:()=>'experience-flow.md',dest:'local',body:d=>`# Experience flow\n**Author:** ${PEOPLE.ux.name} (UX)\n## Journeys\n- Merchant sees the change in reporting without a support call\n- Operations analyst resolves an exception in one screen\n- Client manager answers “what changed?” from the readiness dashboard\n## Principles\n${d.pillars.map(x=>'- '+x).join('\n')}`},
 epics:{name:d=>`epic.md × ${d.epics.length}`,dest:'gov',gate:'GW-RD2',note:'registered entity',body:d=>`# Epics\n${d.epics.map((e,i)=>`## ${d.key}-E${i+1} — ${e}\n- **As** the ${d.apps[i%d.apps.length]} team **we need** ${e.toLowerCase()}\n- AC: traceable to BAC-${(i%3)+1}; automated regression passes\n- NFR: ${d.nfr.split(' · ')[i%3]}`).join('\n')}`},
 spec:{name:()=>'spec.md',dest:'gov',note:'new interface — not a gate',body:d=>`# Interface spec\n## New contract surface\n\`POST /v1/${d.slug.replace(/_/g,'-')}/requests\`\n${tbl(['Field','Type','Required'],[['merchantId','string','yes'],['payload','object','yes'],['idempotencyKey','string','yes']])}\n- Errors follow the platform problem+json convention`},
 epic_package:{name:()=>'EPIC_AUTHORING_PACKAGE.md',dest:'local',body:d=>`# Epic authoring package\n- ${d.epics.length} epics authored\n- Template: PDLC epic v3\n- SIF label applied for Jira publication`},
 epic_quality:{name:()=>'epic-quality-report.md',dest:'local',body:d=>`# Epic quality report\n${tbl(['Epic','BAC','Grade'],d.epics.map((e,i)=>[e,'✓',i===2?'B':'A']))}\n> Missing BAC would lock a grade at C max — none missing.`},
 impl_plan:{name:()=>'implementation-plan.md',dest:'gov',gate:'GW-B1',body:d=>`# Implementation plan\n**Author:** ${PEOPLE.eng.name} (ENG-L)\n## Sequence\n${d.epics.map((e,i)=>`- Sprint ${i+1}–${i+2}: ${e}`).join('\n')}\n## Test strategy\n- Contract tests on every changed interface\n- Shadow traffic before cut-over\n## Rollout\n- Feature-flagged, application by application: ${d.apps.join(' → ')}`},
 token_migration:{name:()=>'token-migration-waves.md',dest:'local',body:()=>`# Token migration waves\n${tbl(['Wave','Cohort','Rollback point'],[['1','Internal test merchants','Full'],['2','1% of stored credentials','Full'],['3','10%','Per merchant'],['4','50%','Per merchant'],['5','Remainder','Per merchant']])}`},
 pi_analytics:{name:()=>'PI-27.1-analytics.html',dest:'local',body:d=>`# PI 27.1 analytics\n- Epics in scope: ${d.epics.length}\n- Teams: 3\n- Point-in-time analysis — not a governance artifact`},
 pi_capacity:{name:()=>'PI-27.1-capacity.html',dest:'local',body:(d,r)=>'<!raw><h1>PI 27.1 capacity</h1><p>Velocity baseline'+esc(src(r))+' against planned load.</p>'+[['Team Atlas',82],['Team Borealis',96],['Team Cygnus',68]].map(([t,p])=>`<div class="capbar"><span>${t}</span><i style="--w:${p}%;--k:${p>90?'var(--am)':'var(--gr)'}"></i><b>${p}% load</b></div>`).join('')+'<blockquote>Team Borealis is above 90% — consider moving one epic.</blockquote>'},
 pi_coverage:{name:()=>'PI-27.1-coverage.html',dest:'local',body:d=>`# PI 27.1 coverage\n${tbl(['Deliverable','Epics planned','Coverage'],d.deliverables.map((x,i)=>[x,String(i===3?0:1+i%2),i===3?'Gap':'Covered']))}\n> Coverage gap on “${d.deliverables[3]}” routes back to Stage 4a/4b.`},
 pi_confidence:{name:()=>'PI-27.1-confidence.html',dest:'local',body:()=>`# PI 27.1 confidence\n- Overall confidence: **4 / 5**\n- Largest risk: shared certification / release window\n- Dependency count: 6 (2 external)`},
 exec_readout:{name:()=>'executive-readout.md',dest:'draft',body:d=>`# Executive readout\n> **BLUF:** ${d.initiative} is planned into PI 27.1 with confidence 4/5. One coverage gap is routed back to refinement; no decision needed today.\n## Status\n- Gates cleared: GW-I1, GW-I2, GW-RD1, GW-RD2, GW-B1\n- Governance track (3f): on plan\n## Next\n- Pilot exit sign-off (PO + PL)`},
 confluence_pages:{name:()=>'Confluence: strategy · PI readiness · initiative status',dest:'pub',body:d=>`# Published Confluence pages\n- ${d.short} / Strategy 2026-10\n- ${d.short} / PI 27.1 readiness\n- ${d.short} / ${d.initiative} — status\n> Published via the Confluence MCP connection.`},
 pilot_exit:{name:()=>'pilot-exit-signoff.md',dest:'rec',gate:'EXIT',body:d=>`# Pilot exit sign-off\n- Initiative: ${d.initiative}\n- Requires: PO + PL\n- Evidence: published Confluence pages, executive readout`}

const GLOSSARY=[['PO','Product Owner','Drives ideation → delivery. Authors Working Hub artifacts.'],['PL','Product Leader','Gate approver role. Separation of duties applies — the approver must differ from the author.'],['AR','Architect','Architecture role at initiative level — authors the initiative architecture assessment.'],['DA','Domain Architect','Domain-level architecture role for architecturally significant initiatives.'],['L-AR','Lead Architect','Senior architecture approver role at deliverable level.'],['L-DA','Lead Domain Architect','Senior architecture approver role for epic-level domain design.'],['ENG-L','Engineering Lead','Authors the implementation plan during Construct.'],['WH','Working Hub','Governance platform. All initiative artifacts land here; also owns downstream Jira publication.'],['KH','Knowledge Hub','Architecture knowledge base, reached via kh-cli / kh-grounded-query during ACD.'],['GW','Gateway','A phase gate in Working Hub — a checkpoint that must be satisfied before the initiative progresses.'],['GW-I1','Ideation Gate 1','Is the intent defined well enough to start shaping deliverables?'],['GW-I2','Ideation Gate 2','Has architecture assessed the intent before design work begins?'],['GW-RD1','Refine-and-Design Gate 1','Is the deliverable decomposed and described well enough to break into epics?'],['GW-RD2','Refine-and-Design Gate 2','Is each epic specified well enough to build?'],['GW-B1','Construct Gate 1','Is there a plan for how the epic will actually be built?'],['COS','Composite Opportunity Score','Ideation scoring metric (0–100). COS ≥ 70 required to advance to Stage 2/3.'],['ACD','Application Context Discovery','Auto-query of Knowledge Hub for named applications after D.3 in the discovery interview.'],['BAC','Business Acceptance Criteria','Deliverable-level AC. Missing BAC locks the quality grade at C max.'],['PI','Program Increment','Quarterly delivery cycle (approx. 10 weeks). Epics are assigned a PI fix version.'],['PBR','Portfolio Backlog Review','3-phase deliverable-level ceremony to get deliverables to “Ready”. PBR3 required before PI commit.'],['PDLC','Product Development Lifecycle','5-phase delivery framework: Decide → Define → Refine → Build → Launch.'],['SID','SID','User identifier used in Working Hub role assignments.'],['NFR','Non-Functional Requirement','Performance, availability, security, compliance constraints. Hard gate at Stage 3 GW-I1.'],['BRD','Business Requirements Document','Legacy term. In PDLC this is solution-intent.md.'],['FRD','Functional Requirements Document','Legacy term. In PDLC this is deliverables-list.md.'],['SEAL','Standard Enterprise Application Layer','Application classification. A new SEAL makes an initiative architecturally significant.'],['SRC-ID','Source Identifier','ID assigned in sources/SOURCES.md. Must be cited inline in governance artifacts.'],['SIF','Strategic Initiative Flag','Jira label linking an epic to a named strategic initiative.'],['BLUF','Bottom Line Up Front','The key message is stated first. Every executive communication opens with a BLUF.']];

     :{name:sk.outName||sk.name+'-output.md',dest:'local',gate:null,note:'custom skill',body:`# ${sk.name} — output\nGenerated by the custom skill \`${sk.name}\` v${sk.ver} for ${d.initiative}.\n## Instructions used\n> ${sk.prompt.split('\n')[0]}\n## Result\n- Skill executed against ${sk.needs.map(n=>VIA[n.via]).join(', ')||'session context'}\n- Output stored in the room and available to the squad`};

/* ---------- workflow engine ---------- */
function unsatGap(room,sk){const n=sk.needs.find(n=>n.gap);return n&&!room.sources.some(s=>s.key===n.gap.key)?n.gap:null}
function nextAction(room){if(room.done)return null;const st=room.chain[room.ptr];
  if(st[0]==='@'){const gid=st.slice(1),g=room.gates[gid],G=GATES[gid];const who=G.approvers.find(p=>!g.approvals[p]);return {type:G.commit?'commit':'approve',gate:gid,actor:who}}
  const sk=skill(room.id,st),gap=unsatGap(room,sk);
  if(gap&&room.gapPosted[gap.key])return {type:'ingest',gap,skill:sk,actor:sk.role};
  if(sk.interview&&room.interview&&!room.interview.submitted)return {type:'answer',skill:sk,actor:sk.role};
  return {type:'skill',skill:sk,actor:sk.role}}
function actionLabel(a){return a.type==='skill'?'Run '+a.skill.name:a.type==='ingest'?'Attach SharePoint source':a.type==='answer'?'Submit interview answers':a.type==='approve'?(a.gate==='EXIT'?'Sign pilot exit':'Approve '+a.gate):'Commit plan · close GW-B1'}

async function perform(room,a,o={}){
  if(a.type==='skill')return startSkill(room,a.skill,a.actor,o);
  if(a.type==='ingest'){if(o.auto||o.instant)return ingest(room,{...a.gap,name:fileName(a.gap.url),scope:'Whole initiative'},a.actor,o.instant);return openIngest(a.gap)}
  if(a.type==='answer')return submitInterview(room,a.actor,o);
  return approveGate(room,a.gate,a.actor,o.instant)}

async function startSkill(room,sk,by,o={}){
  const d=DOMAINS[room.id],gap=unsatGap(room,sk);
  if(gap){if(o.instant)ingest(room,{...gap,name:fileName(gap.url),scope:'Whole initiative'},by,true);
    else{room.gapPosted[gap.key]=true;post(room,{who:'agent',kind:'gap',gap,skill:sk.id});audit(room,d.agent,`Data gap on ${sk.name}: ${gap.label}`);refresh();return}}
  if(sk.interview&&!room.interview?.submitted){
    if(o.instant)room.interview={answers:ivDefaults(d),submitted:true};
    else{room.interview={answers:ivDefaults(d),submitted:false};post(room,{who:'agent',kind:'interview'});refresh();return}}
  await runSkill(room,sk,by,o)}

async function runSkill(room,sk,by,o={}){
  const d=DOMAINS[room.id],I=o.instant;room.busy=true;room.runs++;
  const m=post(room,{who:'agent',kind:'run',run:{skill:sk.id,name:sk.name,ver:sk.ver,steps:[],done:false,arts:[],by}},I);if(!I)refresh();
  const steps=[`Loaded skill ${sk.name} v${sk.ver}${sk.cz?' (customized for '+d.short+')':''}`];
  for(const n of sk.needs){
    if(n.via==='kh'&&n.khdoc){let src=room.sources.find(x=>x.key===n.khdoc.key);
      if(!src){tick(room,I);src={id:'SRC-'+String(room.sources.length+1).padStart(3,'0'),key:n.khdoc.key,name:fileName(n.khdoc.url),url:'kh://'+d.short.toLowerCase()+'/'+fileName(n.khdoc.url),scope:'Whole initiative',by:'kh',origin:'kh',t:room.clock};room.sources.push(src);audit(room,d.agent,`Retrieved ${src.name} from Knowledge Hub (MCP) as ${src.id}`)}
      (m.run.kh=m.run.kh||[]).push(src.id);steps.push(`MCP · kh-grounded-query → Knowledge Hub · ${n.khdoc.q}`,`Knowledge Hub · match found · ${src.name} · ${9+src.name.length%8} grounded passages · registered as ${src.id}`)}
    else if(n.via==='kh')steps.push(`MCP · kh-grounded-query → Knowledge Hub · ${n.label} · ${8+sk.id.length%9} grounded passages`);
    else if(n.via==='wh')steps.push(`MCP · wh-get-config-snapshot → Working Hub · ${n.label}`);
    else if(n.via==='jira')steps.push(`MCP · jira-search → Jira · ${n.label}`);
    else if(n.via==='conf')steps.push(`MCP · confluence-publish → ${n.label}`);
    else{const s=room.sources.find(x=>n.gap?x.key===n.gap.key:true);steps.push(`SharePoint source · ${s?s.id+' · '+s.name:n.label+' (none attached — using session context)'}`)}}
  steps.push(...(sk.trace||['Reasoning over inputs']),'Writing outputs to the room');
  for(const s of steps){m.run.steps.push(s);rerender(room,m);await sleep(650,I)}
  const outs=sk.outs&&sk.outs.length?sk.outs:['custom:'+sk.id];
  m.run.arts=outs.map(k=>addArt(room,k,sk,by,I).key);m.run.done=true;m.run.card=sk.card;
  audit(room,d.agent,`Ran ${sk.name} v${sk.ver} for ${PEOPLE[by].name} → ${outs.length} artifact(s)`);
  room.busy=false;rerender(room,m);
  if(room.chain[room.ptr]===sk.id)advance(room,I);
  if(!I)refresh()}

function submitInterview(room,by,o={}){room.interview.submitted=true;
  post(room,{who:by,kind:'text',html:'Submitted the discovery interview answers (A–G).'},o.instant);
  return runSkill(room,skill(room.id,'project-initiation'),by,o)}

function advance(room,I){const prev=stepStage(room,room.ptr);room.ptr++;
  if(room.ptr>=room.chain.length){room.done=true;room.gov={rmc:'Closed',npa:'Not required',bar:'Approved'};
    sys(room,'✦ Workflow complete — pilot exit signed. Every artifact remains reviewable in the Artifact Vault.',I,true);audit(room,'System','Workflow complete');return}
  const ns=stepStage(room,room.ptr);if(ns!==prev)enterStage(room,ns,I);
  const st=room.chain[room.ptr];if(st[0]==='@')requestGate(room,st.slice(1),I)}
function enterStage(room,sid,I){const s=STAGES[stageIdx(sid)];S.selStage=room.id===S.domain?null:S.selStage;
  sys(room,`Stage ${s.num} · ${s.title} is now live`,I);
  if(sid==='s3')room.gov={rmc:'In assessment',npa:'Screening',bar:'Not started'};
  if(sid==='s4')room.gov={rmc:'Rated: Medium',npa:'Not required',bar:'Drafted'};
  if(sid==='s5')room.gov={rmc:'Re-checked ✓',npa:'Not required',bar:'Submitted'};
  if(room.gov&&['s4','s5'].includes(sid))sys(room,'Governance track 3f re-checked at Stage '+s.num,I)}
function skipStage2(room){if(room.busy||curStage(room)!=='s2')return;room.skipped=true;
  post(room,{who:S.persona,kind:'text',html:'Let\'s skip Product Strategy for this one — it\'s optional.'});
  room.ptr=room.chain.findIndex((x,i)=>stepStage(room,i)==='s3');audit(room,PEOPLE[S.persona].name,'Skipped Stage 2 (optional)');
  enterStage(room,'s3');say(room,'Understood — Stage 2 skipped. Moving to <b>Project Initiation</b>. I\'ll start with the discovery interview when you\'re ready.');refresh()}

function requestGate(room,gid,I){const G=GATES[gid],d=DOMAINS[room.id];
  for(const k of G.files){let a=art(room,k);if(!a)a=addArt(room,k,{name:d.agent,ver:'1.0',stage:G.stage,needs:[]},'po',I);a.status='review'}
  room.gates[gid]={status:'pending',round:1,approvals:{},draft:''};
  post(room,{who:'agent',kind:'gate',gate:gid},I);
  for(const p of G.approvers)notify(room,p,`${gid} is waiting on you — ${d.short}`);
  audit(room,d.agent,`Requested ${gid} from ${G.approvers.map(p=>PEOPLE[p].name).join(' + ')}`);
  if(!I&&!S.auto){const p=G.approvers[0];if(p!==S.persona&&!G.commit)setTimeout(()=>{if(room.gates[gid].status==='pending'){post(room,{who:p,kind:'text',html:'Saw the ping — reviewing now.'});}},1500)}}

function approveGate(room,gid,by,I){const G=GATES[gid],g=room.gates[gid],d=DOMAINS[room.id];if(!g||g.status!=='pending')return;
  const authors=G.files.map(k=>art(room,k)?.author);
  if(!G.commit&&gid!=='EXIT'&&authors.includes(by)){toast('Separation of duties: the approver must differ from the author.');return}
  tick(room,I);g.approvals[by]={t:room.clock,sig:hash(gid+by+room.clock),note:g.draft};g.draft='';
  room.notifs.forEach(n=>{if(n.to===by&&n.text.startsWith(gid))n.read=true});
  audit(room,PEOPLE[by].name,`${G.commit?'Committed · closed':'Approved'} ${gid}`);
  if(G.approvers.every(p=>g.approvals[p])){g.status='cleared';
    for(const k of G.files){const a=art(room,k);a.status='approved';a.approval={gate:gid,by:G.approvers.map(p=>PEOPLE[p].name).join(' + '),t:room.clock,sig:g.approvals[by].sig};a.history.unshift({body:a.body,ver:a.ver,t:room.clock,by,note:'Approved at '+gid+' — locked'})}
    if(gid==='GW-I1')room.arts.forEach(a=>{if(a.dest==='ev')a.status='approved'});
    sys(room,`${gid} cleared by ${G.approvers.map(p=>PEOPLE[p].name).join(' + ')} · artifacts locked & committed to Working Hub`,I,true);
    if(gid==='GW-RD2'){sys(room,`Working Hub → Jira sync · ${d.epics.length} epics published with SIF label`,I);audit(room,'Working Hub','Jira sync: '+d.epics.length+' epics')}
    const m=room.msgs.find(x=>x.kind==='gate'&&x.gate===gid);if(m)rerender(room,m);
    advance(room,I)}
  else sys(room,`${PEOPLE[by].name} signed ${gid} · waiting on ${PEOPLE[G.approvers.find(p=>!g.approvals[p])].name}`,I);
  if(!I)refresh()}

async function requestChanges(room,gid){const g=room.gates[gid],G=GATES[gid],d=DOMAINS[room.id];if(room.busy)return;
  const c=g.draft.trim()||'Please tighten the NFR wording and cite the source for the timeline.';g.draft='';
  post(room,{who:S.persona,kind:'text',html:`<b>Requesting changes on ${gid}:</b> ${esc(c)}`});
  g.status='changes';room.busy=true;audit(room,PEOPLE[S.persona].name,`Requested changes on ${gid}: ${c}`);refresh();
  const m=post(room,{who:'agent',kind:'run',run:{skill:'revise',name:'revise-for-gate',ver:'1.0',steps:[],done:false,arts:[]}});
  for(const s of ['Reading reviewer feedback','Revising affected sections','Re-validating gate conditions']){m.run.steps.push(s);rerender(room,m);await sleep(500)}
  for(const k of G.files){const a=art(room,k);a.ver++;a.t=tick(room);a.body+=`\n## Revision v${a.ver}\n- Addressed reviewer feedback: “${c}”`;a.history.unshift({body:a.body,ver:a.ver,t:room.clock,by:'agent',note:'Revised after feedback at '+gid})}
  m.run.arts=[...G.files];m.run.done=true;rerender(room,m);
  g.round++;g.status='pending';room.busy=false;
  for(const p of G.approvers)notify(room,p,`${gid} resubmitted (round ${g.round}) — ${d.short}`);
  say(room,`Revised and resubmitted <b>${gid}</b> (round ${g.round}). The gate card above is live again.`);refresh()}

function ingest(room,g,by,I){tick(room,I);const id='SRC-'+String(room.sources.length+1).padStart(3,'0');
  room.sources.push({id,key:g.key||null,name:g.name||fileName(g.url),url:g.url,scope:g.scope||'Whole initiative',by,t:room.clock});

  say(room,`Ingested and indexed as <span class="src">${id}</span> (${esc(g.scope||'Whole initiative')}). I\'ll cite it inline wherever I use it.`,I);
  const m=room.msgs.find(x=>x.kind==='gap'&&x.gap.key===g.key);if(m)rerender(room,m);

async function autopilot(){const room=R();
  while(S.auto&&!room.done&&S.domain===room.id&&S.view==='room'){
    if(room.busy){await sleep(300);continue}
    const beat=demoBeat(room);if(beat){await beat.run();await sleep(2000);continue}
    const a=nextAction(room);if(!a)break;
    if(a.actor!==S.persona){S.persona=a.actor;refresh();toast('Now acting as '+PEOPLE[a.actor].name+' · '+PEOPLE[a.actor].abbr);await sleep(1300)}
    await perform(room,a,{auto:true});await sleep(2600)}
  S.auto=false;refresh()}

function msgHTML(room,m){
  if(m.kind==='sys')return `<div class="msg sys ${m.win?'win':''}" id="m${m.id}">${m.html}</div>`;
  const d=DOMAINS[room.id],ag=m.who==='agent',p=PEOPLE[m.who];
  let b='';
  if(m.kind==='text')b=`<div class="bub">${m.html}</div>`;
  else if(m.kind==='run'){const r=m.run;
    b=`<div class="runc"><div class="rh">${r.done?'<span style="color:var(--gr)">✓</span>':'<span class="spin"></span>'}<b>${esc(r.name)}</b><span class="role">v${r.ver}</span><span class="muted">${r.done?'completed':'running…'}</span></div>
      <div class="tr">${r.steps.map((s,i)=>`<div class="${!r.done&&i===r.steps.length-1?'cur':''}">${esc(s)}</div>`).join('')}</div>
      ${r.done?runCard(room,r)+`<div class="files">${r.arts.map(k=>fileChip(room,k)).join('')}</div>`+(()=>{const cs=r.arts.flatMap(k=>art(room,k)?.checks||[]),bad=cs.filter(c=>!c.ok).length;return cs.length?`<div class="contract ${bad?'bad':''}">Output contract · ${r.arts.length} output${r.arts.length>1?'s':''} · ${cs.length-bad}/${cs.length} acceptance checks passed${bad?' — review before the gate':''}</div>`:''})():''}</div>`}
  else if(m.kind==='gate')b=gateCard(room,m.gate);
  else if(m.kind==='gap'){const ok=room.sources.some(s=>s.key===m.gap.key);
    b=`<div class="gapc ${ok?'ok':''}"><b>${ok?'✓ Data gap resolved':'Data gap — I can\'t ground this skill yet'}</b>
      <div class="muted" style="margin:5px 0">Knowledge Hub (MCP) returned <b>0 grounded passages</b> for ${esc(m.gap.q)}. <span class="mono">${esc(m.skill)}</span> needs: <b>${esc(m.gap.label)}</b>.</div>
      ${ok?`<span class="src">${room.sources.find(s=>s.key===m.gap.key).id}</span> <span class="muted">ingested from SharePoint</span>`:`<div class="gact"><button class="btn pri" data-act="openIngest" data-arg="${m.gap.key}">Attach SharePoint link</button><span class="muted">I won\'t guess — attach the file and I\'ll ingest, index and cite it.</span></div>`}</div>`}
  else if(m.kind==='interview'){const iv=room.interview,mine=S.persona==='po';
    b=`<div class="ivc"><b>Discovery interview · sections A–G</b><div class="muted">Pre-filled from your Stage 1${room.skipped?'':'–2'} artifacts. Edit anything before I write solution intent.</div>
      ${Object.entries(IV_LABELS).map(([k,l])=>`<label>${l}<input data-iv="${k}" value="${esc(iv.answers[k])}" ${iv.submitted?'disabled':''}></label>`).join('')}
      ${iv.submitted?'<span class="stt approved">Submitted</span>':`<div class="gact"><button class="btn pri" data-act="next" ${mine?'':'disabled'}>Submit answers</button>${mine?'':'<span class="muted">Owned by the PO.</span>'}</div>`}</div>`}
  return `<div class="msg ${ag?'agent':''}" id="m${m.id}">${ag?'<div class="orb sm"></div>':av(m.who)}<div class="body"><div class="meta"><b>${ag?d.agent:p.name}</b>${ag?'<span class="role">AGENT</span>':`<span class="role">${p.abbr}</span>`} · ${fmtT(m.t)}</div>${b}${ag?threadHTML(room,m):''}</div></div>`}
function fileChip(room,k){const a=art(room,k);return a?`<button class="file" data-act="art" data-arg="${k}">${esc(a.name)} <span class="pill ${a.dest}">${DEST[a.dest]}</span></button>`:''}
function runCard(room,r){const d=DOMAINS[room.id];
  const kh=(r.kh||[]).map(id=>room.sources.find(x=>x.id===id)).filter(Boolean);
  const khNote=kh.length?`<div class="note ok"><b>Grounded in Knowledge Hub via MCP.</b> ${kh.length} document${kh.length>1?'s':''} retrieved from the knowledge base — no file upload needed: ${kh.map(x=>`<span class="src">${x.id}</span> ${esc(x.name)}`).join(' · ')}. Cited inline in the output.</div>`:'';
  return khNote+runCardBody(room,r)}
function runCardBody(room,r){const d=DOMAINS[room.id];
  if(r.card==='cos')return `<div class="cos"><div class="gauge" style="--v:${d.cos}"><b>${d.cos}</b></div><div class="bars">${d.cosParts.map(([a,v])=>`<div>${a}<i style="--w:${v}%"></i><b>${v}</b></div>`).join('')}</div></div>
    <div class="note ok"><b>COS ${d.cos} ≥ 70</b> — advisory threshold met. Sanity Suite 6/6 passed. Clear to advance.</div>`;
  if(r.card==='drift')return `<div class="note"><b>ACD drift detected.</b> ${d.apps[2]} changed owning team since Stage 3. I updated <span class="mono">app-context-registry.md</span> and flagged it in the deliverable.</div>`;
  if(r.card==='grades')return `<div class="note ok">Epic grades: ${d.epics.map((e,i)=>i===2?'B':'A').join(' · ')} — BAC present on all ${d.epics.length}. Eligible for GW-RD2.</div>`;
  return ''}
function gateCard(room,gid){const G=GATES[gid],g=room.gates[gid],cl=g.status==='cleared';
  const who=G.approvers.find(p=>!g.approvals[p]),mine=who===S.persona;
  const signed=Object.entries(g.approvals).map(([p,x])=>`<div class="muted">✓ ${PEOPLE[p].name} · ${fmtT(x.t)} · sig <span class="mono">${x.sig}</span>${x.note?' · “'+esc(x.note)+'”':''}</div>`).join('');
  return `<div class="gatec ${cl?'cleared':''}"><div class="rh" style="display:flex;gap:8px;align-items:center"><span class="chip ${G.cls} ${cl?'cleared':'pending'}">${gid}</span><b>${G.name}</b>
     <span class="stt ${cl?'approved':'review'}" style="margin-left:auto">${cl?'CLEARED':g.status==='changes'?'CHANGES REQUESTED':'AWAITING '+(G.commit?'COMMIT':'APPROVAL')+(g.round>1?' · ROUND '+g.round:'')}</span></div>
   <div class="gq">“${G.q}”</div><div class="files" style="margin:0">${G.files.map(k=>fileChip(room,k)).join('')}</div>
   <ul class="checks">${G.checks.map(c=>`<li>${c}</li>`).join('')}</ul>${signed}
   ${cl?'':g.status==='changes'?'<div class="muted">Agent is revising…</div>':mine?`
     ${G.commit?'':`<textarea rows="2" placeholder="Optional comment for the record…" data-gc="${gid}">${esc(g.draft)}</textarea>`}
     <div class="gact"><button class="btn ok" data-act="approve" data-arg="${gid}">${G.commit?'Commit to Working Hub · closes gate':gid==='EXIT'?'Sign off':'Approve & lock artifacts'}</button>
     ${G.commit||gid==='EXIT'?'':`<button class="btn warn" data-act="changes" data-arg="${gid}">Request changes</button>`}</div>`
   :`<div class="gact">${av(who,'sm')}<span>Waiting on <b>${PEOPLE[who].name}</b> (${PEOPLE[who].abbr})</span><button class="btn" data-act="nudge" data-arg="${gid}">Nudge</button><button class="btn" data-act="persona" data-arg="${who}">Switch to ${PEOPLE[who].name.split(' ')[0]}</button></div>`}</div>`}

const SPEEDS=[[.5,'Slow'],[1,'Normal'],[3,'Fast']];
function guideHTML(room){if(S.guide!=='full')return '';const a=nextAction(room);let t,why,what;
  if(!a){t='Workflow complete';why='All six gates are cleared and every artifact is stored with its lineage and approval record.';what='Open the Artifact Vault to review any artifact, or open Skill Studio and switch to the steward to edit a skill. Use ↺ to start again.'}
  else{const p=PEOPLE[a.actor],mine=a.actor===S.persona,sw=`Click <b>${p.name}</b> in the Squad list to act as the ${p.role}, then `;
    if(a.type==='skill'){const sk=a.skill;t='Run '+sk.name;
      why=esc(sk.desc)+(sk.needs.length?' Draws on: '+[...new Set(sk.needs.map(n=>VIA[n.via]))].join(', ')+'.':'')+(unsatGap(room,sk)?' Watch for a data gap — Knowledge Hub doesn\'t hold everything this skill needs.':'')+(sk.needs.some(n=>n.khdoc&&!room.sources.some(x=>x.key===n.khdoc.key))?' Watch the agent retrieve its source documents straight from Knowledge Hub over MCP.':'')+(sk.interview&&!room.interview?' The agent will open the discovery interview first.':'');
      what=(mine?'Click':sw+'click')+` <b>▶ Run ${esc(sk.name)}</b> under the chat (or type “run it”).`+(sk.stage==='s2'?' Stage 2 is optional — the PO can also choose <b>Skip Stage 2</b>.':'')}
    else if(a.type==='ingest'){t='Resolve the data gap';why=`The agent won\'t guess. Knowledge Hub returned nothing for ${esc(a.gap.label)}, so the skill is paused until a file is supplied.`;
      what=(mine?'On':sw+'on')+' the red card click <b>Attach SharePoint link</b>, choose <b>Use demo link</b>, then <b>Ingest</b>. The file gets a SRC-ID the agent must cite.'}
    else if(a.type==='answer'){t='Review the discovery interview';why='Sections A–G are pre-filled from earlier artifacts. Whatever is submitted is written into solution-intent.md.';
      what=(mine?'Edit':sw+'edit')+' any answer in the interview card, then click <b>Submit answers</b>.'}
    else if(a.type==='commit'){t='Commit the implementation plan';why='GW-B1 has no separate approver — it closes when the Engineering Lead commits the plan to Working Hub.';
      what=(mine?'Open':sw+'open')+' implementation-plan.md from the gate card if you want to read it, then click <b>Commit to Working Hub</b>.'}
    else{const G=GATES[a.gate];t=(a.gate==='EXIT'?'Sign ':'Decide ')+a.gate+' · '+G.name;
      why=`Gate question: “${G.q}” The workflow is paused until ${p.name} (${p.abbr}) decides${a.gate==='EXIT'?'':'; the approver must differ from the author'}.`;
      what=mine?'Open the files on the gate card to review them — you can edit one yourself or revise it with the agent first — then approve'+(a.gate==='EXIT'?'.':' — or try <b>Request changes</b> to watch the agent revise and resubmit.')
        :`Notice the alert tag on ${p.name} in the Squad list — that is who everyone is waiting on. Click their name to act as them, then decide on the gate card.`}}
  const sp=SPEEDS.find(x=>x[0]===S.speed)||[S.speed,S.speed+'×'];
  return `<div class="guide"><div><div class="gk">Guide · ${a?`step ${room.ptr+1} of ${room.chain.length} · Stage ${STAGES[stageIdx(curStage(room))].num}`:'finished'}</div><h4>${t}</h4>
    <p><b class="l">Why</b>${why}</p><p><b class="l">Try it</b>${what}</p></div>
    <div class="gctl">${a?`<button class="btn pri" data-act="step" ${S.auto?'disabled':''} title="Performs just this one step, then stops">Do this step for me ▸</button>
      <div><button class="btn ${S.auto?'warn':''}" data-act="auto">${S.auto?'⏸ Pause':'▶ Auto-play'}</button><button class="btn" data-act="speed" title="Pace of agent runs and auto-play">${sp[1]}</button></div>`:''}</div></div>`}

function md(srcTxt){if(srcTxt.startsWith('<!raw>'))return srcTxt.slice(6);
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(SRC-\d+)\]/g,'<span class="src">$1</span>');
  let h='',ul=false,tb=false;const close=()=>{if(ul){h+='</ul>';ul=false}if(tb){h+='</table>';tb=false}};
  for(const l of srcTxt.split('\n')){
    if(l.startsWith('# ')){close();h+=`<h1>${inl(l.slice(2))}</h1>`}
    else if(l.startsWith('## ')){close();h+=`<h2>${inl(l.slice(3))}</h2>`}
    else if(l.startsWith('- ')){if(tb)close();if(!ul){h+='<ul>';ul=true}h+=`<li>${inl(l.slice(2))}</li>`}
    else if(l.startsWith('|')){if(ul)close();const c=l.split('|').slice(1,-1).map(x=>x.trim());if(c.every(x=>/^-+$/.test(x)))continue;const t=tb?'td':'th';if(!tb){h+='<table>';tb=true}h+='<tr>'+c.map(x=>`<${t}>${inl(x)}</${t}>`).join('')+'</tr>'}
    else if(l.startsWith('> ')){close();h+=`<blockquote>${inl(l.slice(2))}</blockquote>`}
    else if(!l.trim())close();else{close();h+=`<p>${inl(l)}</p>`}}
  close();return h}

/* ---------- chat brain ---------- */
function agentReply(room,text){const t=text.toLowerCase(),d=DOMAINS[room.id],a=nextAction(room);
  const g=GLOSSARY.find(x=>new RegExp('(^|[^a-z0-9-])'+x[0].toLowerCase().replace(/[-]/g,'\\-')+'($|[^a-z0-9-])').test(t));
  if(/what('s| is| does)|meaning|define|stand for/.test(t)&&g)return `<b>${g[0]}</b> — ${g[1]}. ${g[2]}`;
  if(/status|where are we|progress|what.s next|whats next/.test(t)){const s=STAGES[stageIdx(curStage(room))];
    return room.done?'The workflow is complete. All six gates are cleared and every artifact is in the Vault.':`We\'re in <b>Stage ${s.num} · ${s.title}</b>. ${room.arts.length} artifacts so far, ${Object.values(room.gates).filter(x=>x.status==='cleared').length}/6 gates cleared. Next: <b>${actionLabel(a)}</b> — owned by ${PEOPLE[a.actor].name} (${PEOPLE[a.actor].abbr}).`}
  if(/skip/.test(t)&&curStage(room)==='s2'){setTimeout(()=>skipStage2(room),50);return null}
  if(/approve|lgtm|sign/.test(t)&&a&&(a.type==='approve'||a.type==='commit')){if(a.actor===S.persona){setTimeout(()=>approveGate(room,a.gate,S.persona),50);return `Recording your ${a.type==='commit'?'commit':'approval'} on ${a.gate}.`}return `${a.gate} can only be decided by ${PEOPLE[a.actor].name} (${PEOPLE[a.actor].abbr}). I\'ve nudged them.`}
  if(/\b(run|go|start|continue|proceed|next|do it|kick off)\b/.test(t)&&a){if(a.actor!==S.persona)return `That step — <b>${actionLabel(a)}</b> — is owned by ${PEOPLE[a.actor].name} (${PEOPLE[a.actor].abbr}). I can\'t run it on your behalf.`;
    if(a.type==='approve'||a.type==='commit')return `The next step is your decision on ${a.gate} — use the gate card above.`;if(room.busy)return 'Give me a moment — I\'m still finishing the current skill.';setTimeout(()=>perform(room,a),50);return null}
  if(/source|sharepoint|file|upload|attach/.test(t))return 'I ground skills through MCP connections to Knowledge Hub, Working Hub, Jira and Confluence. If those don\'t have what a skill needs, attach a SharePoint link — use <b>＋ SharePoint source</b> below and I\'ll index it and assign a SRC-ID.';
  if(g)return `<b>${g[0]}</b> — ${g[1]}. ${g[2]}`;
  audit(room,d.agent,'Captured note to session record');
  return `Noted — I\'ve added that to the session record so it carries into the next artifact.${a?` When you\'re ready, the next step is <b>${actionLabel(a)}</b> (${PEOPLE[a.actor].abbr}).`:''}`}
function send(text){text=text.trim();if(!text)return;const room=R();
  post(room,{who:S.persona,kind:'text',html:esc(text)});
  $('#typing').textContent=D().agent+' is thinking…';
  setTimeout(()=>{$('#typing').textContent='';const r=agentReply(room,text);if(r)say(room,r);refresh()},650)}

let AV=null;
function openArt(key){if(!art(R(),key))return;AV={key,mode:'view',ver:null,draft:'',chat:[],prop:null};renderArt()}
function commitVersion(room,a,body,by,note){tick(room);a.ver++;a.body=body;a.t=room.clock;a.history.unshift({body,ver:a.ver,t:room.clock,by,note});
  audit(room,PEOPLE[by].name,`${note} — ${a.name} v${a.ver}`);sys(room,`${a.name} → v${a.ver} · ${note} · ${PEOPLE[by].name}`);
  const pg=pendingGate(room);if(a.status==='review'&&pg&&pg.gid===a.gate&&pg.who!==by)notify(room,pg.who,`${a.name} changed to v${a.ver} while in your review — ${DOMAINS[room.id].short}`);
  refresh();if(S.view==='vault')renderVault()}
function renderArt(){const room=R(),d=D(),a=AV&&art(room,AV.key);if(!a)return closeModal();
  const locked=a.status==='approved',raw=a.body.startsWith('<!raw>'),can=!locked&&!raw;
  const why=locked?'Approved artifacts are locked and cannot be changed':raw?'Generated chart — re-run the skill to change it':'';
  const old=AV.ver&&AV.ver!==a.ver?a.history.find(h=>h.ver===AV.ver&&h.body):null;
  const pg=pendingGate(room),isApprover=pg&&a.gate===pg.gid&&pg.who===S.persona;
  let doc;
  if(AV.mode==='edit')doc=`<div class="note">Editing the source directly. Saving creates <b>v${a.ver+1}</b>; earlier versions stay in the history.${isApprover?` You are the approver for ${a.gate}, so this will be recorded as a reviewer edit.`:''}</div>
    <textarea id="artEd" class="mono arted" spellcheck="false">${esc(AV.draft)}</textarea>
    <div class="gact" style="justify-content:flex-end"><button class="btn" data-act="artMode" data-arg="view">Cancel</button><button class="btn pri" data-act="artSave">Save as v${a.ver+1}</button></div>`;
  else if(AV.prop!=null)doc=`<div class="note"><b>Proposed revision — not saved yet.</b> Keep refining it in the conversation, or apply it.
    <div class="gact"><button class="btn pri" data-act="artApply">Apply as v${a.ver+1}</button><button class="btn" data-act="artDiscard">Discard</button></div></div>${md(AV.prop)}`;
  else if(old)doc=`<div class="note">Viewing <b>v${old.ver}</b> (read-only). <button class="btn" data-act="artVer" data-arg="0">Back to current v${a.ver}</button></div>${md(old.body)}`;
  else doc=md(a.body);
  const side=AV.mode==='ai'?`<div class="metaP aic"><div class="aih"><div class="orb sm"></div><div><b>Revise with ${d.agent}</b><div class="muted">Describe the change. Nothing is saved until you apply it.</div></div></div>
     <div class="ail" id="ail">${AV.chat.map(m=>`<div class="aim ${m.who}">${m.html}</div>`).join('')||'<div class="muted">Try a suggestion below, or type your own instruction.</div>'}</div>
     <div class="sugs">${['Make it more concise','Lead with a BLUF','Add a risk about certification timing','Replace "PI 27.1" with "PI 27.2"'].map(x=>`<button class="sug" data-act="artAsk" data-arg="${esc(x)}">${esc(x)}</button>`).join('')}</div>
     <div class="inrow"><input id="aiIn" placeholder="e.g. add an NFR about audit logging" autocomplete="off"><button class="btn pri" data-act="artAskSend">Send</button></div>
     <button class="btn" data-act="artMode" data-arg="view">Back to details</button></div>`
   :`<div class="metaP">${locked?`<div class="lock">◆ <b>Approved & locked</b>${a.approval?`<br>${a.approval.gate} · ${a.approval.by}<br>${fmtT(a.approval.t)} · sig <span class="mono">${a.approval.sig}</span>`:'<br>Committed as Working Hub evidence'}</div>`:`<span class="stt ${a.status}">${a.status}</span>`}
    <dl><dt>Destination</dt><dd><span class="pill ${a.dest}">${DEST[a.dest]}</span> ${a.note?`<span class="muted">${a.note}</span>`:''}</dd>
    <dt>Gate</dt><dd>${a.gate?`${a.gate} — ${GATES[a.gate].name}`:'— not a gate'}</dd>
    <dt>Lineage</dt><dd>${d.agent} · <span class="mono">${esc(a.skill)} v${a.skillVer}</span><br>Requested by ${PEOPLE[a.author]?.name||a.author}<br><span class="muted">Stage ${STAGES[stageIdx(a.stage)].num} · ${STAGES[stageIdx(a.stage)].title}</span></dd>
    <dt>Grounded in</dt><dd>${[...new Set(a.via)].map(v=>`<span class="role">${VIA[v]}</span>`).join(' ')||'<span class="muted">session context</span>'}<br>${a.cites.map(c=>`<span class="src">${c}</span>`).join(' ')}</dd>
    ${a.checks?`<dt>Output contract</dt><dd><span class="muted">Template: ${esc(a.skill)}${a.tplEdited?' · customized':' · standard'}</span>${a.checks.map(c=>`<div class="ck ${c.ok?'':'bad'}">${c.ok?'✓':'✗'} ${esc(c.c)}</div>`).join('')}</dd>`:''}
    <dt>Version history</dt><dd>${a.history.map(h=>`<button class="log" ${h.body?`data-act="artVer" data-arg="${h.ver}" title="View this version"`:''}><b>v${h.ver}</b> · ${fmtT(h.t)}${PEOPLE[h.by]?' · '+PEOPLE[h.by].name:''}<br>${esc(h.note)}</button>`).join('')}</dd></dl></div>`;
  modal(`<div class="mod artv ${AV.mode==='ai'?'ai':''}"><div class="doc"><div class="mh" style="margin:-20px -26px 14px;padding:12px 26px"><h3 class="mono">${esc(a.name)} <span class="role">v${a.ver}</span></h3>
     <button class="btn" data-act="artMode" data-arg="edit" ${can?'':'disabled'} title="${why||'Edit the text yourself'}">Edit</button>
     <button class="btn ${can?'pri':''}" data-act="artMode" data-arg="ai" ${can?'':'disabled'} title="${why||'Talk the change through with the agent'}">Revise with agent</button>
     <button class="btn" data-act="dl" data-arg="${AV.key}">Download</button><button class="x" data-act="close">✕</button></div>${doc}</div>${side}</div>`);
  const l=$('#ail');if(l)l.scrollTop=l.scrollHeight;if(AV.mode==='ai')$('#aiIn')?.focus()}
function lineDiff(a,b){const A=a.split('\n'),B=b.split('\n');return {add:B.filter(l=>l.trim()&&!A.includes(l)),del:A.filter(l=>l.trim()&&!B.includes(l))}}
function reviseBody(body,text){const t=text.trim(),lo=t.toLowerCase();let L=body.split('\n'),what;
  const m=t.match(/(?:change|replace|rename|swap)\s+["“']?(.+?)["”']?\s+(?:to|with|for)\s+["“']?(.+?)["”']?\.?$/i);
  if(m){if(!body.includes(m[1]))return {none:`I couldn't find “${esc(m[1])}” in this artifact, so I left it unchanged. Quote the exact wording and I'll swap it.`};
    L=body.split(m[1]).join(m[2]).split('\n');what=`Replaced “${esc(m[1])}” with “${esc(m[2])}” throughout.`}
  else if(/\b(remove|delete|drop|cut|strike)\b/.test(lo)){
    const kw=lo.replace(/.*\b(remove|delete|drop|cut|strike)\b/,'').split(/\W+/).filter(w=>w.length>2&&!['the','any','all','section','line','lines','bullet','bullets','row','rows','about','mention','mentions','reference','references','that','from','out'].includes(w));
    const keep=L.filter(l=>l.startsWith('#')||!kw.some(k=>l.toLowerCase().includes(k)));
    if(!kw.length||keep.length===L.length)return {none:'I couldn\'t find anything matching that to remove. Name a word or phrase from the line you want gone.'};
    what=`Removed ${L.length-keep.length} line(s) mentioning “${esc(kw.join(' '))}”.`;L=keep}
  else if(/\b(concise|shorter|shorten|tighten|trim|brief|simplif\w*)\b/.test(lo)){let n=0,b=0;const out=[];
    for(const l of L){if(l.startsWith('#')){b=0;out.push(l)}else if(l.startsWith('- ')){if(++b<=3)out.push(l);else n++}
      else if(l.startsWith('|')||l.startsWith('>')||!l.trim())out.push(l);else{const s=l.split(/(?<=\.)\s/)[0];if(s!==l)n++;out.push(s)}}
    if(!n)return {none:'This is already as tight as I can make it without dropping content the gate requires.'};
    L=out;what=`Tightened it: kept the lead sentence of each paragraph and the first three bullets per section (${n} cut${n>1?'s':''}).`}
  else if(/\b(bluf|bottom line|executive summary|summary up front)\b/.test(lo)){
    if(L.some(l=>l.includes('**BLUF:**')))return {none:'This artifact already opens with a BLUF.'};
    L.splice(L.findIndex(l=>l.startsWith('# '))+1,0,`> **BLUF:** ${D().outcome} Decision needed: confirm scope and proceed.`);what='Added a BLUF directly under the title, so a reader can act on the first sentence.'}
  else{const c=t.replace(/^(please\s+)?(can you\s+|could you\s+)?(add|include|mention|note|insert|append|call out|state)\s+(that\s+)?/i,'').replace(/\.$/,'');
    const words=lo.split(/\W+/).filter(w=>w.length>2&&!['add','the','and','for','about','that','with','this','include','mention','note','section','please','under','into','can','you','could'].includes(w));
    if(words.includes('nfr'))words.push('non-functional','constraint');if(words.includes('risk'))words.push('governance');
    const hi=L.findIndex(l=>l.startsWith('## ')&&words.some(w=>l.toLowerCase().includes(w.replace(/s$/,''))));
    const line='- '+c.charAt(0).toUpperCase()+c.slice(1);
    if(hi<0){L.push('## Additional notes',line);what='Added it as a new “Additional notes” section, since no existing section was an obvious home.'}
    else{let j=hi+1;while(j<L.length&&!L[j].startsWith('## '))j++;while(j>hi+1&&!L[j-1].trim())j--;L.splice(j,0,line);what=`Added it under “${esc(L[hi].slice(3))}”.`}}
  return {body:L.join('\n'),what}}
async function artRevise(text){text=(text||'').trim();if(!text||!AV)return;const key=AV.key,a=art(R(),key),base=AV.prop??a.body;
  AV.chat.push({who:'me',html:esc(text)},{who:'ag',html:'<span class="spin" style="display:inline-block"></span> Revising…'});renderArt();await sleep(900);
  if(!AV||AV.key!==key)return;AV.chat.pop();const r=reviseBody(base,text);
  if(r.none)AV.chat.push({who:'ag',html:r.none});
  else{const df=lineDiff(base,r.body);AV.prop=r.body;
    AV.chat.push({who:'ag',html:`${r.what} Review the proposed draft on the left.<div class="dif">${df.add.slice(0,5).map(l=>`<div class="ad">+ ${esc(l)}</div>`).join('')}${df.del.slice(0,5).map(l=>`<div class="dl">− ${esc(l)}</div>`).join('')}${df.add.length+df.del.length>10?'<div>…</div>':''}</div>`})}
  renderArt()}
Object.assign(ACT,{
 artMode(m){const a=art(R(),AV.key);AV.mode=m;AV.ver=null;if(m==='edit'){AV.draft=AV.prop??a.body;AV.prop=null}renderArt()},
 artVer(v){AV.ver=+v||null;AV.mode='view';AV.prop=null;renderArt()},
 artSave(){const room=R(),a=art(room,AV.key),pg=pendingGate(room);if(AV.draft===a.body)return toast('No changes to save');
   commitVersion(room,a,AV.draft,S.persona,pg&&a.gate===pg.gid&&pg.who===S.persona?'Reviewer edit':'Manual edit');AV.mode='view';renderArt();toast(a.name+' saved as v'+a.ver)},
 artAsk(x){artRevise(x)},
 artAskSend(){const i=$('#aiIn'),v=i.value;i.value='';artRevise(v)},
 artApply(){const room=R(),a=art(room,AV.key);commitVersion(room,a,AV.prop,S.persona,'Revised with '+D().agent);AV.prop=null;
   AV.chat.push({who:'ag',html:`Saved as <b>v${a.ver}</b>. The previous version is kept in the history.`});renderArt()},
 artDiscard(){AV.prop=null;AV.chat.push({who:'ag',html:'Discarded — the artifact is unchanged. Tell me what to try instead.'});renderArt()}

  else if(t.id==='vq'){S.vq=t.value;const p=t.selectionStart;renderVault();const n=$('#vq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(S.slash&&e.target.id==='msgin'&&slashKey(e))return;if(e.key==='Enter'&&e.target.id==='msgin'){if(e.target.value.startsWith('/'))return;ACT.send()}if(e.key==='Enter'&&e.target.id==='aiIn')ACT.artAskSend();if(e.key==='Enter'&&e.target.dataset.th)ACT.thSend(e.target.dataset.th);if(e.key==='Escape')closeModal()});
setInterval(()=>{const el=$('#elevT');if(!el)return;const left=Math.round((S.elev[S.domain]-Date.now())/1000);if(left<=0){renderStudio();toast('Elevated session expired');return}el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},1000);
window.addEventListener('error',e=>toast('Script error: '+e.message));

function refresh(){renderTop();renderPet();if(S.view!=='room')return;renderRail();renderLeft();renderChatHead();refreshDyn();renderComp();renderRight()}
function renderAll(){renderView();renderTop();if(S.view==='room'){renderRail();renderLeft();renderChatHead();renderChat();renderComp();renderRight()}renderPet();renderSlash()}

/* ---------- boot ---------- */
S.pet='bot'; // always start with Byte, the robot
S.noleft=true;S.norail=true;S.noright=false; // v4 always opens with workflow + squad minimized, detail panel open
try{if(localStorage.getItem('sr-theme')==='light')S.theme='light';const sp=localStorage.getItem('sr5-palette');if(PALETTES[sp])S.palette=sp;const sf=localStorage.getItem('sr5-font');if(FONTS[sf])S.font=sf}catch(e){}
async function boot(){
  Object.assign(S,{created:{pbi:true,pricing:true},land:{beat:0,hl:null,tab:'mine',q:'',req:{},create:null,spin:null,busy:false},domain:'vault',persona:'pl',view:'landing',tab:'stage',selStage:null,menu:null,auto:false,rooms:{},skills:{},tpl:{},elev:{},edit:null});
  for(const id of Object.keys(DOMAINS)){initSkills(id);const room=S.rooms[id]=newRoom(id),d=DOMAINS[id];
    room.clock=Date.now()-3*864e5;
    sys(room,`Room opened · ${d.agent} joined · ${Object.keys(PEOPLE).length} squad members`,true);
    post(room,{who:'po',kind:'text',html:esc(d.idea)},true);
    say(room,`Hi squad — I\'m the <b>${d.agent}</b>. I\'ll take this through the PDLC with you, one stage at a time, and I\'ll stop at every gate for a human decision. I can start with <span class="mono">intake-builder</span> on Priya\'s idea whenever you\'re ready.`,true)}
  await fastForward(S.rooms.pricing,'@GW-RD1');
  await fastForward(S.rooms.pbi,'@GW-I2');
  const q=new URLSearchParams(location.search);
  if(q.has('room')||q.has('demo')||q.get('domain')||q.get('view')||q.get('skill')||q.get('art')){createRoom('vault',{name:DEMO_ROOM.name,bg:DEMO_ROOM.bg,owner:'pl',inv:['po','ar','eng','ux'],vis:'request'});S.view='room';if(!q.get('as'))S.persona='po'}
  if(DOMAINS[q.get('domain')])S.domain=q.get('domain');if(PEOPLE[q.get('as')])S.persona=q.get('as');if(['vault','studio'].includes(q.get('view')))S.view=q.get('view');
  renderAll();
  if(q.get('left'))S.noleft=q.get('left')!=='open';if(q.get('rail'))S.norail=q.get('rail')==='min';if(q.get('right'))S.noright=q.get('right')==='min';
  if(q.get('pet'))S.pet=q.get('pet');if(q.get('slash'))S.slash={level:q.get('slash'),idx:0};
  if(PALETTES[q.get('palette')])S.palette=q.get('palette');if(FONTS[q.get('font')])S.font=q.get('font');
  if(q.get('theme')==='light')S.theme='light';
  renderAll();
  if(q.get('tsec')){const [k,h]=q.get('tsec').split(':');const t=tplOf(S.domain,k);t.sections.push({h,orig:null,guide:'Key risks and mitigations'});t.edited=true}
  if(q.get('skill'))ACT.editSkill(q.get('skill'));if(q.get('tpl')){if(q.has('elev'))S.elev[S.domain]=Date.now()+6e5;ACT.tplOpen(q.get('tpl'));if(q.has('prev'))ACT.tplPreview()}
  if(q.get('art')){openArt(q.get('art'));if(q.has('edit'))ACT.artMode('edit');if(q.get('ask')){ACT.artMode('ai');ACT.artAsk(q.get('ask'))}}
  if(q.get('stage')){ACT.selStage(q.get('stage'))}
  if(q.get('menu')){S.menu=q.get('menu');renderTop()}
  if(q.get('ltab')){S.land.tab=q.get('ltab');S.land.q=q.get('lq')||'';renderLanding()}
  if(q.has('form')){S.land.create={name:DEMO_ROOM.name,bg:DEMO_ROOM.bg,domain:'vault',inv:['po'],vis:'request',pq:q.get('pq')||'',hot:q.has('hot')};renderLanding()}
  if(q.get('steps')){S.speed=6;for(let i=0;i<+q.get('steps');i++){while(S.land.busy||R().busy)await sleep(100);await demoNext();await sleep(300);while(S.land.busy||R().busy)await sleep(100)}if(q.get('tab')){S.tab=q.get('tab');renderRight()}}
  if(q.has('demo')){S.speed=6;ACT.auto()}
}
boot();
</script>
</body>
</html>
