# retrieval_config.yaml — the tunable numbers behind the two-level funnel (FR-SI-03, D-A18).
#
# Level 1 of the funnel is deterministic and needs no config: `disposition ∈ section.classes`
# per the D-A13 matrix. Level 2 — "read whole, or consult the index?" — needs numbers, and
# D-A18 is explicit that they are **calibrated, never hardcoded**: the real constraint is the
# context budget left after a section's other inputs (its `must_capture`, the frame, the draft
# so far), which depends on the model's window. So they live here, in one file, as data.
#
# NOT in `UI_INPUT.yaml`: these are properties of the model and the corpus, not per-run
# operator config, and §3.1's ADR-008 amendment pins exactly two additions (`disposition`,
# `frame.overview`). NOT in the domain pack either — retrieval is domain-agnostic (D-A18's
# fourth rule: the index describes the document, never the destination).
#
# Consumers: `core/skills/doc_index.skill.md` (subdivision), the SI author's selection step
# (whole-read decision), `core/scripts/checks/check_index_completeness.py` (guardrail 7).

# ── Level 2: whole-read vs index-guided ───────────────────────────────────────────────────
# Checked across the routed **SET**, never per document (D-A18, FR-SI-03). Five 10-page
# documents are each under threshold but collectively fifty pages; per-file checking would
# wave the whole set through. If the set is over, switch its LARGEST members to index-guided
# retrieval first — that buys the most budget per document demoted.
whole_read_threshold_lines: 500      # ≈10–15 pages of wrapped extract; a defensible start,
                                     # to be recalibrated against real corpora and windows.

# ── Index granularity ─────────────────────────────────────────────────────────────────────
# An index entry is one semantic subsection. Above this many lines an entry is too coarse to
# be a useful selection unit, so it is SUBDIVIDED along a content seam (never a page break)
# and the split is recorded in the index's `subdivided[]` — synthetic boundaries are auditable,
# never silent (D-A18 rule 2).
max_entry_lines: 25

# ── Extraction ────────────────────────────────────────────────────────────────────────────
# Prose is wrapped at this width when a document is extracted to Markdown. This is not
# cosmetic: `lines` is the unit the index selects in and the author pulls by, so an extract
# that puts a 200-word clause on one physical line makes every line range degenerate.
extract_wrap_columns: 100
