<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro Squad Room · v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&family=Syne:wght@500;600;700&family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f; --bg2:#0f1216; --panel:#111418; --panel2:#151920;
  --line:rgba(236,232,225,.09); --line2:rgba(236,232,225,.2);
  --text:#ece8e1; --mut:#a09b91; --dim:#726e66; --soft:#d2cdc3;
  --cy:#8fb8c9; --vi:#a79bd0; --mg:#c99ab0; --gr:#86c2a0; --am:#d8a94e; --rd:#d98274; --bl:#8fa9cf;
  --ac:#c9a66b; --ac2:#e6d3ac;
  --solid:#12151a; --bar:rgba(10,12,15,.84); --card2:#0e1114; --on-ac:#14110a;
  --t-pl:#a9bfdf; --t-po:#9fd0b4; --t-eng:#bdb9b0;--t-tl:#dcc995; --t-am:#e2bd72; --t-vi:#c2b8e6;
  --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
  --head:"Fraunces","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme=light]{
  --bg:#f5f2ec; --bg2:#fff; --panel:#fffdf9; --panel2:#fff;
  --line:rgba(30,28,22,.1); --line2:rgba(30,28,22,.24);
  --text:#1a1c20; --mut:#5f5b53; --dim:#8a857b; --soft:#34363b;
  --cy:#3a7a90; --vi:#5d4fa3; --mg:#9c4f70; --gr:#2f7d58; --am:#9a6a10; --rd:#b24a3c; --bl:#3d629c;
  --solid:#fffdf9; --bar:rgba(250,248,243,.9); --card2:#fbf9f4; --on-ac:#fff;
  --t-pl:#3d629c; --t-po:#2f7d58; --t-eng:#5f5b53;--t-tl:#7a6526; --t-am:#8a5d0c; --t-vi:#5d4fa3;
}
:root[data-theme=light] #modal{background:rgba(40,36,28,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr;min-width:1180px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;transition:background .8s;
  background:radial-gradient(1100px 420px at 50% -160px,color-mix(in srgb,var(--ac) 13%,transparent),transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 96px);
  mask-image:linear-gradient(180deg,#000,transparent 55%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line2);border-radius:3px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ac)}
code,.mono{font-family:var(--mono);font-size:.9em}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2)}

/* top bar */
#top{display:flex;align-items:center;gap:9px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--bar);backdrop-filter:blur(16px);position:relative;z-index:30}
.brand{white-space:nowrap;display:flex;align-items:center;gap:11px;font:500 17px var(--head);letter-spacing:.01em}
.brand i{color:var(--ac);font-weight:400}
.brand small{white-space:nowrap;display:block;font:500 9px var(--mono);color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
.logo{width:30px;height:30px;border:1px solid var(--ac);display:grid;place-items:center;position:relative}
.logo::before{content:"";position:absolute;inset:3px;border:1px solid color-mix(in srgb,var(--ac) 35%,transparent)}
.logo::after{content:"N";font:500 15px var(--head);color:var(--ac)}
nav{display:flex;gap:16px;margin:0 6px 0 10px}
nav button{white-space:nowrap;padding:6px 0;color:var(--mut);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid transparent}
nav button.on{color:var(--text);border-color:var(--ac)}
.domains{display:flex;gap:0;border:1px solid var(--line2);border-radius:3px}
.dom{display:flex;align-items:center;gap:7px;padding:6px 11px;color:var(--mut);position:relative;font-size:12px}
.dom+.dom{border-left:1px solid var(--line2)}
.dom i{width:6px;height:6px;background:var(--c);transform:rotate(45deg)}
.dom.on{color:var(--text);background:color-mix(in srgb,var(--c) 14%,transparent)}
.dom .pend{position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--am);border:2px solid var(--bg)}
.dom .pend.me{animation:pulse 1.4s infinite}
.sp{flex:1}
.psw{width:9px;height:9px;transform:rotate(45deg);display:inline-block;margin-right:3px}
.sws{display:inline-flex;gap:3px;padding:7px 6px;border:1px solid var(--line2);border-radius:3px}.sws i{width:8px;height:8px;border-radius:50%}
.tb{padding:6px 10px;border:1px solid var(--line2);border-radius:3px;color:var(--mut);display:inline-flex;align-items:center;gap:7px;position:relative;white-space:nowrap;font-size:12px}
.tb:hover{color:var(--text);border-color:var(--ac)}
.tb.go{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:600}
.tb.stop{background:var(--rd);color:#fff;border:0}
.badge{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:var(--am);color:var(--on-ac);font:600 9.5px/16px var(--mono);text-align:center;padding:0 4px}
.menu{position:absolute;top:calc(100% + 8px);right:0;width:310px;background:var(--solid);border:1px solid var(--line2);border-radius:4px;padding:6px;box-shadow:0 24px 70px rgba(0,0,0,.45);z-index:50;text-align:left;white-space:normal}
.menu .mi{display:flex;gap:10px;align-items:center;padding:9px;width:100%;text-align:left;color:var(--text)}
.menu .mi:hover{background:var(--line)}
.menu .mi small{color:var(--mut);display:block}
.menu h6{margin:8px 9px;font:500 9.5px var(--mono);color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font:500 10px var(--mono);color:var(--c,#888);border:1px solid var(--c,#888);background:color-mix(in srgb,var(--c,#888) 10%,transparent);flex:none;position:relative}
.av.sm{width:20px;height:20px;font-size:8px}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:var(--gr);border:2px solid var(--bg)}

/* rail — a timeline */
#rail{padding:16px 22px 10px;border-bottom:1px solid var(--line)}
.railgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 0}
.st{position:relative;display:block;text-align:left;border-top:1px solid var(--line2);padding:12px 16px 6px 0;min-width:0;transition:.4s}
.st::after{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--line2)}
.st .ph{font:500 9px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.st .hd{font:500 15px var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.st .hd .n{font-style:italic;color:var(--ac);margin-right:8px}
.st .dots{display:flex;gap:3px;margin:8px 0 7px;align-items:center;font:500 9.5px var(--mono);color:var(--dim)}
.st .dots i{width:14px;height:2px;background:var(--line2)}
.st .dots i.d{background:var(--ac)}
.st .dots i.n{background:var(--ac2);animation:pulse 1.2s infinite}
.st .gs{display:flex;gap:4px;flex-wrap:wrap;min-height:19px}
.st.opt{border-top-style:dashed}
.st.done{border-top-color:var(--ac)}
.st.done::after{background:var(--ac);border-color:var(--ac)}
.st.active{border-top-color:var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 11%,transparent),transparent 75%)}
.st.active::after{background:var(--ac2);border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 24%,transparent);animation:breath 2.4s ease-in-out infinite}
.st.active::before{content:"In session";position:absolute;top:13px;right:14px;font:500 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.st.skipped{opacity:.4}
.st.sel{background:var(--panel)}
.st.todo .hd{color:var(--mut)}
#rail .gov{grid-column:3/-1;display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-left:2px solid var(--am);font-size:11px;color:var(--mut)}
#rail .gov.off{opacity:.4}
#rail .gov b{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--t-am)}
.legend{grid-column:1/3;display:flex;gap:12px;align-items:center;font-size:10px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:6px;height:6px;margin-right:5px;transform:rotate(45deg)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 9px var(--mono);letter-spacing:.08em;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap;text-transform:uppercase}
.chip.pl{color:var(--t-pl)}.chip.po{color:var(--t-po)}.chip.eng{color:var(--t-eng)}.tl{color:var(--t-tl)}.chip.adv{color:var(--t-am);border-style:dashed}.chip.dual{color:var(--t-vi)}
.chip.pending{background:color-mix(in srgb,currentColor 14%,transparent);animation:pulse 1.4s infinite}
.chip.cleared{color:var(--gr);border-color:var(--gr);border-style:solid}
.pill{display:inline-block;font:500 9.5px var(--mono);letter-spacing:.04em;padding-left:10px;position:relative;white-space:nowrap}
.pill::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;margin-top:-2.5px;background:currentColor;transform:rotate(45deg)}
.pill.gov{color:var(--t-po)}.pill.ev{color:var(--t-pl)}.pill.local,.pill.draft,.pill.rec{color:var(--t-eng)}.pill.pub{color:var(--gr)}
.stt{font:500 9px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.stt.approved{color:var(--gr)}.stt.review{color:var(--am)}.stt.draft{color:var(--mut)}.stt.saved{color:var(--t-pl)}
.role{font:500 8.5px var(--mono);letter-spacing:.08em;padding:0 4px;border:1px solid var(--line2);border-radius:2px;color:var(--mut)}

/* main */
#main{display:grid;grid-template-columns:250px 1fr 380px;min-height:0}
.col{min-height:0;overflow:auto;padding:18px 18px 18px 22px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line);padding:0;display:flex;flex-direction:column;overflow:hidden}
h5{margin:20px 0 9px;font:500 9.5px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
h5:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px}
.person{display:flex;align-items:center;gap:10px;padding:7px 8px;width:100%;text-align:left;border-left:2px solid transparent}
.person:hover{background:var(--line)}
.person.me{border-left-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.person b{display:block;font-weight:500;font-size:13px}.person small{color:var(--mut);font-size:10.5px}
.person .wait{white-space:nowrap;margin-left:auto;font:500 9px var(--mono);letter-spacing:.06em;color:var(--am);border:1px solid var(--am);padding:1px 5px;border-radius:2px;animation:pulse 1.4s infinite}
.person .stw{margin-left:auto;color:var(--ac);font-size:11px}
.agent{display:flex;gap:13px;align-items:center}
.orb{width:44px;height:44px;border-radius:50%;flex:none;position:relative;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 64%)}
.orb::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid transparent;border-top-color:var(--ac);border-right-color:color-mix(in srgb,var(--ac) 35%,transparent);animation:spin 6s linear infinite}
.orb::after{content:"";position:absolute;inset:39%;border-radius:50%;background:var(--ac2);box-shadow:0 0 12px var(--ac);animation:breath 3s ease-in-out infinite}
.orb.run::before{animation-duration:.9s}
.orb.sm{width:28px;height:28px}.orb.sm::before{inset:3px}
.agent b{font:500 16px var(--head)}.agent small{color:var(--mut);display:block;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.stat{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 11px}
.stat b{font:400 26px/1.1 var(--head);display:block;color:var(--text)}.stat span{font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.govrow{display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px}.govrow span{color:var(--mut)}.govrow b{font-weight:500}

/* conversation */
#center{display:flex;flex-direction:column;min-height:0;min-width:0}
.chd{padding:16px 26px 12px;border-bottom:1px solid var(--line)}
.chd h2{margin:0;font:400 22px/1.2 var(--head);letter-spacing:-.005em}.chd small{color:var(--mut);font-size:11.5px}
.banner{margin:10px 26px 0;padding:9px 14px;font-size:12px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2)}
.banner.me{border-left:2px solid var(--am);color:var(--t-am);background:color-mix(in srgb,var(--am) 8%,transparent)}
.banner.other{color:var(--mut)}
.banner button{margin-left:auto}
#chat{flex:1;overflow:auto;padding:20px 26px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:13px;animation:rise .35s ease both;max-width:840px}
.msg .body{min-width:0;flex:1}
.msg .meta{font-size:11px;color:var(--dim);margin-bottom:4px}.msg .meta b{color:var(--text);font-weight:600;margin-right:6px;letter-spacing:.01em}
.bub{font-size:13.5px;line-height:1.62;color:var(--soft);max-width:100%}
.msg.agent .bub{border-left:1px solid var(--ac);padding-left:14px;color:var(--text)}
.msg.sys{align-self:stretch;max-width:none;display:flex;align-items:center;gap:14px;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.msg.sys::before,.msg.sys::after{content:"";flex:1;height:1px;background:var(--line)}
.msg.sys.win{color:var(--gr)}
.runc,.gatec,.gapc,.ivc{border:1px solid var(--line2);border-radius:4px;background:var(--card2);padding:14px 16px;width:100%}
.runc .rh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.runc .rh b{font:500 13px var(--mono)}
.spin{width:11px;height:11px;border:1px solid var(--line2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
.tr{font:11px/1.8 var(--mono);color:var(--mut)}.tr div::before{content:"— ";color:var(--dim)}.tr div.cur::before{content:"› ";color:var(--ac)}.tr div.cur{color:var(--text)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.file{display:inline-flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line2);border-left:2px solid var(--ac);border-radius:2px;font:500 11px var(--mono)}
.file:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.gatec{border-top:2px solid var(--am)}.gatec.cleared{border-top-color:var(--gr)}
.gatec .rh b{font:500 15px var(--head)}
.gatec .gq{font:italic 400 15px/1.5 var(--head);color:var(--soft);margin:8px 0 10px}
.checks{margin:8px 0;padding:0;list-style:none;font-size:11.5px;color:var(--mut)}.checks li::before{content:"✓  ";color:var(--gr)}
.gact{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:3px;border:1px solid var(--line2);font-weight:500;font-size:12px;letter-spacing:.01em}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.ok{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}.btn.warn{border-color:var(--am);color:var(--am)}.btn.dng{border-color:var(--rd);color:var(--rd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.gapc{border-top:2px solid var(--rd)}.gapc.ok{border-top-color:var(--gr)}
.ivc label{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:11.5px;color:var(--mut)}
.cos{display:flex;gap:20px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.gauge{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--v)*1%),var(--line) 0);position:relative;flex:none}
.gauge::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card2)}
.gauge b{position:relative;z-index:1;font:400 28px var(--head)}
.bars{flex:1;font-size:11px;color:var(--mut)}.bars div{display:grid;grid-template-columns:110px 1fr 26px;gap:10px;align-items:center;margin:4px 0}
.bars i{height:2px;background:var(--line2);position:relative}.bars i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--ac)}
.note{margin-top:10px;padding:8px 12px;border-left:2px solid var(--am);background:color-mix(in srgb,var(--am) 7%,transparent);font-size:11.5px}
.note.ok{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 7%,transparent)}
.typing{font:italic 12px var(--head);color:var(--mut);padding:0 26px 4px;height:20px}
#comp{border-top:1px solid var(--line);padding:12px 26px 16px;background:var(--bar)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sug{padding:5px 12px;border-radius:3px;border:1px solid var(--line2);font-size:11.5px;color:var(--mut)}
.sug:hover{color:var(--text);border-color:var(--ac)}
.sug.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:600}
.sug.sw{border-color:var(--am);color:var(--t-am)}
.inrow{display:flex;gap:10px;align-items:center}
.inrow input{padding:11px 14px}
.guide{margin:10px 26px 0;padding:12px 16px;border:1px solid var(--line2);border-left:2px solid var(--ac);background:var(--panel);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.guide .gk{font:500 9px var(--mono);letter-spacing:.18em;color:var(--ac);text-transform:uppercase}
.guide h4{margin:3px 0 5px;font:500 17px var(--head)}
.guide p{margin:3px 0;font-size:12px;color:var(--soft)}
.guide p b.l{font:500 9px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-right:8px}
.guide .gctl{display:flex;flex-direction:column;gap:6px;min-width:180px}
.guide .gctl .btn{text-align:center}
.guide .gctl div{display:flex;gap:6px}.guide .gctl div .btn{flex:1;padding:5px 6px;font-size:11px}

/* right */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;padding:0 12px}
.tabs button{flex:1;padding:13px 4px 11px;color:var(--mut);border-bottom:1px solid transparent;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.tabs button.on{color:var(--text);border-color:var(--ac)}
.rp{flex:1;overflow:auto;padding:18px 22px}
.rp h3{margin:2px 0 4px;font:400 21px var(--head)}
.row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
button.row:hover{background:var(--line)}
.row .nm{font:500 11.5px var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.row small{color:var(--mut)}
.row.next{border-bottom-color:var(--ac);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 12%,transparent),transparent)}
.row.ghost{opacity:.45}
.muted{color:var(--mut);font-size:11.5px}
.conn{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line)}

.menu .mi small.wt{color:var(--am)}

/* minimized workflow dots: palette accent instead of green */

/* ===== v5: sans-serif heading treatment ===== */
body.sanshead .brand{font-weight:600}body.sanshead .brand i{font-style:normal}

/* ===== animated Neuro mark ===== */
.nlogo{width:34px;height:34px;flex:none;overflow:visible}
.nlogo *{transform-origin:20px 20px;transform-box:view-box}
.nlogo .ring{fill:none;stroke:var(--ac);stroke-width:1;stroke-dasharray:3 5;opacity:.75;animation:spin 18s linear infinite}
.nlogo .ring2{fill:color-mix(in srgb,var(--ac) 9%,transparent);stroke:color-mix(in srgb,var(--ac) 45%,transparent);stroke-width:.8}
.nlogo .links path{fill:none;stroke:var(--ac2);stroke-width:1.1;stroke-linecap:round;stroke-dasharray:3 9;animation:nflow 1.8s linear infinite}
.nlogo .links path:nth-child(2){animation-delay:-.6s}.nlogo .links path:nth-child(3){animation-delay:-1.2s}
.nlogo .orbit{animation:spin 9s linear infinite reverse}
.nlogo .links{animation:spin 9s linear infinite reverse}
.nlogo .orbit circle{fill:var(--bg);stroke:var(--ac);stroke-width:1.2}
.nlogo .core{fill:var(--ac);animation:ncore 2.6s ease-in-out infinite}
.brand:hover .nlogo .orbit,.brand:hover .nlogo .links{animation-duration:2.5s}
@keyframes nflow{to{stroke-dashoffset:-12}}
@keyframes ncore{0%,100%{transform:scale(.8);opacity:.85}50%{transform:scale(1.15);opacity:1}}
body nav,body.codefont nav{flex:none}
body.sanshead #top{gap:6px;padding-left:14px;padding-right:14px}
@media (max-width:1420px){body.sanshead nav button{padding:7px 9px;font-size:10.5px;letter-spacing:.03em}body.sanshead .tb{font-size:11.5px;padding-left:7px;padding-right:7px;gap:5px}body.sanshead .brand{font-size:15px;gap:8px}body.sanshead .vsep{margin:0 2px}}

/* ===== room pet ===== */
#center{position:relative}
#pet{position:absolute;right:26px;z-index:6;width:46px;height:46px;padding:0;line-height:0}
#pet svg{width:46px;height:46px;overflow:visible;animation:petbob 3.2s ease-in-out infinite;transform-origin:50% 100%}
#pet .pb{fill:var(--panel);stroke:var(--ac);stroke-width:1.6;stroke-linejoin:round}
#pet .pl{fill:none;stroke:var(--ac);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#pet .pl.thin{stroke-width:.9;opacity:.7}
#pet .eye{fill:var(--ac);transform-box:fill-box;transform-origin:center;animation:petblink 4.5s infinite}
#pet .ant{fill:var(--ac2);stroke:none;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s infinite}
#pet .tail{transform-box:fill-box;transform-origin:0 100%;animation:petwag 1.8s ease-in-out infinite}
#pet.work svg{animation:petbob .5s ease-in-out infinite}
#pet.work .ant{animation:pulse .35s infinite}
#pet.alert svg{animation:petalert .9s ease-in-out infinite}
#pet.wait .eye{animation:petlook 3s ease-in-out infinite}
#pet.party svg{animation:petparty .8s ease-in-out infinite}
#pet.hop svg{animation:pethop .5s ease-out 2}
.psay{position:absolute;right:54px;bottom:16px;white-space:nowrap;font:500 11px/1.3 var(--sans);color:var(--text);background:var(--solid);border:1px solid var(--ac);border-radius:10px 10px 2px 10px;padding:6px 10px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:rise .25s ease}
.petmi svg{width:30px;height:30px;overflow:visible}
.petmi .pb{fill:none;stroke:var(--ac);stroke-width:1.8}.petmi .pl{fill:none;stroke:var(--ac);stroke-width:1.6}.petmi .eye,.petmi .ant{fill:var(--ac)}
@keyframes petbob{50%{transform:translateY(-3px)}}
@keyframes petblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes petwag{50%{transform:rotate(-16deg)}}
@keyframes petalert{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-5deg)}75%{transform:translateY(-7px) rotate(5deg)}}
@keyframes petlook{0%,100%{transform:translateX(0)}30%{transform:translateX(-1.6px)}70%{transform:translateX(1.6px)}}
@keyframes petparty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes pethop{50%{transform:translateY(-12px)}}

/* ---------- artifact definitions ---------- */
const citeKey=(r,k)=>{const x=r.sources.find(z=>z.key===k);return x?` [${x.id}]`:''};
const src=r=>r.sources[0]?` [${r.sources[0].id}]`:'';
const tbl=(h,rows)=>['| '+h.join(' | ')+' |','|'+h.map(()=>'---').join('|')+'|',...rows.map(x=>'| '+x.join(' | ')+' |')].join('\n');

const S={domain:'vault',persona:'po',view:'room',tab:'stage',selStage:null,menu:null,auto:false,guide:'mini',theme:'dark',palette:'aurora',logo:'brain',font:'grotesk',speed:1,rooms:{},skills:{},elev:{},edit:null,vf:'all',vq:''};
function newRoom(id){const d=DOMAINS[id];let chain=d.chain?[...d.chain]:[...BASE_CHAIN];for(const x of d.inserts)chain.splice(chain.indexOf(x.after)+1,0,x.id);
  return {id,chain,ptr:0,msgs:[],arts:[],gates:{},sources:[],audit:[],notifs:[],gov:null,busy:false,runs:0,clock:Date.now(),skipped:false,interview:null,gapPosted:{},done:false,n:0}}
function initSkills(id){const d=DOMAINS[id];S.skills[id]=[...coreSkills(d).map(s=>({...s,tag:'core'})),...d.extra.map(s=>({...s,tag:'domain'}))].map(s=>({name:s.id,ver:'1.0',enabled:true,history:[{ver:'1.0',by:'Platform team',note:'Initial release'}],prompt:`You are the ${d.agent}. ${s.desc}\nGround every claim in a cited source (SRC-ID). Never invent application names — resolve them through Knowledge Hub.`,guards:['cite','pii'],...s}))}
const R=()=>S.rooms[S.domain], D=()=>DOMAINS[S.domain];
const skill=(dom,id)=>S.skills[dom].find(s=>s.id===id);
const stepStage=(room,i)=>{const st=room.chain[i];return st[0]==='@'?GATES[st.slice(1)].stage:skill(room.id,st).stage};
const curStage=room=>room.done?'s6':stepStage(room,room.ptr);
const sleep=(ms,instant)=>instant?Promise.resolve():new Promise(r=>setTimeout(r,ms/S.speed));
const tick=(room,instant)=>room.clock=instant?room.clock+(4+Math.random()*30)*60000:Date.now();
const live=room=>room.id===S.domain&&S.view==='room';

/* ---------- messaging ---------- */
function post(room,m,instant){m.id=room.id+'-'+(++room.n);m.t=tick(room,instant);room.msgs.push(m);
  if(live(room)&&!instant&&(S.cf||'all')!=='all'&&(S.cf==='link')!==isLinked(room,m)){renderChatHead();return m}
  if(live(room)&&!instant){$('#chat').insertAdjacentHTML('beforeend',msgHTML(room,m));scrollChat()}return m}
function rerender(room,m){if(!live(room))return;const el=document.getElementById('m'+m.id);if(el){el.outerHTML=msgHTML(room,m);scrollChat()}}
const scrollChat=()=>{const c=$('#chat');c.scrollTop=c.scrollHeight};
const say=(room,html,instant)=>post(room,{who:'agent',kind:'text',html},instant);
const sys=(room,html,instant,win)=>post(room,{who:'sys',kind:'sys',html,win},instant);
function audit(room,who,what){room.audit.unshift({t:room.clock,who,what,h:hash(who+what+room.clock)})}
function notify(room,to,text,link){room.notifs.unshift({to,text,t:room.clock,read:false,dom:room.id,link:link||null})}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').append(el);setTimeout(()=>el.remove(),2800)}

/* ---------- artifacts ---------- */
function addArt(room,key,sk,by,instant){const d=DOMAINS[room.id],def=FILES[key];tick(room,instant);
  let a=room.arts.find(x=>x.key===key);

/* ---------- autopilot ---------- */
async function autopilot(){const room=R();
  while(S.auto&&!room.done&&S.domain===room.id&&S.view==='room'){
    if(room.busy){await sleep(300);continue}
    const beat=demoBeat(room);if(beat){await beat.run();await sleep(2000);continue}
    const a=nextAction(room);if(!a)break;
    if(a.actor!==S.persona){S.persona=a.actor;refresh();toast('Now acting as '+PEOPLE[a.actor].name+' · '+PEOPLE[a.actor].abbr);await sleep(1300)}
    await perform(room,a,{auto:true});await sleep(2600)}
  S.auto=false;refresh()}
async function fastForward(room,stop){while(!room.done&&room.chain[room.ptr]!==stop){await perform(room,nextAction(room),{instant:true})}}

const mdInl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(SRC-\d+)\]/g,'<span class="src">$1</span>');
function md(srcTxt,cont){if(srcTxt.startsWith('<!raw>'))return srcTxt.slice(6);
  const inl=mdInl;
  let h='',ul=false,tb=false;const close=()=>{if(ul){h+='</ul>';ul=false}if(tb){h+='</table>';tb=false}};
  if(cont&&srcTxt.startsWith('|')){h+='<table>';tb=true} // continuation of a table split by a diff hunk
  for(const l of srcTxt.split('\n')){
    if(l.startsWith('# ')){close();h+=`<h1>${inl(l.slice(2))}</h1>`}
    else if(l.startsWith('## ')){close();h+=`<h2>${inl(l.slice(3))}</h2>`}
    else if(l.startsWith('- ')){if(tb)close();if(!ul){h+='<ul>';ul=true}h+=`<li>${inl(l.slice(2))}</li>`}
    else if(l.startsWith('|')){if(ul)close();const c=l.split('|').slice(1,-1).map(x=>x.trim());if(c.every(x=>/^-+$/.test(x)))continue;const t=tb?'td':'th';if(!tb){h+='<table>';tb=true}h+='<tr>'+c.map(x=>`<${t}>${inl(x)}</${t}>`).join('')+'</tr>'}
    else if(l.startsWith('> ')){close();h+=`<blockquote>${inl(l.slice(2))}</blockquote>`}
    else if(!l.trim())close();else{close();h+=`<p>${inl(l)}</p>`}}
  close();return h}

function renderSlash(){let el=$('#slash');if(!el){el=document.createElement('div');el.id='slash';$('#center').append(el)}
  if(!S.slash||S.view!=='room'){el.style.display='none';return}

function slashKey(e){const it=slashItems(),k=e.key;
  if(k==='ArrowDown'||k==='ArrowUp'){S.slash.idx=(S.slash.idx+(k==='ArrowDown'?1:it.length-1))%Math.max(it.length,1);renderSlash()}
  else if(k==='Enter'||k==='Tab'||k==='ArrowRight'){if(k==='ArrowRight'&&!it[S.slash.idx]?.sub)return false;ACT.slashPick(S.slash.idx)}

function defaultChecks(dest,gate){return ['All required sections present, in order','No PAN / PII in the output',...(dest==='gov'||dest==='ev'?['Cites at least one SRC-ID inline']:[]),...(gate?[`Meets ${gate} entry conditions`]:[])]}
function tplOf(dom,key){S.tpl=S.tpl||{};const m=S.tpl[dom]=S.tpl[dom]||{};
  if(!m[key]&&FILES[key]){const d=DOMAINS[dom],f=FILES[key],body=f.body(d,{id:dom,sources:[],interview:null});
    m[key]={name:f.name(d),dest:f.dest,gate:f.gate||null,raw:body.startsWith('<!raw>'),edited:false,
      sections:(body.match(/^## .+$/gm)||[]).map(h=>({h:h.slice(3),orig:h.slice(3),guide:''})),checks:defaultChecks(f.dest,f.gate)}}
  return m[key]}
function applyTemplate(body,t,d,room){if(t.raw||!t.edited)return body;
  const pre=[],map={};let cur=null;
  for(const l of body.split('\n')){if(l.startsWith('## ')){cur=l.slice(3);map[cur]=[]}else(cur===null?pre:map[cur]).push(l)}
  const src=room.sources&&room.sources[0]?` and [${room.sources[0].id}]`:'';
  return [...pre,...t.sections.filter(s=>s.h.trim()).flatMap(s=>['## '+s.h,...(s.orig&&map[s.orig]?map[s.orig]
    :[`- ${s.guide?s.guide.replace(/\.$/,'')+' — drafted':'Drafted'} for ${d.initiative}.`,`- Grounded in Knowledge Hub${src}; review before the gate.`])])].join('\n')}
function applyContract(room,key,base,d){const t=tplOf(room.id,key);if(!t)return;
  base.name=t.name;base.dest=t.dest;base.body=applyTemplate(base.body,t,d,room);base.tplEdited=t.edited;
  base.checks=t.checks.map(c=>({c,ok:/SRC-ID/i.test(c)?room.sources.length>0:true}))}

const HOWTO_MD=(d)=>`# How /addskill works — contract-driven placement
Adding a skill to a live workflow is safe only if the skill's inputs exist by the time it runs and its outputs land where a gate can use them. The room does not guess this; it reads **YAML contracts** and the agent recommends placements. The steward chooses.
## 1. Every workflow is data
Each agent domain ships a \`workflow.yaml\`: ordered stages, the skills in each stage, the gates and their approver roles. The room renders the stage rail, the skill lists and the gate cards from this file. Swapping workflows is loading a different file.
## 2. Every skill carries a contract
\`\`\`
skill: pci-scope-analyzer
requires:
  - artifact: app-context-registry.md   # must exist
    status: exists
  - artifact: L1-architecture.md
    optional: true
produces:
  - artifact: pci-scope-analysis.md
    destination: WH evidence
    sections: [Summary, Findings, Recommendation]
    checks: [Cites SRC-IDs inline, No PAN / PII]
feeds-gate: GW-I2
tests: { status: 14 passed, proven-in: vscode-experimentation }
\`\`\`
\`requires\` names the artifacts and the status they must have (exists, approved). \`produces\` is the output contract already used by every skill. \`feeds-gate\` says which decision should see the result.
## 3. The agent resolves the dependency graph
When a steward runs \`/addskill\`, the agent reads the workflow and the contract and computes, for every stage:
- **Earliest valid position** — after the last producer of every required artifact, and after that artifact's gate when \`status: approved\` is required.
- **Gate boundary** — a skill that feeds a gate must sit before it; otherwise the gate cannot consider its output.
- **Already run** — stages the current initiative has passed cannot take a new skill until the next initiative.
- **Collisions** — two skills may not produce the same artifact; no skill may require its own output.
## 4. Recommendations, not rules
The result is ranked and explained:
- **Recommended** — all inputs available and the output reaches its gate.
- **Possible** — inputs available, but the output arrives after its gate, or an optional input is missing (degraded mode).
- **Not possible** — a required input does not exist yet, with the stage where it arrives.
The steward picks one. The agent inserts the skill, re-validates the whole graph, and publishes a new workflow version with the reasoning in the activity log. Running initiatives finish on the version they started on.
## 5. Where skills come from
- **Marketplace** — skills published by any domain, with version, owner, test evidence and the connections they need. A compatibility check runs against your workflow before you add one.
- **Proving ground** — skills are authored and tested in VS Code against test data. Publication requires passing tests and a steward approval. Production only composes proven skills.
- **Sandbox** — anyone can try a skill in a room; its output is marked experimental, is not stored as a governed artifact, and no gate can consume it.
## 6. What stays fixed
Connections (Knowledge Hub, Jira, VS Code) are granted to the domain agent, not to the skill, so a marketplace skill only reaches the data ${d.agent} already has. Gates, approvers and separation of duties are defined by the workflow, not by any skill.`;

async function addSkillFlow(){const room=R(),d=D();if(room.busy)return toast('The agent is still working…');
  post(room,{who:S.persona,kind:'text',html:'/addskill'});
  addDoc(room,'addskill_howto','addskill-how-it-works.md',HOWTO_MD(d),'local');
  const m=post(room,{who:'agent',kind:'addskill',as:{step:'pick'}});audit(room,d.agent,'Opened the skill marketplace via /addskill');refresh();scrollChat()}
async function addSkillPick(m,id){const room=R(),d=D(),k=mkt(id);if(!k||m.as.step!=='pick')return;m.as.step='analyse';m.as.skill=id;m.as.trace=[];rerender(room,m);
  addDoc(room,'contract_'+id,id+'.contract.yaml','<!raw><pre class="yaml">'+esc(contractYAML(k))+'</pre>','local',id);
  const steps=[`Reading ${id}.contract.yaml · v${k.ver} · ${k.tests} · proven in VS Code`,`Reading ${d.short.toLowerCase()}-workflow.yaml · v${room.wfVer||'1.0'} · ${STAGES.filter(s=>!s.later).length} stages · ${room.chain.filter(x=>x[0]!=='@').length} skills · ${room.chain.filter(x=>x[0]==='@').length} gates`,
    ...k.requires.map(r=>{const p=placeOptions(room,{...k,requires:[r]});const prod=room.chain.findIndex(c=>c[0]!=='@'&&(skill(room.id,c).outs||[]).includes(r.key));return `requires ${FILES[r.key]?FILES[r.key].name(d):r.key}${r.optional?' (optional)':''} → ${prod>=0?'produced by '+skill(room.id,room.chain[prod]).name+' in stage '+STAGES[stageIdx(stepStage(room,prod))].num:'not produced in this workflow'}`}),
    k.feeds?`feeds ${k.feeds} → ${room.chain.includes('@'+k.feeds)?'gate found in stage '+STAGES[stageIdx(stepStage(room,room.chain.indexOf('@'+k.feeds)))].num:'gate not in this workflow'}`:'feeds no gate → informational output',
    'Checking collisions · no other skill produces '+k.produces.map(p=>p.file).join(', '),'Ranking placements'];
  for(const s of steps){m.as.trace.push(s);rerender(room,m);await sleep(650)}
  m.as.opts=placeOptions(room,k);m.as.step='recommend';rerender(room,m);audit(room,d.agent,`Recommended placements for ${id} from its contract`);
}
function addSkillPlace(m,arg){const room=R(),d=D(),k=mkt(m.as.skill);if(!['recommend','done'].includes(m.as.step))return;const [sid,posS]=arg.split('|');let pos=+posS;const st=STAGES[stageIdx(sid)],opt=m.as.opts.find(o=>o.stage.id===sid);
  if(m.as.step==='done'){const cur=room.chain.indexOf(k.id);if(cur<0||cur===pos)return;room.chain.splice(cur,1);if(cur<room.ptr)room.ptr--;if(cur<pos)pos--;S.skills[room.id]=S.skills[room.id].filter(x=>x.id!==k.id);m.as.moved=true}
  for(const p of k.produces)if(!FILES[p.key])FILES[p.key]={name:()=>p.file,dest:p.dest,body:dd=>`# ${p.file.replace(/\.md$/,'').replace(/-/g,' ')}\n**Skill:** ${k.id} v${k.ver} (${k.dom} · ${k.team})\n## Summary\n- Produced for ${dd.initiative} at workflow v${room.wfVer}\n## Findings\n- Grounded in ${k.conns.map(c=>VIA[c]).join(', ')}; see cited SRC-IDs\n## Recommendation\n- Review before ${k.feeds||'the next gate'}`};
  S.skills[room.id].push({id:k.id,name:k.id,stage:sid,role:k.role,desc:k.desc,needs:k.conns.map(c=>({via:c,label:VIA[c]})),outs:k.produces.map(p=>p.key),trace:k.trace,tag:'market',ver:k.ver,enabled:true,guards:['cite','pii'],prompt:`You are the ${d.agent}. ${k.desc}`,history:[{ver:k.ver,by:k.team,note:'Added from the marketplace via /addskill'}]});
  room.chain.splice(pos,0,k.id);if(pos<=room.ptr)room.ptr++;
  const [a,b]=(room.wfVer||'1.0').split('.').map(Number);room.wfVer=a+'.'+(b+1);
  m.as.step='done';m.as.placed={stage:st,pos};room.showSkill={id:k.id,stage:sid};room.demoDone=false;m.as.opts.forEach(o=>o.pos=o.pos+(o.pos>=pos&&o.stage.id!==sid?1:0));rerender(room,m);
  const before=room.chain[pos-1],after=room.chain[pos+1];
  sys(room,`${d.short.toLowerCase()}-workflow.yaml → v${room.wfVer} · ${k.id} added to ${st.num} · ${st.title}${before&&before[0]!=='@'?' after '+skill(room.id,before).name:''} · graph re-validated ✓`);
  audit(room,PEOPLE[S.persona].name,`Placed ${k.id} in ${st.title} (workflow v${room.wfVer})`);
  say(room,`<b>${k.id}</b> is now part of this workflow at <b>${st.num} · ${st.title}</b>${after?` and will run before ${after[0]==='@'?after.slice(1):skill(room.id,after).name}`:''}. Its output <span class="mono">${k.produces[0].file}</span> ${k.feeds?`will be on the table at <b>${k.feeds}</b>`:'is informational'}. Initiatives already past that point keep workflow v${a}.${b}.`);refresh();
  if(opt&&opt.runNow&&!m.as.moved){const sk=skill(room.id,k.id);say(room,`Its inputs already exist in this room, so I\'m running <b>${k.id}</b> now for ${esc(room.meta?.name||d.initiative)}.`);setTimeout(()=>{if(!room.busy)runSkill(room,sk,S.persona)},600)}}
Object.assign(ACT,{asPick(id,el){const room=R(),m=room.msgs.find(x=>x.id===el.closest('.msg').id.slice(1));if(m)addSkillPick(m,id)},
  asPlace(arg,el){const room=R(),m=room.msgs.find(x=>x.id===el.closest('.msg').id.slice(1));if(m)addSkillPlace(m,arg)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
  if(!el){if(S.menu){S.menu=null;renderTop()}return}
  const f=ACT[el.dataset.act];if(f)f(el.dataset.arg,el,e)});
document.addEventListener('change',e=>{if('logo' in e.target.dataset)ACT.logo(e.target.value)});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset;if('lp' in ds&&S.land.create){S.land.create.pq=t.value;$('#lpres').innerHTML=peopleResults();return}if('lq' in ds){S.land.q=t.value;S.land.hl=null;$('#llist').innerHTML=landRows();return}if(ds.lf&&S.land.create){S.land.create[ds.lf]=t.value;const b=document.querySelector('.lspinb');if(b)b.disabled=!(S.land.create.name.trim()&&S.land.create.domain);return}if(t.id==='msgin'){slashInput();return}if(ds.th){thInput(t);return}if(t.id==='cmIn'){cmInput(t);return}if(t.id==='rvNote'){const g=R().gates[AV.gid];if(g)g.draft=t.value;const ok=!!t.value.trim();document.querySelectorAll('[data-act=rvApprove],[data-act=rvChanges]').forEach(b=>{if(b.dataset.lock!=='1')b.disabled=!ok});const w=$('#rvWhy');if(w&&!document.querySelector('[data-lock="1"]'))w.textContent=ok?'':'Add a comment for the record to enable the buttons';return}if(t.id==='cmSec'){AV.cmSec=t.value;return}if(S.tplEdit){const dr=S.tplEdit.draft;if(ds.ts){dr.sections[+ds.ts].h=t.value;return}if(ds.tg){dr.sections[+ds.tg].guide=t.value;return}if(ds.tf){dr[ds.tf]=ds.tf==='checks'?t.value.split('\n').map(x=>x.trim()).filter(Boolean):t.value;return}}if(t.id==='artEd'){AV.draft=t.value;return}
  if('sq' in ds){const q=curSme();if(q){q.qs[+ds.sq].ans=t.value;if(['invited','viewed'].includes(q.status))q.status='progress'}return}
  if(ds.iv)R().interview.answers[ds.iv]=t.value;
  else if(ds.gc)R().gates[ds.gc].draft=t.value;
  else if(ds.f&&S.edit)S.edit.draft[ds.f]=t.value;
  else if(ds.fc&&S.edit){const c=S.edit.draft.conns;t.checked?c.push(ds.fc):c.splice(c.indexOf(ds.fc),1)}
  else if(ds.fg&&S.edit){const c=S.edit.draft.guards;t.checked?c.push(ds.fg):c.splice(c.indexOf(ds.fg),1)}
  else if(t.id==='vq'){S.vq=t.value;const p=t.selectionStart;renderVault();const n=$('#vq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(S.slash&&e.target.id==='msgin'&&slashKey(e))return;if(e.key==='Enter'&&e.target.id==='msgin'){if(e.target.value.startsWith('/'))return;ACT.send()}if(e.key==='Enter'&&e.target.id==='aiIn')ACT.artAskSend();if(e.key==='Enter'&&e.target.dataset.th)ACT.thSend(e.target.dataset.th);if(e.key==='Escape')closeModal()});
setInterval(()=>{const el=$('#elevT');if(!el)return;const left=Math.round((S.elev[S.domain]-Date.now())/1000);if(left<=0){renderStudio();toast('Elevated session expired');return}el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},1000);
window.addEventListener('error',e=>toast('Script error: '+e.message));

const HIST=[];const PREFS=['theme','palette','font','logo','pet','guide','speed','cf','noleft','norail','noright'];
function histPush(label){try{const dom={};for(const k in DOMAINS)if(DOMAINS[k].parent)dom[k]=DOMAINS[k];const snap=JSON.stringify({S,dom},(k,v)=>k==='hist'?undefined:v);HIST.push({n:HIST.length+1,label,snap,t:Date.now()});if(HIST.length>80)HIST.shift()}catch(e){console.warn('history snapshot skipped',e)}}
function histGo(i){const h=HIST[i];if(!h)return;const keep={};PREFS.forEach(k=>keep[k]=S[k]);const {S:s,dom}=JSON.parse(h.snap);
  if(AV)closeModal();for(const k in DOMAINS)if(DOMAINS[k].parent)delete DOMAINS[k];Object.assign(DOMAINS,dom);
  for(const k of Object.keys(S))delete S[k];Object.assign(S,s);PREFS.forEach(k=>{if(keep[k]!==undefined)S[k]=keep[k]});
  for(const r of Object.values(S.rooms))if(r.parent)r.arts=r.arts.map(a=>a.inherited?Object.create(art(S.rooms[a.from],a.key)||{},{inherited:{value:true,enumerable:true},from:{value:a.from,enumerable:true},key:{value:a.key,enumerable:true}}):a);
  HIST.length=i;S.histOpen=false;renderAll();refresh();toast(`Back to click ${h.n} — Next runs it again`)}
function histHTML(){if(!HIST.length)return '';const open=S.histOpen;return `<span class="hddw"><button class="hdd" data-act="histToggle" title="Demo history">▾</button>${open?`<div class="hdm"><h6>Jump back · Next re-runs that click</h6>${HIST.slice().reverse().map((h,ri)=>{const i=HIST.length-1-ri;return `<button data-act="histGo" data-arg="${i}"><b>${h.n}</b><span>${esc(h.label)}</span></button>`}).join('')}</div>`:''}</span>`}
function histMount(){if(!HIST.length)return;const html=histHTML();document.querySelectorAll('.hddw').forEach(e=>{const b=e.previousElementSibling;if(!b||!b.classList.contains('nextb')||b.offsetParent===null)e.remove();else if(e.__h!==html){e.outerHTML=html}});document.querySelectorAll('.nextb').forEach(b=>{if(b.offsetParent!==null&&!(b.nextElementSibling&&b.nextElementSibling.classList.contains('hddw')))b.insertAdjacentHTML('afterend',html)});document.querySelectorAll('.hddw').forEach(e=>e.__h=html)}
document.addEventListener('click',e=>{if(S.histOpen&&!e.target.closest('.hddw')){S.histOpen=false;histMount()}});
function refresh(){renderTop();renderPet();setTimeout(brainFire,50);{const b=(S.rooms[S.domain]||{}).busy;document.querySelectorAll('#modal .nextb, #view .nextb').forEach(e=>{if(!e.classList.contains('done'))e.classList.toggle('ready',!b)})}if(S.view==='queue')renderQueue();if(S.view==='sme'&&!document.activeElement?.matches?.('textarea,select,input'))renderSme();if(S.view!=='room')return;renderRail();renderLeft();renderChatHead();refreshDyn();renderComp();renderRight();histMount()}
function renderAll(){renderView();renderTop();setTimeout(brainFire,50);if(S.view==='room'){renderRail();renderLeft();renderChatHead();renderChat();renderComp();renderRight()}renderPet();renderSlash();histMount()}

/* ---------- boot ---------- */
S.pet='bot'; // always start with Byte, the robot
S.noleft=true;S.norail=true;S.noright=true; // opens with workflow, squad and detail panels minimized · the demo never expands the right panel
S.lite=/[?&]lite=1/.test(location.search);S.cf='room';try{const cf=localStorage.getItem('sr-cf2');if(['all','room','link'].includes(cf))S.cf=cf;if(localStorage.getItem('sr-theme')==='light')S.theme='light';const sp=localStorage.getItem('sr7-palette');if(PALETTES[sp])S.palette=sp;const sf=localStorage.getItem('sr7-font');if(FONTS[sf])S.font=sf;const sl=localStorage.getItem('sr7-logo');if(LOGOS[sl])S.logo=sl}catch(e){}
async function boot(){const initHash=location.hash;
  Object.assign(S,{created:{vault:true,pricing:true},land:{beat:0,hl:null,page:null,tab:'mine',q:'',req:{},create:null,spin:null,busy:false},domain:'vault',persona:'pl',view:'landing',tab:'stage',selStage:null,menu:null,auto:false,rooms:{},skills:{},tpl:{},elev:{},edit:null});
  for(const id of Object.keys(DOMAINS)){initSkills(id);const room=S.rooms[id]=newRoom(id),d=DOMAINS[id];
    room.clock=Date.now()-3*864e5;
    sys(room,`Room opened · ${d.agent} joined · ${SQUAD().length} squad members`,true);
    post(room,{who:'po',kind:'text',html:esc(d.idea)},true);
    say(room,`Hi squad — I\'m the <b>${d.agent}</b>. I\'ll take this through the PDLC with you, one stage at a time, and I\'ll stop at every gate for a human decision. I can start with <span class="mono">intake-builder</span> on Priya\'s idea whenever you\'re ready.`,true)}
  await fastForward(S.rooms.pricing,'@GW-RD1');
  await fastForward(S.rooms.vault,'@GW-I2');
  const q=new URLSearchParams(location.search);
  if(q.has('room')||q.has('demo')||q.get('domain')||q.get('view')||q.get('skill')||q.get('art')){createRoom('tds',{name:DEMO_ROOM.name,bg:DEMO_ROOM.bg,owner:'pl',inv:['po','ar'],vis:'request'});S.view='room';if(!q.get('as'))S.persona='po'}
  if(DOMAINS[q.get('domain')])S.domain=q.get('domain');if(PEOPLE[q.get('as')])S.persona=q.get('as');if(['vault','studio'].includes(q.get('view')))S.view=q.get('view');
  renderAll();
  if(q.get('left'))S.noleft=q.get('left')!=='open';if(q.get('rail'))S.norail=q.get('rail')==='min';if(q.get('right'))S.noright=q.get('right')==='min';
  if(LOGOS[q.get('logo')])S.logo=q.get('logo');if(q.get('pet'))S.pet=q.get('pet');if(q.get('slash'))S.slash={level:q.get('slash'),idx:0};
  if(PALETTES[q.get('palette')])S.palette=q.get('palette');if(FONTS[q.get('font')])S.font=q.get('font');
  if(q.get('theme')==='light')S.theme='light';
  renderAll();
  if(q.get('tsec')){const [k,h]=q.get('tsec').split(':');const t=tplOf(S.domain,k);t.sections.push({h,orig:null,guide:'Key risks and mitigations'});t.edited=true}
  if(q.get('skill'))ACT.editSkill(q.get('skill'));if(q.get('tpl')){if(q.has('elev'))S.elev[S.domain]=Date.now()+6e5;ACT.tplOpen(q.get('tpl'));if(q.has('prev'))ACT.tplPreview()}
  if(q.get('art')){openArt(q.get('art'));if(q.has('edit'))ACT.artMode('edit');if(q.get('ask')){ACT.artMode('ai');ACT.artAsk(q.get('ask'))}}
  if(q.get('stage')){ACT.selStage(q.get('stage'))}
  if(q.get('after')){for(let i=0;i<+q.get('after');i++){while(S.land.busy||R().busy)await sleep(100);await demoNext();await sleep(300)}while(S.land.busy||R().busy)await sleep(100)}
  if(q.get('addskill')){await addSkillFlow();const m=R().msgs.find(x=>x.kind==='addskill');if(q.get('addskill')!=='1'){await addSkillPick(m,q.get('addskill'));if(q.get('place'))addSkillPlace(m,q.get('place'))}}
  if(q.get('menu')){S.menu=q.get('menu');renderTop()}
  if(q.get('ltab')){S.land.page=q.get('ltab');S.land.tab=q.get('ltab');S.land.q=q.get('lq')||'';renderLanding()}
  if(q.has('form')){S.land.create={name:DEMO_ROOM.name,bg:DEMO_ROOM.bg,domain:'tds',inv:['po'],vis:'request',pq:q.get('pq')||'',hot:q.has('hot')};renderLanding()}
  if(q.get('steps')){S.speed=6;for(let i=0;i<+q.get('steps');i++){while(S.land.busy||R().busy||R().ffing)await sleep(100);await demoNext();await sleep(300);while(S.land.busy||R().busy||R().ffing)await sleep(100)}if(q.get('tab')){S.tab=q.get('tab');renderRight()}S.stepsDone=true}
  if(q.has('demo')){S.speed=6;ACT.auto()}
  if(initHash){const p=initHash.slice(1).split('/');if(p[1]==='tds'&&!S.created.tds){createRoom('tds',{name:DEMO_ROOM.name,bg:DEMO_ROOM.bg,owner:'pl',inv:['po','ar'],vis:'request'});S.persona='po';S.domain='tds';await fastForward(S.rooms.tds,p[2]==='review'&&GATES[p[3]]?'@'+p[3]:'@GW-I1')}openHash(initHash)}
}
boot();
