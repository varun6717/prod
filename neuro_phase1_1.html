<title>Neuro Phase 1.1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Single-theme by design — same instrumentation panel as neuro_kickoff.html, painted explicitly so it holds on any host ground.
     No color-mix() anywhere: the VDI browser does not have it. */
  :root {
    --void: #070B12; --panel: #0E1622; --panel-2: #131E2C; --panel-3: #182535;
    --ink: #E6EDF6; --muted: #8A9BB3; --dim: #5A6C82; --rule: #1B2736; --rule-lit: #2A3B4F;
    --articles: #E8B34A; --flows: #4FC3D9; --history: #B98CE0; --codemap: #5BD6A0; --code: #F2825C;
    --human: #F3E7C9; --mcp: #6E8BA6;
    --display: "Chivo", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--void); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; margin: 0;
    background-image:
      radial-gradient(ellipse 900px 520px at 12% 0%, rgba(232,179,74,0.07), transparent 68%),
      radial-gradient(ellipse 760px 420px at 92% 100%, rgba(91,214,160,0.05), transparent 70%);
  }
  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 22px; padding-block: 14px 12px; max-width: 1920px; margin: 0 auto; }

  /* ── top bar ──────────────────────────────────────────────── */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
  .top-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--articles); margin: 0; display: flex; align-items: center; gap: 12px; }
  .pulse { color: var(--articles); opacity: 0.85; flex: 0 0 auto; }
  .pulse path { stroke-dasharray: 130; stroke-dashoffset: 130; animation: trace 2.8s linear infinite; }
  @keyframes trace { 0% { stroke-dashoffset: 130; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.35rem, 2.3vw, 2rem); line-height: 1.08; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
  h1 .thin { color: var(--dim); font-weight: 700; }
  .top-r { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .thesis { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--articles); border: 1px solid rgba(232,179,74,0.35); background: rgba(232,179,74,0.07); border-radius: 999px; padding: 6px 14px; }
  .thesis::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--articles); box-shadow: 0 0 10px rgba(232,179,74,0.9); }
  .ghost { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--rule-lit); border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: border-color .15s, color .15s; }
  .ghost:hover { border-color: var(--flows); color: var(--flows); }
  .ghost:focus-visible { outline: 2px solid var(--flows); outline-offset: 2px; }
  .ghost.off { color: var(--dim); border-style: dashed; }

  /* ── the board ────────────────────────────────────────────── */
  .board { flex: 1 1 auto; min-height: 0; border: 1px solid var(--rule); border-radius: 6px; padding: 8px;
    background-color: var(--panel);
    background-image: linear-gradient(rgba(79,195,217,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(79,195,217,0.035) 1px, transparent 1px), linear-gradient(180deg, var(--panel-2), var(--panel));
    background-size: 40px 40px, 40px 40px, 100% 100%;
    box-shadow: 0 24px 70px rgba(0,0,0,0.45); }
  .fig-scroll { width: 100%; height: 100%; }
  #board { display: block; width: 100%; height: 100%; }

  svg text { font-family: var(--mono); }
  .t-hdr { font-size: 11px; fill: var(--dim); letter-spacing: 0.2em; }
  .t-hdr.on { fill: var(--ink); }
  .t-sub { font-size: 10.5px; fill: var(--dim); letter-spacing: 0.05em; }
  .t-sub.sm { font-size: 9.5px; }
  .t-lbl { font-size: 12px; fill: var(--muted); }
  .t-name { font-family: var(--display); font-size: 15px; font-weight: 700; fill: var(--ink); }
  .t-code { font-size: 11.5px; fill: var(--flows); }
  .t-gold { fill: var(--articles); } .t-cyan { fill: var(--flows); } .t-green { fill: var(--codemap); } .t-human { fill: var(--human); } .t-muted { fill: var(--muted); } .t-ink { fill: var(--ink); }

  .badge circle { fill: var(--hue); }
  .badge text { font-size: 11.5px; font-weight: 600; fill: #070B12; }

  .box { fill: var(--panel-2); stroke: var(--hue, var(--rule-lit)); stroke-width: 1.1; }
  .box.deep { fill: var(--panel); }
  .zone { fill: rgba(79,195,217,0.02); stroke: var(--rule-lit); stroke-width: 1; }
  .zone.ants { stroke: var(--hue, var(--mcp)); stroke-dasharray: 6 5; animation: ants 30s linear infinite; }
  @keyframes ants { to { stroke-dashoffset: -330; } }

  .w { fill: none; stroke: var(--hue, var(--rule-lit)); stroke-width: 1.5; opacity: 0.6; }
  .w.dash { stroke-dasharray: 5 4; }
  .flow { fill: none; stroke: var(--hue, var(--flows)); stroke-width: 2.2; stroke-dasharray: 3 11; opacity: 0.95; animation: dash-flow 1.2s linear infinite; }
  .flow.slow { animation-duration: 2.2s; }
  @keyframes dash-flow { to { stroke-dashoffset: -14; } }

  /* cylinder bands + exploded discs */
  .band .fill { fill: var(--bg, #131E2C); stroke: var(--hue); stroke-width: 1.2; }
  .band .nm { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--hue); }
  .band.parked { opacity: 0.45; }
  .band.parked.next { opacity: 0.68; }
  .band.parked .fill { stroke-dasharray: 4 3; }
  .band.lit .fill { stroke-width: 2.2; }
  .band.lit { animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { filter: drop-shadow(0 0 5px rgba(232,179,74,0.45)); } 50% { filter: drop-shadow(0 0 14px rgba(232,179,74,0.9)); } }
  .chipb rect { fill: var(--panel); stroke: var(--rule-lit); stroke-dasharray: 4 3; }
  .chipb text { font-size: 10px; fill: var(--dim); letter-spacing: 0.12em; }
  .chipb.on rect { fill: rgba(232,179,74,0.12); stroke: var(--articles); stroke-dasharray: none; }
  .chipb.on text { fill: var(--articles); }

  .spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .newdoc { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .caret { fill: var(--flows); animation: blink 1s steps(2) infinite; }
  .led { animation: blink 2.4s ease-in-out infinite; }

  /* step focus */
  .zg { transition: opacity .35s; }
  .zg[data-go] { cursor: pointer; }
  #board.focus .zg:not(.on) { opacity: 0.16; }

  /* ── dock: steps + caption ────────────────────────────────── */
  .dock { display: flex; flex-direction: column; gap: 8px; }
  .steps-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .play { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--void); background: var(--articles); border: none; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 500; transition: filter .15s; }
  .play:hover { filter: brightness(1.12); }
  .play:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--muted); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; cursor: pointer; transition: border-color .15s, color .15s, background .15s; }
  .chip b { color: var(--hue); font-weight: 500; margin-right: 6px; }
  .chip:hover { border-color: var(--rule-lit); color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--flows); outline-offset: 2px; }
  .chip.on { color: var(--ink); border-color: var(--hue); background: var(--panel-3); }
  .keys { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; color: var(--dim); margin-left: auto; }
  .keys kbd { font-family: inherit; color: var(--muted); border: 1px solid var(--rule-lit); border-radius: 4px; padding: 0 5px; margin: 0 2px; }
  .caption { display: flex; align-items: baseline; gap: 12px; min-height: 44px; }
  .cap-step { flex: 0 0 auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--hue, var(--articles)); text-transform: uppercase; }
  .cap-text { margin: 0; font-size: 14.5px; color: var(--muted); line-height: 1.5; max-width: 170ch; }
  .cap-text b { color: var(--ink); font-weight: 600; }

  /* motion off — a user toggle, not the OS setting (the VDI reports reduced-motion unconditionally) */
  body.no-motion .pulse path, body.no-motion .zone.ants, body.no-motion .flow, body.no-motion .band.lit,
  body.no-motion .spin, body.no-motion .newdoc, body.no-motion .caret, body.no-motion .led { animation: none !important; }
  body.no-motion .pulse path { stroke-dashoffset: 0; }
  body.no-motion .pkt { display: none; }
  body.no-motion .zg { transition: none; }

  /* narrow or short windows: stop fitting to the viewport, let the diagram scroll in its own box */
  @media (max-width: 1080px), (max-height: 600px) {
    html, body, .app { height: auto; }
    .app { padding-inline: 16px; }
    .board { flex: none; }
    .fig-scroll { overflow-x: auto; height: auto; }
    #board { min-width: 1180px; height: auto; }
    .keys { display: none; }
    .caption { flex-direction: column; gap: 4px; }
  }
</style>

<script>
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const H = { gold: "#E8B34A", cyan: "#4FC3D9", green: "#5BD6A0", orange: "#F2825C", dim: "#1B2736" };
  const board = $("board");

  /* ── observability tiles ─────────────────────────────────── */
  const TILES = [
    { name: "Hit rate @k",        q: "RIGHT CHUNK IN TOP-K?",  pts: [34, 30, 26, 22, 24, 15, 12, 6], hue: H.green },
    { name: "MRR",                q: "HOW HIGH DID IT RANK?",  pts: [35, 32, 30, 24, 20, 21, 13, 9], hue: H.green },
    { name: "Citation precision", q: "EVERY CLAIM SOURCED?",   pts: [26, 20, 22, 14, 15, 10, 9, 5],  hue: H.gold },
    { name: "No-answer rate",     q: "WHAT WENT UNSERVED?",    pts: [6, 8, 14, 18, 22, 27, 30, 33], hue: H.orange },
    { name: "Latency p95",        q: "TOOL-CALL ROUND TRIP",   pts: [20, 18, 24, 16, 22, 17, 20, 18], hue: H.cyan },
    { name: "Freshness",          q: "AGE OF THE LAST LOAD",   pts: [30, 30, 12, 20, 28, 10, 18, 26], hue: H.cyan },
  ];
  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  TILES.forEach((t, i) => {
    const x = 456 + i * 182, y = 578, g = el("g", {});
    g.appendChild(el("rect", { x, y, width: 170, height: 102, rx: 3, fill: "#0E1622", stroke: "#1B2736" }));
    g.appendChild(el("rect", { x, y, width: 170, height: 2, fill: t.hue }));
    g.appendChild(el("text", { class: "t-name", x: x + 12, y: y + 23, style: "font-size:13.5px" }, t.name));
    g.appendChild(el("text", { class: "t-sub sm", x: x + 12, y: y + 39 }, t.q));
    const by = y + 50, dx = 146 / (t.pts.length - 1);
    const line = t.pts.map((p, j) => `${(x + 12 + j * dx).toFixed(1)},${by + p}`);
    g.appendChild(el("line", { x1: x + 12, y1: by + 42, x2: x + 158, y2: by + 42, stroke: "#1B2736" }));
    g.appendChild(el("polyline", { points: line.join(" "), fill: "none", stroke: t.hue, "stroke-width": 1.6, "stroke-linejoin": "round", opacity: 0.9 }));
    const last = line[line.length - 1].split(",");
    g.appendChild(el("circle", { cx: last[0], cy: last[1], r: 3, fill: t.hue }));
    $("tiles").appendChild(g);
  });

  /* ── golden-set dots ─────────────────────────────────────── */
  const GOLD = "hhhhlhhhmhhhhhhhlhhhhhhmhhlh".split("");
  const GCOL = { h: H.green, l: H.gold, m: H.orange };
  const dots = GOLD.map((r, i) => {
    const d = el("rect", { x: 1138 + (i % 14) * 29, y: 390 + Math.floor(i / 14) * 26, width: 20, height: 18, rx: 3, fill: GCOL[r], stroke: "#070B12" });
    $("gold").appendChild(d);
    return d;
  });

  /* ── the VS Code pane: ask → tool call → grounded answer → re-score ── */
  const QA = [
    { q: "What changes in the April interchange article?",
      a: ["Two program rates move and one designator is added.", "Rates and effective date quoted from the chunks below."],
      c: ["ART-0412 §2.1 p.3", "ART-0412 §4.2 p.7", "ART-0398 §1.3 p.2"] },
    { q: "Which article introduces the new product designator?",
      a: ["One article defines it, in §2.1.", "Two later articles only reference it — ranked below."],
      c: ["ART-0412 §2.1 p.3", "ART-0420 §3.4 p.5", "ART-0431 §1.1 p.1"] },
    { q: "Target rate for the fee program in §4.2 — effective when?",
      a: ["Rate and effective date both quoted from §4.2.", "Single-source: no other chunk confirms it — flagged."],
      c: ["ART-0412 §4.2 p.7", "ART-0412 §4.3 p.8", "ART-0405 §2.2 p.4"] },
  ];
  let motion = true, gen = 0;
  const wait = (ms, g) => new Promise((ok) => setTimeout(() => ok(g === gen), ms));
  function paint(i, stage) {           /* stage 0 = question only · 1 = + tool · 2 = + answer */
    const x = QA[i];
    $("vtool").style.opacity = stage >= 1 ? 1 : 0;
    $("va1").textContent = stage >= 2 ? x.a[0] : ""; $("va2").textContent = stage >= 2 ? x.a[1] : "";
    $("vcites").style.opacity = stage >= 2 ? 1 : 0;
    x.c.forEach((t, j) => { $("vc" + j).textContent = t; });
  }
  async function loop(g) {
    let i = 0;
    if (!(await wait(2600, g))) return;
    while (g === gen) {
      i = (i + 1) % QA.length;
      paint(i, 0); $("vq").textContent = "";
      for (const ch of QA[i].q) { $("vq").textContent += ch; if (!(await wait(26, g))) return; }
      if (!(await wait(350, g))) return; paint(i, 1);
      if (!(await wait(650, g))) return; paint(i, 2);
      dots.forEach((d) => d.setAttribute("fill", H.dim));
      for (let k = 0; k < dots.length; k++) { dots[k].setAttribute("fill", GCOL[GOLD[k]]); if (!(await wait(55, g))) return; }
      if (!(await wait(3200, g))) return;
    }
  }
  function rest() { $("vq").textContent = QA[0].q; paint(0, 2); dots.forEach((d, k) => d.setAttribute("fill", GCOL[GOLD[k]])); }

  /* ── motion toggle ───────────────────────────────────────── */
  const motionBtn = $("motionBtn");
  function applyMotion() {
    document.body.classList.toggle("no-motion", !motion);
    motionBtn.textContent = motion ? "✦ Motion on" : "✦ Motion off";
    motionBtn.setAttribute("aria-pressed", String(motion));
    motionBtn.classList.toggle("off", !motion);
    gen++; rest();
    try { motion ? board.unpauseAnimations() : board.pauseAnimations(); } catch (e) {}
    if (motion) loop(gen);
  }
  motionBtn.addEventListener("click", () => { motion = !motion; applyMotion(); });

  /* ── walkthrough ─────────────────────────────────────────── */
  const STEPS = [
    { k: "Expand",  hue: H.gold,  t: "<b>Layer 01 is not one thing.</b> For Visa alone it is four document families — Payment Brand Articles, Tech Letters, Interchange Guides, Auth &amp; Clearing Guides. Phase 1.1 takes the first and leaves the other three dashed: <b>same pipeline, later.</b>" },
    { k: "Ingest",  hue: H.gold,  t: "<b>One agent owns the slice's freshness.</b> It pulls new article PDFs, extracts text, tables and figures, and chunks <b>by section</b> — so every chunk keeps its article id, §, page and effective date — then embeds and upserts. Content-hashed: a re-run changes only what changed." },
    { k: "Connect", hue: H.cyan,  t: "<b>The knowledge base is a service, reached over MCP</b> — the protocol VS Code agent mode already speaks. Three read-only tools return chunks, scores and citations; the same retrieval API underneath serves batch evals with no IDE in the loop." },
    { k: "Test",    hue: H.cyan,  t: "<b>Engineers ask real questions in VS Code and see exactly which chunks came back.</b> A golden set — question → expected article and section — turns “seems right” into a score, re-run after every load so the numbers stay comparable." },
    { k: "Observe", hue: H.green, t: "<b>Every tool call leaves a trace:</b> query, chunk ids, scores, latency, verdict. Six signals trend per load; <b>a person reviews the misses</b> and sends fixes back to the agent — re-chunk, re-embed, tune top-k, grow the golden set." },
  ];
  const REST_TEXT = "<b>Phase 1.1 is done when:</b> the agent loads Visa Payment Brand Articles on a schedule, unattended &nbsp;·&nbsp; a VS Code agent answers from the knowledge base with citations &nbsp;·&nbsp; retrieval accuracy is a number on a dashboard, re-scored on every load. Click a step, or any part of the picture.";
  const row = $("stepsRow"), playBtn = $("playBtn"), keys = row.querySelector(".keys");
  const chips = STEPS.map((s, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.style.setProperty("--hue", s.hue); b.id = "step" + (i + 1);
    b.innerHTML = `<b>${i + 1}</b>${s.k}`;
    b.addEventListener("click", () => { stop(); setStep(cur === i ? -1 : i); });
    row.insertBefore(b, keys);
    return b;
  });
  const zones = [...board.querySelectorAll("[data-steps]")];
  let cur = -1, timer = null;
  function setStep(i) {
    cur = i;
    board.classList.toggle("focus", i >= 0);
    zones.forEach((z) => z.classList.toggle("on", i >= 0 && z.dataset.steps.split(" ").includes(String(i + 1))));
    chips.forEach((c, j) => c.classList.toggle("on", j === i));
    $("capStep").textContent = i >= 0 ? `Step ${i + 1} · ${STEPS[i].k}` : "Exit criteria";
    $("capStep").style.setProperty("--hue", i >= 0 ? STEPS[i].hue : H.gold);
    $("capText").innerHTML = i >= 0 ? STEPS[i].t : REST_TEXT;
  }
  function stop() { clearInterval(timer); timer = null; playBtn.innerHTML = "&#9654; Walk it"; }
  function play() {
    if (timer) { stop(); return; }
    playBtn.innerHTML = "&#10073;&#10073; Pause";
    setStep(cur >= STEPS.length - 1 ? 0 : cur + 1);
    timer = setInterval(() => { if (cur >= STEPS.length - 1) { stop(); setStep(-1); } else setStep(cur + 1); }, 7000);
  }
  playBtn.addEventListener("click", play);
  zones.forEach((z) => { if (z.dataset.go) z.addEventListener("click", () => { stop(); const i = +z.dataset.go - 1; setStep(cur === i ? -1 : i); }); });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("button") && e.key === " ") return;
    if (e.key === " ") { e.preventDefault(); play(); }
    else if (e.key === "ArrowRight") { stop(); setStep(Math.min(cur + 1, STEPS.length - 1)); }
    else if (e.key === "ArrowLeft") { stop(); setStep(Math.max(cur - 1, -1)); }
    else if (e.key === "Escape") { stop(); setStep(-1); }
  });

  setStep(-1);
  applyMotion();
</script>
