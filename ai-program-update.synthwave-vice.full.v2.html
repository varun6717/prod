/* ═══════════════════════════════════════════════════════════════════════
   DESIGN TOKENS — "Glass Circuit"
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg-0:#0B0D12; --bg-1:#10131A; --bg-2:#161A23;
  --glass:rgba(255,255,255,.035); --glass-hi:rgba(255,255,255,.07);
  --edge:rgba(255,255,255,.10); --edge-lit:rgba(255,255,255,.22);
  --ink:#F3F5F9; --muted:#A6AEBF; --dim:#5F6779; --faint:#2A303D;
  --cyan:#3DE0FF; --violet:#8E7CFF; --cyan-rgb:61,224,255; --violet-rgb:142,124,255;
  --ok:#41E39B; --warn:#FFB547; --bad:#FF5E7A;        /* reserved for status */
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --out:cubic-bezier(.16,1,.3,1);
  --snap:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none} a{color:inherit}

/* ── fixed 1920×1080 stage, scaled to any window ─────────────────────── */
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg-0)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:center;
  background:
    radial-gradient(900px 600px at 78% 40%, rgba(var(--violet-rgb),.10), transparent 70%),
    radial-gradient(1100px 700px at 18% 70%, rgba(var(--cyan-rgb),.07), transparent 70%),
    linear-gradient(180deg,var(--bg-1),var(--bg-0))}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(var(--hi-rgb),.07) 1px,transparent 1.2px);background-size:40px 40px}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ── circuit layer (procedural SVG, behind every scene) ─────────────── */
#circuit{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1.2s ease}
#circuit .trace{fill:none;stroke:rgba(var(--hi-rgb),.075);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#circuit .pulse{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:36 1000;stroke-dashoffset:36;filter:url(#glow);opacity:.9;
  animation:pulse var(--dur,9s) linear var(--delay,0s) infinite}
#circuit .pulse.c{stroke:var(--cyan)} #circuit .pulse.v{stroke:var(--violet)}
@keyframes pulse{to{stroke-dashoffset:-1000}}
/* calm mode (data-calm on a scene): pulses crawl, node glow slows */
#circuit.calm .pulse{animation-duration:calc(var(--dur,9s)*6)}
#circuit.calm .node.lit{animation-duration:16s}
#circuit .node{fill:var(--bg-0);stroke:rgba(var(--hi-rgb),.22);stroke-width:2}
#circuit .node.lit{animation:nodeGlow 3.6s ease-in-out var(--delay,0s) infinite}
@keyframes nodeGlow{0%,100%{stroke:rgba(var(--hi-rgb),.22);filter:none}50%{stroke:var(--cyan);filter:url(#glow)}}

/* ── scenes ─────────────────────────────────────────────────────────── */
.scene{position:absolute;inset:0;z-index:1;display:none;padding:110px 120px 140px}
.scene.on{display:block}
.scene.out{animation:sceneOut .4s var(--snap) forwards}
@keyframes sceneOut{to{opacity:0;filter:blur(10px);transform:scale(.985)}}

/* animation primitives: add .a + a motion class; --d = delay in ms */
.a{opacity:0;animation-fill-mode:both;animation-timing-function:var(--out);animation-duration:.9s;
   animation-delay:calc(var(--d,0)*1ms);animation-play-state:paused}
.scene.on .a{animation-play-state:running}
.scene.on .a.rise{animation-name:rise}
.scene.on .a.fade{animation-name:fade}
.scene.on .a.focus{animation-name:focus}            /* blur → sharp */
.scene.on .a.wipe{animation-name:wipe;transform-origin:left}
.scene.on .a.slide-l{animation-name:slideL}
.scene.on .a.slide-r{animation-name:slideR}
.scene.on .a.pop{animation-name:pop;animation-timing-function:var(--out);animation-duration:.7s}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes focus{from{opacity:0;filter:blur(14px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes wipe{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes slideL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000}
.scene.on .draw{animation:draw 1.3s var(--out) calc(var(--d,0)*1ms) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ── shared components ──────────────────────────────────────────────── */
.glass{background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1px solid var(--edge);
  border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 1px 0 rgba(var(--hi-rgb),.08)}
.label{font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.grad{background:linear-gradient(92deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
/* hover blurb · any element with data-tip (and optional data-tk kicker) */
#tip{position:absolute;left:0;top:0;z-index:70;width:max-content;max-width:420px;padding:12px 16px 13px;border-radius:12px;border:1px solid var(--edge-lit);
  background:rgba(var(--deep-rgb),.94);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(var(--cyan-rgb),.12) inset;pointer-events:none;opacity:0;transform:translate(-50%,6px) scale(.97);
  transition:opacity .18s ease,transform .22s var(--out)}
#tip.show{opacity:1;transform:translate(-50%,0) scale(1)}
#tip.below{transform:translate(-50%,-6px) scale(.97)} #tip.below.show{transform:translate(-50%,0) scale(1)}
#tip .tk{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:5px}
#tip .tb{font-size:14.5px;line-height:1.45;color:var(--ink)}
#tip .tb b{color:var(--cyan);font-weight:600}
#tip::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:rgba(var(--deep-rgb),.94);border-right:1px solid var(--edge-lit);border-bottom:1px solid var(--edge-lit)}
#tip.below::after{bottom:auto;top:-6px;border:0;border-left:1px solid var(--edge-lit);border-top:1px solid var(--edge-lit)}
[data-tip],[data-tipref]{cursor:help}

#tip.wide{max-width:720px;padding:14px 18px 14px}
#tip .cd{margin-top:4px} #tip .cd .fn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px} #tip .cd .fn:first-child{margin-top:0}
#tip .cd .ln{font-family:var(--mono);font-size:12.5px;line-height:1.75;color:var(--code);white-space:pre;padding:0 10px;border-radius:4px;position:relative}
#tip .cd .ln.cm{color:var(--dim)}
#tip .cd .ln.js{white-space:pre-wrap;padding-left:22px;text-indent:-12px;line-height:1.6;font-size:12.5px} #tip .cd .ln.js i{font-style:normal;color:var(--warn)} #tip .cd .ln.js span{color:var(--code-hi)}
#tip .cd .ln.js.grp{margin-top:4px;color:var(--dim)} #tip .cd .ln.js.grp i{color:var(--cyan)}
#tip.wide{max-width:780px}
#tip .cd .ln.add{background:rgba(var(--ok-rgb),.14);color:var(--code-hi);box-shadow:inset 3px 0 0 var(--ok)}
#tip .cd .ln.rep{background:rgba(var(--bad-rgb),.14);color:var(--code-hi);box-shadow:inset 3px 0 0 var(--bad)}
#tip .cd .ln[data-m]{padding-right:110px} #tip .cd .ln[data-m]::after{content:attr(data-m);position:absolute;right:10px;top:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok)} #tip .cd .ln.rep[data-m]::after{color:var(--bad)}
#tip .cd .tf{font-size:13.5px;line-height:1.4;color:var(--ink);margin-top:10px;padding-top:8px;border-top:1px solid rgba(var(--hi-rgb),.08)} #tip .cd .tf b{color:var(--cyan)}
#tip .cd .tn{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:6px}/* closer look · any main box can be clicked to blow it up (see ZOOMABLE in the script) */
.scene.status .card,.scene.status .ask,.scene.wins .vis,.scene.ic2 .sys:not(.gone),.scene.pov .map,.scene.pov .why,.scene.pbm .col,.scene.ps2 .chat,.scene.ps2 .doc,.scene.ps2 .sifile,.scene.ps4 .jira,.scene.ps5 .dgs{cursor:zoom-in;transition:outline-color .25s}
.scene.status .card:hover,.scene.status .ask:hover,.scene.wins .vis:hover,.scene.ic2 .sys:not(.gone):hover,.scene.pov .map:hover,.scene.pov .why:hover,.scene.pbm .col:hover,.scene.ps2 .chat:hover,.scene.ps2 .doc:hover,.scene.ps2 .sifile:hover{outline:1px solid rgba(var(--cyan-rgb),.45);outline-offset:3px;border-radius:inherit}
#zoom{position:absolute;inset:0;z-index:65;display:none;place-items:center;background:rgba(var(--deep-rgb),.72);backdrop-filter:blur(10px);opacity:0;transition:opacity .3s ease}
#zoom.show{display:grid} #zoom.in{opacity:1}
#zoom.auto{pointer-events:none} #zoom.auto .zbox{pointer-events:auto}   /* beat-driven: the Next / Back chrome stays clickable underneath */
#zoom .zbox{position:relative;border-radius:24px;background:var(--panel-2);overflow:hidden;box-shadow:0 0 0 1px rgba(var(--cyan-rgb),.3),0 0 90px rgba(var(--cyan-rgb),.14),0 50px 120px rgba(0,0,0,.6);transform:scale(.9);transition:transform .5s var(--out)}
#zoom.in .zbox{transform:none}
#zoom .zwrap{position:absolute;left:0;top:0;transform-origin:top left;padding:0!important}
#zoom .zwrap .a{opacity:1!important;animation:none!important;transform:none!important;filter:none!important}
#zoom .zwrap .draw{stroke-dashoffset:0!important;animation:none!important}
#zoom .zwrap *{cursor:default} #zoom .zwrap [data-tip],#zoom .zwrap [data-tipref]{cursor:help}
#zoom .zx{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border-radius:14px;border:1px solid var(--edge-lit);background:var(--panel);color:var(--ink);font:300 28px/1 var(--display);cursor:pointer;display:grid;place-items:center;padding:0 0 3px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#zoom .zx:hover{background:var(--panel)}
#zoom .zcap{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,20px);z-index:60;padding:14px 22px;border-radius:14px;
  font-family:var(--mono);font-size:18px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
a.lnk{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:18px;color:var(--cyan);text-decoration:none;
  border-bottom:1px dashed rgba(var(--cyan-rgb),.5);padding-bottom:2px}
a.lnk.xl{font-size:12px;padding:4px 10px;gap:6px;border:1px dashed rgba(var(--cyan-rgb),.6);border-radius:8px;background:rgba(var(--cyan-rgb),.06);white-space:nowrap;vertical-align:middle}
a.lnk.xl.pending::after{font-size:9.5px;padding:1px 6px}
a.lnk.xl.t{display:inline;font-size:inherit;font-family:inherit;letter-spacing:inherit;padding:0;border:0;border-bottom:1px dashed rgba(var(--cyan-rgb),.65);border-radius:0;background:none;color:var(--cyan)}
a.lnk.xl.t::after{display:none} a.lnk.xl.t.pending{color:var(--cyan)}
.status .card .top a.xl{font-size:13px} .wins .body a.xl{align-self:flex-start;margin-top:4px}
.ic2 .sys > a.xl{position:absolute;right:12px;top:40px;font-size:11px;padding:3px 8px}
.pov .why a.xl{margin:16px 10px 0 0} .bz .pane .ph a.xl{margin-left:10px;font-size:10.5px;padding:2px 8px}
a.lnk.pending{color:var(--ink);border-bottom-color:rgba(var(--cyan-rgb),.5);cursor:help}
a.lnk.pending::after{content:"link pending";font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;
  border:1px solid rgba(var(--warn-rgb),.6);color:var(--warn);background:rgba(var(--warn-rgb),.12)}

/* ═══════════════════════════════════════════════════════════════════════
   SCENE · COVER  — the title is a payment card
   ═══════════════════════════════════════════════════════════════════════ */
.cover{padding:0}
.cover .beam{position:absolute;top:0;bottom:0;left:0;width:3px;z-index:5;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,var(--cyan) 30%,#fff 50%,var(--cyan) 70%,transparent);
  box-shadow:0 0 24px 6px rgba(var(--cyan-rgb),.55),0 0 80px 20px rgba(var(--cyan-rgb),.25)}
.scene.on .beam{animation:beam 1.1s linear 1.75s forwards}
@keyframes beam{0%{opacity:0;transform:translateX(0)}6%{opacity:1}94%{opacity:1}100%{opacity:0;transform:translateX(1920px)}}

/* card wrapper: 1040 × 656 = ISO card ratio 1.586, perspective for tilt */
.cover .cardwrap{position:absolute;left:120px;top:176px;width:1040px;height:656px;perspective:1900px}
/* the card deals in: far away and small, spinning on its vertical axis, landing on its resting angle */
.cover .card3d{position:absolute;inset:0;transform-style:preserve-3d;--rx:4deg;--ry:-9deg;opacity:0;
  transform:rotateX(var(--rx)) rotateY(var(--ry))}
.scene.on.cover .card3d{animation:dealIn 1.8s cubic-bezier(.22,.85,.25,1) .15s both}
@keyframes dealIn{
  0%{opacity:0;transform:translateZ(-2600px) translateY(80px) rotateX(14deg) rotateY(calc(var(--ry) - 900deg))}
  10%{opacity:1}
  100%{opacity:1;transform:translateZ(0) translateY(0) rotateX(var(--rx)) rotateY(var(--ry))}}
.cover .cardback{position:absolute;inset:0;border-radius:36px;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:linear-gradient(160deg,var(--panel),#0C0E14 60%,var(--panel));box-shadow:0 50px 100px rgba(0,0,0,.6),0 0 0 1px rgba(var(--hi-rgb),.08)}
.cover .cardback::before{content:"";position:absolute;left:0;right:0;top:64px;height:96px;background:linear-gradient(180deg,#05060A,#1A1D26 50%,#05060A)}
.cover .cardback::after{content:"";position:absolute;left:52px;right:52px;top:210px;height:70px;border-radius:10px;
  background:repeating-linear-gradient(0deg,rgba(var(--hi-rgb),.07) 0 2px,transparent 2px 9px)}
.cover .cardback .bt{position:absolute;left:52px;bottom:42px;font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.cover .card{position:absolute;inset:0;border-radius:36px;padding:44px 52px 42px;display:flex;flex-direction:column;justify-content:space-between;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:
    radial-gradient(700px 400px at 80% 110%,rgba(var(--violet-rgb),.22),transparent 60%),
    radial-gradient(600px 400px at 0% 0%,rgba(var(--cyan-rgb),.18),transparent 60%),
    linear-gradient(160deg,rgba(var(--hi-rgb),.09),rgba(var(--hi-rgb),.025) 50%,rgba(var(--hi-rgb),.05)),
    linear-gradient(180deg,rgba(var(--deep-rgb),.86),rgba(var(--deep-rgb),.9));
  backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:0 50px 100px rgba(0,0,0,.6),0 0 0 1px rgba(var(--hi-rgb),.09),inset 0 1px 0 rgba(var(--hi-rgb),.14)}
.cover .card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;   /* micro-circuit etching */
  background-image:linear-gradient(rgba(var(--hi-rgb),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--hi-rgb),.05) 1px,transparent 1px);
  background-size:52px 52px;mask-image:radial-gradient(800px 500px at 70% 30%,#000 20%,transparent 80%);-webkit-mask-image:radial-gradient(800px 500px at 70% 30%,#000 20%,transparent 80%)}
.cover .sheen{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(112deg,transparent 35%,rgba(var(--hi-rgb),.16) 45%,rgba(var(--cyan-rgb),.28) 50%,rgba(var(--violet-rgb),.22) 55%,transparent 66%);
  transform:translateX(calc(-70% + var(--sx,0%)))}
.scene.on.cover .sheen{animation:sheen 1.5s var(--out) 2.05s forwards}
@keyframes sheen{from{transform:translateX(-70%)}to{transform:translateX(70%)}}

.cover .row{display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;z-index:1}
.cover .emv{width:84px;height:62px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.cover .nfc{width:34px;height:34px;margin-left:16px;flex:none;stroke:rgba(var(--hi-rgb),.55);fill:none;stroke-width:2.4;stroke-linecap:round}
.cover .kicker{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
.cover .kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}

.cover h1{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:96px;line-height:1;letter-spacing:-.035em;white-space:nowrap;margin:0}
.cover h1 .w{display:inline-block;margin-right:.22em}

/* embossed text, like card numbers */
.emb{color:#DCE1EA;text-shadow:-1px -1px 0 rgba(var(--hi-rgb),.28),1px 1px 0 rgba(0,0,0,.65),0 3px 8px rgba(0,0,0,.45)}
.cover .num{position:relative;z-index:1}
.cover .num .digits{font-family:var(--mono);font-weight:500;font-size:46px;letter-spacing:.14em;display:flex;gap:.6em}
.cover .num .digits span{display:inline-block}
.cover .num .k{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.cover .num .k b{font-weight:500;color:var(--muted)}

.cover .foot{align-items:flex-end}
.cover .foot .k{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.cover .foot .v{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.12em;text-transform:uppercase}
.cover .mark{display:flex;align-items:center;gap:12px}
.cover .mark svg{width:58px;height:58px;overflow:visible}
.cover .mark .t{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);line-height:1.6;text-align:right}

/* section strip, beneath the card */
.cover .sections{position:absolute;left:120px;top:868px;width:1040px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cover .sec{position:relative;padding:14px 0 0;border-top:2px solid var(--faint);cursor:pointer}
.cover .sec::before{content:"";position:absolute;left:0;top:-2px;height:2px;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.scene.on.cover .sec::before{animation:fill .8s var(--out) calc(var(--d,0)*1ms) forwards}
@keyframes fill{to{width:100%}}
.cover .sec .n{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--cyan);margin-bottom:4px}
.cover .sec .t{font-size:17px;line-height:1.3;color:var(--muted);font-weight:500}
.cover .sec:hover .t{color:var(--ink)}

/* the processing core on the right */
.cover .core{position:absolute;left:1250px;top:230px;width:560px;height:580px;clip-path:inset(0 100% 0 0)}
.scene.on.cover .core{animation:revealCore .3s linear 2.45s forwards}
@keyframes revealCore{to{clip-path:inset(0 0 0 0)}}
.cover .core svg{width:100%;height:100%;overflow:visible}
.core .shell{fill:url(#shellFill);stroke:var(--edge-lit);stroke-width:1.5}
.core .inner{fill:none;stroke:rgba(var(--hi-rgb),.14);stroke-width:1.5;stroke-dasharray:6 10}
.core .ring{fill:none;stroke:url(#ringGrad);stroke-width:3;transform-origin:280px 280px;animation:spin 18s linear infinite}
.core .ring2{fill:none;stroke:rgba(var(--violet-rgb),.5);stroke-width:1.5;stroke-dasharray:2 14;transform-origin:280px 280px;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core .spark{fill:url(#sparkGrad);transform-origin:280px 280px;animation:sparkle 3.2s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0deg);opacity:.95}50%{transform:scale(1.12) rotate(45deg);opacity:1}}
.core .pin{stroke:rgba(var(--hi-rgb),.28);stroke-width:3;stroke-linecap:round}
.core .lead{fill:none;stroke:rgba(var(--hi-rgb),.12);stroke-width:2}
.core .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:24 1000;stroke-dashoffset:24;filter:url(#glow);
  animation:pulse var(--dur,4s) linear var(--delay,0s) infinite}
.core .flow.c{stroke:var(--cyan)} .core .flow.v{stroke:var(--violet)}
.core .lbl{font-family:var(--mono);font-size:13px;letter-spacing:.18em;fill:var(--dim);text-transform:uppercase}


/* ═══════════════════════════════════════════════════════════════════════
   SCENE · PROJECT STATUS  — one wide card per click; settled projects stack as rows
   ═══════════════════════════════════════════════════════════════════════ */
.status{padding-top:84px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.kick{font-family:var(--mono);font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.kick span{color:var(--dim);margin-left:14px}
.hd h2{font-family:var(--display);font-weight:700;font-size:50px;line-height:1.06;letter-spacing:-.03em;margin-top:12px;max-width:1260px}
.tally{display:flex;gap:10px;padding-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;border:1px solid var(--edge);background:var(--glass-hi);
  font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--dim));box-shadow:0 0 10px var(--c,transparent)}
.chip b{color:var(--ink);font-weight:600}

/* shared bits */
.status .st{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.status .st i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.status .sev{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:7px;border:1px solid var(--s);color:var(--s);white-space:nowrap}
.status .sev.none{border-color:var(--faint);color:var(--dim)}
.status .tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(var(--cyan-rgb),.45);
  padding:4px 9px;border-radius:7px;cursor:pointer;vertical-align:middle}

/* settled rows */
.status .rows{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.status .row{display:none;grid-template-columns:150px 400px 1fr auto;align-items:center;gap:28px;padding:0 30px;height:64px;border-radius:16px;
  opacity:0;transform:translateY(-14px);transition:opacity .5s var(--out),transform .5s var(--out),height .4s var(--out)}
.status .row.in{display:grid;opacity:1;transform:none}
.status .row .nm{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.status .row .ln{font-size:17.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .row.settle{animation:rowSettle .55s var(--out) both}
@keyframes rowSettle{from{opacity:0;transform:translateY(40px) scale(1.02)}to{opacity:1;transform:none}}
.status.final .row{height:84px;border-radius:18px}
.status.final .row .ln{font-size:19.5px;color:var(--ink)}
.status.final .card{display:none}
.status.final .asks{margin-top:28px}

/* the wide card for the project in focus */
.status .card{margin-top:16px;padding:36px 46px 40px;border-radius:26px;opacity:0;transform:translateY(44px);
  transition:opacity .65s var(--out),transform .65s var(--out);box-shadow:0 0 0 1px rgba(var(--cyan-rgb),.45),0 0 70px rgba(var(--cyan-rgb),.14),0 40px 90px rgba(0,0,0,.5)}
.status .card.in{opacity:1;transform:none}
.status .card.in .st i{animation:ignite 1s var(--out) .35s both}
.status .card.leaving{animation:cardLeave .32s var(--snap) forwards}
@keyframes cardLeave{to{opacity:0;transform:translateY(-40px) scale(.97);filter:blur(6px)}}
.status .card .top{display:flex;align-items:center;gap:26px}
.status .card .top h3{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.03em;flex:1;display:flex;align-items:center;gap:14px}
.status .card .cols{display:grid;grid-template-columns:1.15fr 1fr 1.1fr;gap:52px;margin-top:30px}
.status .card .k{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--faint)}
.status .card .v{font-size:21px;line-height:1.5;color:var(--muted)}
.status .card .v b{color:var(--ink);font-weight:600}
.status .card ul li{font-size:21px;line-height:1.5;color:var(--muted);padding-left:20px;position:relative;margin-bottom:6px}
.status .card ul li::before{content:"";position:absolute;left:0;top:15px;width:9px;height:2px;background:var(--cyan)}
.status .card .risk .v{padding-left:20px;position:relative;margin-bottom:10px}
.status .card .risk .v::before{content:"";position:absolute;left:0;top:12px;width:8px;height:8px;border-radius:50%;background:var(--s);box-shadow:0 0 8px var(--s)}
.status .card .risk .v.none{padding-left:0;color:var(--dim)} .status .card .risk .v.none::before{display:none}

/* asks, final beat */
.status .asks{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;margin-top:22px}
.status .ask{padding:22px 28px;border-radius:18px;display:flex;gap:22px;align-items:center;opacity:0;transform:translateY(30px);
  transition:opacity .6s var(--out),transform .6s var(--out)}
.status .ask.in{opacity:1;transform:none} .status .ask.in.ask-fyi{transition-delay:.15s}
.status .ask.ask-primary{border-color:rgba(var(--cyan-rgb),.5);box-shadow:0 0 0 1px rgba(var(--cyan-rgb),.18),0 0 60px rgba(var(--cyan-rgb),.14),inset 0 1px 0 rgba(var(--hi-rgb),.08)}
.status .ask .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);writing-mode:vertical-rl;transform:rotate(180deg);
  border-right:1px solid rgba(var(--cyan-rgb),.35);padding-left:10px;line-height:1}
.status .ask.ask-fyi .lbl{color:var(--dim);border-right-color:var(--faint)}
.status .ask .t{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.3;color:var(--ink)}
.status .ask .m{font-family:var(--mono);font-size:14px;color:var(--muted);margin-top:7px;letter-spacing:.02em}
.status .ask .m em{font-style:normal;color:var(--warn);font-weight:500}

/* ═══════════════════════════════════════════════════════════════════════
   SCENE · KEY ACCOMPLISHMENTS  — one beat at a time; settled beats dock as stubs
   ═══════════════════════════════════════════════════════════════════════ */
.wins{padding-top:84px}
.wins .ledger{position:absolute;left:120px;top:176px;width:300px;display:flex;flex-direction:column;gap:14px}
.wins .slot{border-radius:16px;padding:14px 18px;min-height:104px;border:1px dashed var(--faint);display:flex;flex-direction:column;justify-content:center;transition:border-color .3s}
.wins .slot .n{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--dim)}
.wins .slot.todo .t{font-size:15px;color:var(--dim);margin-top:6px}
.wins .slot.live{border:1px solid rgba(var(--cyan-rgb),.55);box-shadow:0 0 30px rgba(var(--cyan-rgb),.12)}
.wins .slot.live .n{color:var(--cyan)} .wins .slot.live .t{font-size:15px;color:var(--muted);margin-top:6px}
.wins .slot.done{border:1px solid var(--edge);background:linear-gradient(160deg,var(--glass-hi),var(--glass))}
.wins .slot.done .n{color:var(--ok)} .wins .slot.done .n::after{content:" · settled"}
.wins .slot.done .b{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1;margin:6px 0 4px}
.wins .slot.done .t{font-size:14px;color:var(--muted);line-height:1.3}
.wins .slot.settle{animation:settle .6s var(--out) both}
@keyframes settle{from{opacity:0;transform:translateX(120px) scale(1.15);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

.wins .main{position:absolute;left:470px;top:176px;right:120px;bottom:150px;display:grid;grid-template-columns:560px 1fr;gap:40px;align-items:start}
.wins .main.leaving{animation:leave .32s var(--snap) forwards}
@keyframes leave{to{opacity:0;transform:translateX(-120px) scale(.92);filter:blur(8px)}}
.wins .proj{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.wins .proj i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.wins .big{font-family:var(--display);font-weight:700;font-size:168px;line-height:.95;letter-spacing:-.05em;margin-top:18px;display:flex;align-items:baseline;gap:8px}
.wins .big .u{font-size:56px;letter-spacing:-.02em}
.wins .big .cnt{min-width:1ch}
.wins .big .pre{font-size:96px;margin-right:2px}
.wins .big .u.sm{font-size:40px}
.wins .slot.done .b.sm{font-size:24px}
.wins .lab{font-family:var(--mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.wins h2{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.03em;margin-top:34px}
.wins .body{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.wins .body p{font-size:20px;line-height:1.5;color:var(--muted)} .wins .body p b{color:var(--ink);font-weight:600}
.wins .vis{border-radius:22px;padding:28px;min-height:560px;position:relative;overflow:hidden}
.wins .vis svg{width:100%;height:100%;display:block;overflow:visible}

<div id="viewport"><div id="stage"><div id="themefx"><i class="fx1"></i><i class="fx2"></i><i class="fx3"></i></div>

  <!-- ambient circuit traces: generated by JS -->
  <svg id="circuit" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
    <defs>

        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

                </linearGradient>

            (f.next?'<div class="nxt i" style="--d:'+(E+D(400))+'ms"><div class="nk">'+esc(f.next.k)+'</div><div class="nb"><b class="mid"><span data-count="'+f.next.before+'" data-d="'+(E+D(500))+'" data-t="700">0</span></b><em>→</em><b class="ok"><span data-count="'+f.next.after+'" data-d="'+(E+D(1300))+'" data-t="900">0</span></b></div><div class="nt">'+f.next.t+'</div></div>':
              '<div class="say ok i" style="--d:'+(E+D(400))+'ms;margin-top:0">Differences on this file are naming and style only. Same place, same behaviour.</div>')+'</div></div>';
          var XS={n:X.n,title:X.title,sub:X.sub};
          return {html:frame(XS,"1fr",b,"Mock rendition · lines representative · the real files are the linked artefacts · pick a file · hover a bubble for what it scores"),cls:"evz",w:1680,h:880,
            after:function(w){wireLinks();counters(w);var bz=$(".bz",w);if(!bz)return;
              bz.addEventListener("click",function(e){
                var il=e.target.closest("[data-ill]"); if(il){var r2=ILL[il.dataset.ill]();w.className="zwrap "+(r2.cls||"");w.innerHTML=r2.html;if(r2.after)r2.after(w);return}
                var ddb=e.target.closest(".ddb"); if(ddb){ddb.parentNode.classList.toggle("open");return}

            }}}
        /* rubric grid · the scored EDIT entries */
        function rubricIll(){var R=B5.diff.rubric,b='',N=R.cols.length;
          b+='<div><div class="rub i" style="--d:200ms;grid-template-columns:330px 110px repeat('+N+',1fr) 170px">'+
            '<div class="rh">Edited file</div><div class="rh">Stories</div>'+R.cols.map(function(c){return '<div class="rh c" data-tk="'+esc(c[0])+' · out of '+c[1]+'" data-tip="'+esc(c[2])+'">'+esc(c[0])+'<small>/ '+c[1]+'</small></div>'}).join("")+'<div class="rh s">Score</div>'+
            R.rows.map(function(r,ri){var d=500+ri*700;return '<div class="rf i" style="--d:'+d+'ms"><b>'+esc(r[0])+'</b></div><div class="rs i" style="--d:'+d+'ms">'+esc(r[1])+'</div>'+
              r[2].map(function(v,ci){var mx=R.cols[ci][1],cls=v===0?' zero':v<mx?' part':'';return '<div class="rc'+cls+' i" style="--d:'+(d+150+ci*120)+'ms" data-tk="'+esc(R.cols[ci][0])+' · '+v+' / '+mx+'" data-tip="'+esc(R.cols[ci][2])+'"><span data-count="'+v+'" data-d="'+(d+150+ci*120)+'" data-t="600">0</span></div>'}).join("")+
              '<div class="rt'+(r[3]<100?' mid':'')+' i" style="--d:'+(d+150+N*120+100)+'ms"><b>'+r[3]+'</b><span>'+esc(r[4])+'</span></div>'}).join("")+'</div>';
          var E=500+R.rows.length*700+400;
          b+='<div class="rfoot"><div class="say wa i" style="--d:'+E+'ms">'+R.why+'</div><div class="say ok i" style="--d:'+(E+500)+'ms">'+R.overall+'</div>'+
             '<div class="links i" style="--d:'+(E+900)+'ms"><div class="ll"><b>Real artefact</b>open when linked</div>'+R.links.map(function(l){return '<a data-link="'+l[0]+'">'+esc(l[1])+'</a>'}).join("")+'<a class="how" data-ill="s5-flow" style="margin-top:0">How a change is drafted · one picture →</a></div></div></div>';
          return {html:frame(R,"1fr",b,"Scores as recorded in code_changes.json · criterion meanings paraphrased, hover a column for them"),cls:"",w:1680,h:880,after:function(w){counters(w);wireLinks();bindIll(w)}}}
        function bindIll(w){var bz=$(".bz",w);if(!bz)return;bz.addEventListener("click",function(e){var il=e.target.closest("[data-ill]");if(il){var r2=ILL[il.dataset.ill]();w.className="zwrap "+(r2.cls||"");w.innerHTML=r2.html;if(r2.after)r2.after(w)}})}
        ILL["s5-inputs"]=inputsIll; ILL["s5-design"]=designIll; ILL["s5-diff"]=diffIll; ILL["s5-results"]=resultsIll; ILL["s5-flow"]=flowIll; ILL["s5-rubric"]=rubricIll; ILL["s5-compare"]=compareIll;
        var AUTO5={1:"s5-inputs",3:"s5-design",5:"s5-diff",8:"s5-results"},CARD5=[2,4],B5b={ask:6,log:7,res:8};
        function render5(g,step,dir){
          tm5.forEach(clearTimeout);tm5=[];
          var K=S5.kick,I=S5.intake,G=S5.gate,h='';
          h+='<div class="bar"><span>'+esc(S5.app.title)+' · <b>'+esc(S5.app.run)+'</b></span><span class="dots"><i></i><i></i><i></i></span></div><div class="log">';
          h+='<div class="msg op kickoff"><div class="bub"><div class="who"'+an(0,step,"fade",150)+'>'+esc(K.who)+'</div><div class="txt"'+an(0,step,"rise",250)+'>'+K.msg+'</div></div><div class="av"'+an(0,step,"pop",100)+'>'+ICO.person+'</div></div>';
          h+='<div class="msg ai"><div class="av"'+an(0,step,"pop",700)+'>'+ICO.spark+'</div><div class="bub"><div class="who"'+an(0,step,"fade",800)+'>'+esc(I.who)+' <em>· '+esc(I.tag)+'</em></div><div class="txt"'+an(0,step,"rise",900)+'>'+I.msg+'</div>'+
             '<div class="files">'+I.files.map(function(f,i){return '<span'+an(0,step,"pop",1300+i*200)+'>'+chip5(f)+'</span>'}).join("")+'</div>'+
             '<div class="arrow"'+an(0,step,"fade",2900)+'><i></i>'+esc(I.arrow)+'</div></div></div>';
          S5.checks.forEach(function(c,i){var k=CARD5[i];if(step>=k)h+=card4(c,k,step).replace('data-ill="s4-','data-ill="s5-')});
          if(step>=B5b.ask){
            var Q=G.ask;
            h+='<div class="msg ai ask"><div class="av"'+an(B5b.ask,step,"pop",100)+'>'+ICO.spark+'</div><div class="bub"><div class="who"'+an(B5b.ask,step,"fade",200)+'>'+esc(Q.who)+' <em>· '+esc(Q.tag)+'</em></div><div class="txt"'+an(B5b.ask,step,"rise",350)+'>'+Q.q+'</div>'+
               '<div class="opts">'+Q.opts.map(function(o,i){return '<span class="opt'+(step>=B5b.log&&i===0?' chosen':'')+'"'+an(B5b.ask,step,"pop",900+i*200)+'>'+esc(o)+'</span>'}).join("")+
               '<span class="pill'+(step>=B5b.log?' ok':' wait')+'"'+an(B5b.ask,step,"pop",1400)+'><i></i><span class="pt">'+esc(step>=B5b.log?G.pillOk:Q.pill)+'</span></span></div></div></div>';
          }
          if(step>=B5b.log){
            h+='<div class="msg op gate"><div class="bub gatebub"><div style="flex:1"><div class="who"'+an(B5b.log,step,"fade",150)+'>'+esc(G.who)+' <em>· '+esc(G.tag)+'</em></div><div class="txt"'+an(B5b.log,step,"rise",250)+'>'+esc(G.msg)+'</div></div>'+
               '<span class="seal"'+an(B5b.log,step,"pop",1500)+'>'+ICO.snow+esc(G.seal)+'</span></div><div class="av"'+an(B5b.log,step,"pop",100)+'>'+ICO.person+'</div></div>';
            h+='<div class="logrow"'+an(B5b.log,step,"fade",900)+'><span class="ll"><i></i>'+esc(G.log.label)+' · '+esc(G.log.file)+'</span><code><span class="'+(step===B5b.log&&!reduce?'ty':'')+'" style="--d:1100ms">'+esc(G.log.entry)+'</span></code></div>';
          }
          if(step>=B5b.res){
            h+='<div class="msg ai"><div class="av"'+an(B5b.res,step,"pop",100)+'>'+ICO.spark+'</div><div class="bub"><div class="who"'+an(B5b.res,step,"fade",200)+'>Agent <em>· results</em></div><div class="txt"'+an(B5b.res,step,"rise",350)+'>The draft was compared with the developer\'s implementation of the same mandate.</div>'+
               '<div class="ccard" data-ill="s5-results"><span class="zl">Click to illustrate</span><div class="crow"'+an(B5b.res,step,"rise",700)+'><b>Overall · as run</b><span>87 % · one area at 50 % · settlement routing</span><i class="gap">87</i></div><div class="crow"'+an(B5b.res,step,"rise",1100)+'><b>After the correction</b><span>99 % · same draft, settlement-route answer corrected</span><i class="verify">99</i></div></div></div></div>';
          }
          chat5.innerHTML=h+'</div>';
          var log=$(".log",chat5),toEnd=function(){log.scrollTo({top:log.scrollHeight,behavior:reduce?"auto":"smooth"})};
          if(step>=1)l5(toEnd,reduce?0:400,g);
          if(step===B5b.log&&!reduce){var p=$(".pill",chat5),o=$(".opt",chat5);p.classList.remove("ok");p.classList.add("wait");$(".pt",p).textContent=G.ask.pill;o.classList.remove("chosen");
            l5(function(){o.classList.add("chosen")},300,g);l5(function(){p.classList.remove("wait");p.classList.add("ok");$(".pt",p).textContent=G.pillOk},1200,g)}
          if(AUTO5[step]){var r=ILL[AUTO5[step]]();l5(function(){ZOOM.auto(r)},step===B5b.res?1800:dir===0?700:150,g)} else ZOOM.hideAuto();
          /* side: design groups panel · fills at step 1 (beat 2) · reviewed at G4 */
          var M=S5.sum,F=S5.file,DG=B5.design.groups;
          side5.innerHTML='<div class="n"'+an(0,step,"fade",300)+'>'+esc(M.n)+'</div><h3'+an(0,step,"focus",500)+'>'+esc(M.title)+'</h3>'+
            '<div class="dgs"'+an(0,step,"rise",900)+'><div class="fh"><b>'+esc(F.name)+'</b><span class="st'+(step>=B5b.log?' fz':'')+'">'+esc(step>=B5b.log?F.frozen:F.tag)+'</span></div>'+
            (step>=2?DG.map(function(g,i){var c=g.cands.filter(function(x){return x.pick})[0];return '<div class="dg"'+an(2,step,"fade",1200+i*500)+'><div class="k">'+esc(g.g)+' · '+esc(g.t)+' · '+esc(c.id)+'</div><b>'+esc(c.t)+'</b><div class="fl2">'+g.files.split(" · ").map(function(f){return '<span'+(step>=4?' class="ok"':'')+'>'+esc(f)+(step>=4?' · diff':'')+'</span>'}).join("")+'</div></div>'}).join("")+
              '<div class="ft">'+(step>=4?'4 edited copies · diffs · validation cases':'files to change')+(step>=B5b.log?' · '+esc(F.not):'')+'</div>':'<div class="ft">waiting for the design …</div>')+'</div>'+
            '<div class="facts">'+(step>=B5b.log?M.facts.map(function(f,i){return '<div class="fact"'+an(B5b.log,step,"pop",2000+i*160)+'><b>'+f.k+'</b><span>'+f.v+'</span></div>'}).join(""):'')+'</div>'+
            (step>=B5b.log?'<div'+an(B5b.log,step,"fade",2600)+'><a data-link="'+S5.link.id+'">'+esc(S5.link.label)+'</a></div>':'')+
            '<div class="note">'+esc(S5.note)+'</div>';
          if(step===B5b.log&&!reduce){var st=$(".dgs .st",side5);st.classList.remove("fz");st.textContent=F.tag;l5(function(){st.classList.add("fz");st.textContent=F.frozen},1500,g)}
          wireLinks();
        }

      }
    }
  })();

  /* ── scene navigation (scenes may declare data-steps="n" for in-scene beats) ── */
  var scenes=$$(".scene"),cur=-1,step=0,busy=false,gen=0;
  var rail=$("#rail"),nextB=$("#next"),prevB=$("#prev");
  scenes.forEach(function(_,i){var s=document.createElement("i");s.onclick=function(){go(i)};rail.appendChild(s)});
  function steps(s){return +(s.dataset.steps||1)}

  function chrome(){
    $$("i",rail).forEach(function(d,i){d.className=i===cur?"cur":i<cur?"done":""});
    $("#whereN").textContent=("0"+(cur+1)).slice(-2)+" / "+("0"+scenes.length).slice(-2); $("#pgN").textContent=(cur+1)+"/"+scenes.length;
    var n=steps(scenes[cur]);
    $("#whereL").textContent=(scenes[cur].dataset.label||"")+(n>1?"  ·  "+(step+1)+"/"+n:"");
    prevB.disabled=cur===0&&step===0;
    var last=cur===scenes.length-1&&step===n-1;
    nextB.innerHTML=(last?"Start over":"Next")+' <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
  }
  function go(i,opts){
    opts=opts||{}; if(busy)return; i=(i+scenes.length)%scenes.length; if(i===cur&&!opts.force)return; busy=true; if(window.ZOOM)ZOOM.hideAuto();
    var old=cur>=0&&cur!==i?scenes[cur]:null; cur=i; step=opts.step!=null?Math.max(0,Math.min(opts.step,steps(scenes[cur])-1)):opts.last?steps(scenes[cur])-1:0; chrome();
    var show=function(){if(old)old.classList.remove("on","out");play(scenes[cur],0);busy=false};
    if(old){old.classList.add("out");setTimeout(show,reduce?0:400)}else show();
  }
  var circuit=$("#circuit"),AMB=CONTENT.ambient||{cover:1,pages:.4,levels:[.4,.15,.7,1]},ambOverride=null;
  function ambient(s){var v=ambOverride!=null?ambOverride:(s.dataset.ambient!=null?+s.dataset.ambient:(s.classList.contains("cover")?AMB.cover:AMB.pages));circuit.style.opacity=v;circuit.classList.toggle("calm",s.dataset.calm!=null)}
  function play(s,dir){
    gen++; s.classList.remove("on"); void s.offsetWidth; s.classList.add("on"); ambient(s);
    var h=HOOKS[s.dataset.section]; if(h)h(s,gen,step,dir||0);
  }
  function advance(){var n=steps(scenes[cur]); if(step<n-1){step++;chrome();beat(1)}else go(cur+1)}
  function retreat(){if(step>0){step--;chrome();beat(-1)}else go(cur-1,{last:true})}
  function beat(dir){var s=scenes[cur];gen++;var h=HOOKS[s.dataset.section];if(h)h(s,gen,step,dir)}
  nextB.onclick=advance; prevB.onclick=retreat; $("#replay").onclick=function(){play(scenes[cur])};
  $("#pgNext").onclick=function(){go(cur+1)}; $("#pgPrev").onclick=function(){go(cur-1)};   /* whole-page jumps, beats skipped */
  addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"||e.key==="Enter"){e.preventDefault();advance()}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();retreat()}
    else if(e.key==="r"||e.key==="R"){play(scenes[cur])}
    else if(e.key==="Home"){go(0)} else if(e.key==="End"){go(scenes.length-1)}
    else if(e.key==="]"){go(cur+1)} else if(e.key==="["){go(cur-1)}
    else if(e.key==="b"||e.key==="B"){var L=AMB.levels,cur0=+circuit.style.opacity||1,i=(L.indexOf(cur0)+1)%L.length;ambOverride=L[i];circuit.style.opacity=L[i];toast("Background lines · "+Math.round(L[i]*100)+"%")}
  });
  window.deck={go:go,next:advance,back:retreat,replay:function(){play(scenes[cur])},hooks:HOOKS,toast:toast};
  var Q=new URLSearchParams(location.search); go(+(Q.get("s")||0),{step:+(Q.get("b")||0)});   /* ?s=page&b=beat deep link */
})();
