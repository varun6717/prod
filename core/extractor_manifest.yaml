# core/extractor_manifest.yaml — the per-LANGUAGE extractor freeze (D-A22; was §5.2's
# `extractors[]` inside the retired onboarding_manifest.yaml).
#
# One entry per language: WHICH deterministic extractor is frozen, under what tooling,
# and its coverage floor. One C extractor serves every C repo — per-REPO reading rules
# live in `code_profiles/<repo>.profile.yaml` (TASK-113), and per-build cache state lives
# in `cache/code_maps/index.yaml` (mutable, outside this frozen registry — D-A22).
#
# Freeze discipline (unchanged from TASK-012): the model may propose/validate an
# extractor; a HUMAN freezes it by committing this manifest. `extractor_sha` is the git
# blob hash of the frozen file — `validate_onboarding.py` asserts the recorded sha still
# matches the live file, so a post-freeze edit cannot pass silently. Amendments are
# build-time re-freezes (sha bump + commit), never runtime edits.
#
# Retired with the split (ADR-008): `adequacy_threshold` + `vocab_sha` (tag-chain
# artifacts — nothing tags, so nothing can be untagged, D-A22); `repos[]` build records
# (mutable state, moved to the cache); `built_with_vocab_sha`.

schema_version: 2

extractors:
  - language: c
    extractor: core/extractors/c_extractor.py
    extractor_sha: 125a6ca                 # git blob hash of the frozen extractor (TASK-012 freeze;
                                           #   bumped at TASK-112 when declared-purpose extraction lands)
    tools_required: [tree-sitter==0.25.2, tree-sitter-c==0.24.2]   # pip deps, imported in-venv (ADR-001)
    file_globs: ["*.c", "*.h"]
    coverage_floor: 0.80                    # below this on a repo build → REONBOARD_FLAG (FR-DC-16, §5.4)
    frozen_at: 2026-06-20T00:00:00Z
    frozen_by: vmunjal
