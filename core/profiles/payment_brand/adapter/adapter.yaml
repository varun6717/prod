# adapter.yaml — the payment_brand pre-processing adapter pack manifest (§6.6.3, as
# amended by ADR-008).
#
# This is the swappable DOMAIN SEAM for pre-processing: the generic `source_processor`
# reads this file to know the run order + routing; it carries no domain knowledge itself.
# A new domain = "write one more pack"; the core never changes (FR-XS-01).
#
# ── What ADR-008 removed, and why this file is now nearly empty ────────────────────────
# The tag vocabulary is deleted (D-A19/D-A22), and with it everything this file used to
# carry: the per-skill tag-emission map, the §10.5 drift check that map
# existed to satisfy (including the F1+3 reconciliation), and both tagging skills
# (`article_summarize`, `confluence_tag`). Doc pre-processing is now DOMAIN-AGNOSTIC —
# extract the structure, then index it (D-A18) — so the pack's remaining domain content is
# not here at all: it is the SI section profile (`must_capture` / `probe_if_missing` per
# section) and `jira_template`. Whether `adapter.yaml` stays per-domain is an open
# consolidation call (D-A18 note); it survives this slice as the run-order/routing
# declaration `source_processor` reads.
#
# Routing here is by source TYPE (which connector) and source CLASS (which lane) — NEVER
# by `domain` (D7). What an artifact is FOR is not decided in this file at all: that is the
# operator's per-source `disposition` (D-A12), carried onto the manifest entry and consumed
# by the D-A13 routing matrix at authoring time. Ingestion only carries it.

domain: payment_brand                # PBI — Payment Brand

docs_pipeline:                       # ORDERED; runs per non-code (document) source.
                                     # Bare-list form == the `default` lane. The per-type
                                     # MAPPING form (one key per source `type` + a required
                                     # `default`, TASK-063B) still stands in §6.6.3 and
                                     # `source_processor` still selects on it — this pack
                                     # simply has one lane now that the tag lanes are gone.
                                     # When the pack gains `confluence_extract` /
                                     # `jira_extract` (§6.6.3) they become type keys here.
  - { skill: pdf_extract }           # structural extraction → the .md extract + the manifest
                                     # entry stub. The per-artifact index step (`doc_index`,
                                     # D-A18) joins this lane at TASK-106.

code_pipeline:                       # code sources route to the SHARED core skill (D7); it is
                                     # referenced, not copied into the pack — code processing
                                     # never varies by domain.
  - { skill: code_map_build }
