# Frozen signal profile — how THIS repo is read (D-A21 step 6, D-A22).
#
# Written by core/scripts/validate_onboarding.py at the onboarding gate. `profile_sha` is
# half the map cache key `(commit_sha, profile_sha)`: a profile change invalidates every
# cached map WHOLESALE (gate branch 4), because if the derivation rules moved then every
# module boundary can have moved with them. A commit change invalidates selectively.
#
# `overrides.singleton_groups` are model-PROPOSED and human-APPROVED, frozen here as data.
# Nothing model-driven survives the freeze in an active form — the three gate actions are
# pre-freeze only, which is the determinism guarantee.
derivation:
  priority:
  - include_graph_cohesion
  - declared_purpose_similarity
  - prefix_family
  hub_threshold_fan_in: 3
  cluster_min_size: 2
  cluster_max_size: 40
purpose:
  label_aliases:
  - PURPOSE
  - Purpose
  - Intention
  - DESCRIPTION
  - Description
  - SYNOPSIS
  - Descr
  - Desc
  fuzzy_edit_distance: 1
  warn_if_human_authored_below: 0.7
  low_confidence_threshold: 0.5
stages:
  skip_stage_c: true
overrides:
  singleton_groups:
  - name: brand_group
    members:
    - src/config/brand_rules.c
    - src/routing/brand_registry.c
    rationale: 'shared prefix token ''brand''; purposes: brand rule table load and
      cache | registry of known card brands and thei'
tier1_entry_target: 12
