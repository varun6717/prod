# registry_manifest.yaml — the publishable registry subset (repo #1; §2.1, §6.6.1, FR-XS-10)
#
# Shrunk to whole trees per ADR-008 D-A22: the previous hand-listed docs enumeration was a
# maintenance trap (add an ADR, forget the manifest, it silently never ships). Everything
# under the three trees publishes; `exclude` strips non-determinism. Control docs at the
# repo root (CLAUDE.md, TASK_LIST.md, VDI_WIRING.md), fixtures/, runs/, app/, notes/ and
# cache/ are outside the trees and never publish. `publish_registry.py` stages this subset,
# gates on `build_checks.py`, and pushes; `hydrate.py` pulls from the published tree at a
# pinned `registry_sha`.
schema_version: 2

include:
  trees: [core/, overlays/, docs/]

# Never published, even when nested under an included tree — non-determinism, caches, VCS.
exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.git/**"
  - "**/.DS_Store"
