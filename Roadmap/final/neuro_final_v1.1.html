<style>
:root{
  --bg:#04060c; --bg2:#070b14; --surface:#0b0f1d; --surface2:#0e1426;

  --body:"Segoe UI","Avenir Next","Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--body);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:1920px;height:1080px;overflow:hidden;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1200px 700px at 78% 18%,rgba(70,130,255,.07),transparent 60%),
    radial-gradient(900px 600px at 8% 95%,rgba(0,229,255,.09),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 78%)}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(70px) scale(.985);
  transition:opacity .55s ease,transform .7s var(--ease),visibility 0s linear .6s}
.slide.before{transform:translateX(-70px) scale(.985)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease .1s,transform .75s var(--ease) .1s,visibility 0s}
.eyebrow{font-family:var(--head);font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan)}

/* ---------- cover ---------- */
#net{position:absolute;inset:0;width:1920px;height:1080px}
.cover-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,12,.95) 0%,rgba(4,6,12,.74) 33%,rgba(4,6,12,0) 62%)}

  background:linear-gradient(100deg,#fff 20%,#dee8ff 70%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover-rule{width:120px;height:2px;margin:44px 0 34px;background:linear-gradient(90deg,var(--cyan),transparent);box-shadow:0 0 18px var(--cyan)}
#cv-team{font-family:var(--head);font-size:30px;color:var(--text);letter-spacing:.02em}
#cv-date{font-size:22px;color:var(--muted);margin-top:14px;letter-spacing:.2em;text-transform:uppercase}
.slide.active .cover-text>*{animation:rise .9s var(--ease) both}
.slide.active .cover-text>*:nth-child(2){animation-delay:.25s}
.slide.active .cover-text>*:nth-child(3){animation-delay:.4s}
.slide.active .cover-text>*:nth-child(4){animation-delay:.52s}

/* ---------- roadmap ---------- */
.rd-head{position:absolute;left:56px;right:56px;top:30px;height:92px;display:flex;justify-content:space-between;align-items:flex-end}

.lane{display:grid;grid-template-columns:262px repeat(3,1fr);gap:14px;height:152px;margin-bottom:10px}

.lane-label{position:relative;padding:16px 16px 14px 22px;border-left:2px solid var(--cyan);

.lane-label i{font-style:normal;font-family:var(--head);font-size:13px;letter-spacing:.3em;color:var(--cyan);opacity:.8}

.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc);box-shadow:0 0 16px var(--bc)}

.card:hover{border-color:var(--bc);box-shadow:0 0 0 1px rgba(70,130,255,.08),0 12px 40px rgba(0,0,0,.5),0 0 34px rgba(70,130,255,.12)}
.card h3{font-family:var(--body);font-weight:500;font-size:19.5px;line-height:1.32;color:var(--text)}
.card .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.card .meta em{font-style:normal;padding:2px 8px;border:1px solid var(--line2);border-radius:9px;color:#b9c9e6;font-size:12px}
.dep{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;
  color:var(--cyan);background:rgba(4,6,12,.6);transition:all .25s}
.dep:hover,.dep-src .dep{border-color:var(--cyan);background:rgba(70,130,255,.16);box-shadow:0 0 18px rgba(70,130,255,.45)}

.empty{flex:1;border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;font-size:14px;color:var(--dim);letter-spacing:.04em}
.chips{flex:1;display:flex;gap:10px;min-width:0}
.chip{position:relative;flex:1;min-width:0;border:1px solid var(--line2);border-radius:14px;padding:14px 10px 12px 14px;text-align:left;
  background:linear-gradient(160deg,rgba(70,130,255,.10),rgba(0,229,255,.05));display:flex;flex-direction:column;justify-content:space-between}
.chip:hover{border-color:var(--cyan);box-shadow:0 0 30px rgba(70,130,255,.2)}
.chip b{font-family:var(--head);font-weight:400;font-size:16px;letter-spacing:0;white-space:nowrap}
.chip .cv{font-family:var(--head);font-size:24px;color:var(--cyan);line-height:1;white-space:nowrap}
.chip small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip small svg{width:13px;height:13px;color:var(--cyan)}
.chip .dep{width:26px;height:26px;right:8px;top:auto;bottom:8px}.chip .dep svg{width:13px;height:13px}
/* dependency mode */
.grid.dep-mode .lane.revealed .node:not(.dep-src):not(.dep-tgt),.grid.dep-mode .lane.revealed .empty{opacity:.2}
.node.dep-tgt,.node.dep-src{border-color:var(--cyan)!important;box-shadow:0 0 0 1px rgba(70,130,255,.35),0 0 40px rgba(70,130,255,.28)!important}

#links.on circle{opacity:1} #links.on circle.halo{opacity:.25}
.dep-notes{position:absolute;left:56px;bottom:18px;max-width:1400px;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .35s;pointer-events:none}

/* ---------- panel ---------- */
#scrim{position:absolute;inset:0;background:rgba(3,4,8,.62);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;z-index:20}

.tag.b-now{color:var(--cyan);border-color:rgba(70,130,255,.5)} .tag.b-next{color:#78f0ff;border-color:rgba(0,229,255,.6)} .tag.b-later{color:#a9b5d2}

.item{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:rgba(255,255,255,.015);overflow:hidden;transition:border-color .3s}

.m-head{position:absolute;left:72px;right:72px;top:38px;display:flex;justify-content:space-between;align-items:flex-end}
.m-head h2{font-family:var(--head);font-weight:400;font-size:54px;margin-top:10px;letter-spacing:-.01em}
.m-right{display:flex;align-items:center;gap:26px;padding-bottom:10px}
.m-wave{font-size:14px;color:var(--muted);letter-spacing:.06em} .m-wave b{color:var(--cyan);font-weight:500;margin-left:6px}
.m-prog{display:flex;align-items:center;gap:14px;font-family:var(--head);font-size:20px;color:var(--text)}
.m-dots{display:flex;gap:7px} .m-dots i{width:26px;height:3px;border-radius:2px;background:var(--line2);transition:all .4s}
.m-dots i.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
#m-body{position:absolute;left:72px;right:72px;top:176px;bottom:96px}
.hero{position:relative;height:500px;border:1px solid var(--line2);border-radius:22px;padding:38px 46px;display:grid;grid-template-columns:1.12fr .88fr;gap:54px;
  background:radial-gradient(700px 380px at 12% 0%,rgba(70,130,255,.11),transparent 70%),linear-gradient(160deg,rgba(17,24,47,.95),rgba(9,12,24,.95));
  box-shadow:0 30px 90px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);animation:heroIn .8s var(--ease) both;overflow:hidden}
.hero::after{content:"";position:absolute;left:46px;right:46px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.7}
#m-body.solo .hero{height:640px;margin-top:50px}
@keyframes heroIn{from{opacity:0;transform:translateY(34px) scale(.975)}to{opacity:1;transform:none}}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;padding:4px 10px;border-radius:10px;border:1px solid rgba(255,184,92,.45);color:var(--warn)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.actual{border-color:rgba(63,220,154,.5);color:var(--good)}
.h-left{display:flex;flex-direction:column;min-width:0}
.h-name{font-family:var(--head);font-weight:400;font-size:30px;margin-top:14px}
.h-q{font-size:22px;line-height:1.38;color:var(--cyan);margin-top:8px;max-width:820px}
.h-val{display:flex;align-items:flex-end;gap:26px;margin-top:auto;padding-top:10px}
.h-val b{font-family:var(--head);font-weight:400;font-size:128px;line-height:.95;letter-spacing:-.03em;
  background:linear-gradient(180deg,#fff,#dee8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-val .side{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.h-val .note{font-size:17px;color:var(--muted)}
.trend{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:500;padding:6px 14px;border-radius:16px;width:fit-content}
.trend svg{width:14px;height:14px}
.trend.good{color:var(--good);background:rgba(63,220,154,.1)} .trend.bad{color:#ff7a8a;background:rgba(255,122,138,.1)} .trend.none{color:var(--muted);background:rgba(255,255,255,.05)}
.gauge{position:relative;height:56px;margin-top:26px}
.g-track{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.07)}
.g-fill{position:absolute;left:0;top:26px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 16px rgba(70,130,255,.6);width:0;transition:width 1.1s var(--ease) .5s}
.g-mark{position:absolute;top:18px;width:2px;height:22px;transform:translateX(-1px)}
.g-mark span{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.g-mark.base{background:var(--slate)} .g-mark.base span{top:26px;color:var(--slate)}
.g-mark.tgt{background:var(--good)} .g-mark.tgt span{top:-19px;color:var(--good)}
.h-right{display:flex;flex-direction:column;gap:20px;border-left:1px solid var(--line);padding-left:46px;min-width:0}
.h-ctx{font-size:19.5px;line-height:1.55;color:#dbe6f8}
.h-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:auto}
.h-stats div.wide{grid-column:1/-1}
.h-stats h5{font-family:var(--head);font-weight:400;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.h-stats p{font-size:15.5px;line-height:1.42;color:#cfdbf0}
.tiles{display:flex;justify-content:center;gap:22px;margin-top:24px;height:236px}
.tile{position:relative;flex:1;max-width:880px;text-align:left;border:1px solid var(--line);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(14,20,38,.9),rgba(8,12,22,.9));animation:tileIn .65s var(--ease) both;animation-delay:calc(.6s + var(--i)*.14s);
  transition:border-color .3s,box-shadow .3s,transform .3s}
.tile:hover{border-color:var(--cyan);box-shadow:0 0 34px rgba(70,130,255,.16);transform:translateY(-3px)}
@keyframes tileIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.tile .t-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tile .t-name{font-family:var(--head);font-size:19px}
.tile .t-q{font-size:15.5px;line-height:1.42;color:var(--cyan);margin-top:8px;opacity:.92}
.tile .t-bot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto}
.tile .t-val{font-family:var(--head);font-size:50px;line-height:1;color:#fff}
.tile .trend{font-size:15px;padding:4px 11px}
.m-foot{position:absolute;left:72px;bottom:30px;max-width:1300px;font-size:14px;color:var(--dim);display:flex;gap:18px;align-items:center}
.m-foot .swap{color:var(--muted)}

.still *,.still *::before,.still *::after{transition:none!important;animation-duration:.001s!important;animation-delay:0s!important}

/* ---------- illustrative data markers ---------- */
.hero .badge{font-size:14px;letter-spacing:.2em;font-weight:600;padding:8px 16px;border-radius:14px;border-width:1.5px;background:rgba(255,184,92,.14)}
.tile .badge{font-size:12.5px;font-weight:600;padding:5px 11px;background:rgba(255,184,92,.12)}
.hero .badge.actual,.tile .badge.actual{background:rgba(63,220,154,.12)}
.hero[data-wm],.tile[data-wm],.chip.illus{border-style:dashed}
.tile{overflow:hidden}
.hero[data-wm]::before,.tile[data-wm]::before{content:attr(data-wm);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-13deg);font-family:var(--head);
  font-size:200px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:rgba(255,184,92,.06);pointer-events:none}
.tile[data-wm]::before{font-size:74px;color:rgba(255,184,92,.07)}
.m-foot .illus{color:var(--warn);font-size:15.5px;font-weight:600;padding:8px 16px;border:1.5px dashed rgba(255,184,92,.55);border-radius:10px;background:rgba(255,184,92,.08)}
.m-foot .real{color:var(--good);font-size:15.5px;font-weight:600;padding:8px 16px;border:1.5px solid rgba(63,220,154,.5);border-radius:10px;background:rgba(63,220,154,.08)}
.m-foot{bottom:22px}
.ctag{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--warn);white-space:nowrap}
.ctag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.ctag.actual{color:var(--good)}
.lane-note{font-style:normal;margin-top:7px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}

/* ---------- nav ---------- */
#nav{position:absolute;right:56px;bottom:22px;display:flex;align-items:center;gap:14px;z-index:10}
#nav-pos{font-family:var(--head);font-size:14px;letter-spacing:.14em;color:var(--muted);min-width:110px;text-align:right;margin-right:6px}
.nav-btn{height:46px;padding:0 22px;border-radius:23px;border:1px solid var(--line2);font-size:15.5px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;
  background:rgba(9,12,24,.7);transition:all .25s}
.nav-btn svg{width:14px;height:14px}
.nav-btn:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(70,130,255,.28)}
.nav-btn.primary{background:linear-gradient(90deg,rgba(0,229,255,.35),rgba(70,130,255,.28));border-color:rgba(70,130,255,.6)}
.nav-btn[hidden]{display:none}

/* ===== theme: neon ===== */

:root{--head:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Arial Narrow","Segoe UI",sans-serif;--text:#f7f9ff;--muted:#a3acc4}
#stage{background:radial-gradient(1100px 600px at 50% 110%,rgba(70,130,255,.22),transparent 65%),radial-gradient(900px 500px at 85% -10%,rgba(0,229,255,.16),transparent 60%),#02040a}
#stage::before{opacity:.9}
.rd-head h2,.m-head h2,.col-h b,.lane-label b,.h-name,.tile .t-name,.chip b{text-transform:uppercase;letter-spacing:.05em}
.rd-head h2{font-size:40px;text-shadow:0 0 12px rgba(70,130,255,.55)}
.m-head h2{text-shadow:0 0 12px rgba(70,130,255,.55)}
.lane-label b{font-size:19px}
.card{background:rgba(70,130,255,.045)!important;border:1.5px solid rgba(70,130,255,.6);box-shadow:0 0 9px rgba(70,130,255,.28),inset 0 0 12px rgba(70,130,255,.07);border-radius:6px}
.card[data-b=next]{background:rgba(0,229,255,.04)!important;border-color:rgba(0,229,255,.6);box-shadow:0 0 9px rgba(0,229,255,.26),inset 0 0 12px rgba(0,229,255,.07)}
.card[data-b=later]{background:rgba(255,255,255,.02)!important;border-color:rgba(190,170,220,.45);box-shadow:none}
.card::before{display:none}
.chip,.hero,.tile{background:rgba(0,229,255,.04);border:1.5px solid rgba(0,229,255,.55);box-shadow:0 0 10px rgba(0,229,255,.22),inset 0 0 14px rgba(0,229,255,.06);border-radius:6px}
.chip b{font-size:14px}
.chip .cv,.h-q,.tile .t-q{color:#00e5ff}
.lane-label{border-left:3px solid #4682ff;background:linear-gradient(90deg,rgba(70,130,255,.16),transparent)}
.empty,.item,.p-dep,.tag,.badge,.item-id{border-radius:4px}
.h-val b{background:linear-gradient(180deg,#fff,#96b9ff);-webkit-background-clip:text;background-clip:text;}
.cover-text h1{text-transform:uppercase;font-size:80px;background:linear-gradient(100deg,#fff 10%,#96b9ff 55%,#00e5ff);-webkit-background-clip:text;background-clip:text;}
.nav-btn.primary{background:linear-gradient(90deg,rgba(70,130,255,.55),rgba(0,229,255,.45));border-color:#4682ff}

</style>
</head>

<body>
<div id="viewport"><div id="stage">

  <section class="slide" id="s-cover">
    <canvas id="net" width="1920" height="1080"></canvas>
    <div class="cover-veil"></div>
    <div class="cover-text"><h1 id="cv-title"></h1><div class="cover-rule"></div><p id="cv-team"></p><p id="cv-date"></p></div>
  </section>

  <section class="slide" id="s-road">
    <header class="rd-head">
      <div><p class="eyebrow" id="rd-eyebrow"></p><h2 id="rd-title"></h2></div>
      <div class="rd-tools"><p class="rd-hint" id="rd-hint"></p><button class="pill-btn" id="btn-all"></button></div>
    </header>
    <div class="grid" id="grid"></div>
    <svg id="links" viewBox="0 0 1920 1080"></svg>
    <p class="footnote" id="rd-note"></p>
    <div class="dep-notes" id="dep-notes"></div>
  </section>

  <section class="slide" id="s-met">
    <header class="m-head">
      <div><p class="eyebrow" id="m-eyebrow"></p><h2 id="m-title"></h2></div>
      <div class="m-right"><span class="m-wave" id="m-wave"></span><div class="m-prog"><span id="m-count"></span><div class="m-dots" id="m-dots"></div></div><button class="pill-btn" id="btn-road"></button></div>
    </header>
    <div id="m-body"></div>
    <div class="m-foot" id="m-foot"></div>
  </section>

  <div id="scrim"></div>
  <aside id="panel"></aside>

  <nav id="nav"><span id="nav-pos"></span><button class="nav-btn" id="btn-back"></button><button class="nav-btn primary" id="btn-next"></button></nav>
</div></div>

<script>
(function(){
"use strict";
var D=DECK,U=D.ui;
var $=function(s){return document.querySelector(s)};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fmt(t,o){return t.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}
var ICON={
  link:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.7 9.3a3 3 0 0 0 4.2 0l2.2-2.2a3 3 0 0 0-4.2-4.2l-.8.8"/><path d="M9.3 6.7a3 3 0 0 0-4.2 0L2.9 8.9a3 3 0 0 0 4.2 4.2l.8-.8"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg>',
  right:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>',
  left:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>',
  up:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3l6 9H2z"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 13L2 4h12z"/></svg>'
};
function icon(name){var s=el("span");s.style.display="contents";s.innerHTML=ICON[name];return s.firstChild}

/* ---------- lookups ---------- */
var OUT={},CAT={},NODE={},BIDX={};
D.buckets.forEach(function(b,i){BIDX[b.id]=i});
D.outcomes.forEach(function(o){OUT[o.id]=o});
D.metricCategories.forEach(function(c,i){c.index=i;CAT[c.id]=c});
var S={slide:0,revealed:1,cat:0,jumped:false,hero:{},panel:null,dep:null,panelAt:0};
var slides=[$("#s-cover"),$("#s-road"),$("#s-met")];
var LANES=D.lanes.length;

/* ---------- stage scaling ---------- */
var stage=$("#stage");
function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.zoom=k;if(net)net.size(k);if(S.dep){var d=S.dep;clearDeps();showDeps(d)}}
addEventListener("resize",fit);fit();

/* ---------- static text ---------- */
document.title=U.docTitle;
$("#cv-title").textContent=D.cover.title;$("#cv-team").textContent=D.cover.team;$("#cv-date").textContent=D.cover.date;
$("#rd-eyebrow").textContent=U.roadmapEyebrow;$("#rd-title").textContent=U.roadmapTitle;$("#rd-hint").textContent=U.roadmapHint;
$("#rd-note").textContent=U.roadmapNote;$("#btn-all").textContent=U.showAll;
$("#m-eyebrow").textContent=U.metricsEyebrow;$("#btn-road").textContent=U.backToRoadmap;
(function(){var b=$("#btn-back"),n=$("#btn-next");b.appendChild(icon("left"));b.appendChild(el("span",null,U.back));n.appendChild(el("span",null,U.next));n.appendChild(icon("right"))})();

/* ---------- roadmap grid ---------- */
function heroOf(c){var id=S.hero[c.id]||c.heroMetricId;return c.metrics.filter(function(m){return m.id===id})[0]||c.metrics[0]}
function depButton(id){var b=el("span","dep");b.setAttribute("role","button");b.title=U.depHint;b.appendChild(icon("link"));
  b.addEventListener("click",function(e){e.stopPropagation();showDeps(id)});return b}
function buildGrid(){
  var g=$("#grid"),cols=el("div","cols");cols.appendChild(el("div"));
  D.buckets.forEach(function(b){var h=el("div","col-h");h.dataset.b=b.id;h.appendChild(el("b",null,b.name));h.appendChild(el("span",null,b.caption));cols.appendChild(h)});
  g.appendChild(cols);
  D.lanes.forEach(function(l,li){
    var lane=el("div","lane");lane.dataset.lane=l.id;
    var lab=el("div","lane-label");lab.appendChild(el("i",null,String(li+1).padStart(2,"0")));lab.appendChild(el("b",null,l.name));lab.appendChild(el("span",null,l.caption));if(l.note)lab.appendChild(el("em","lane-note",l.note));lane.appendChild(lab);
    D.buckets.forEach(function(b){
      var cell=el("div","cell"),ids=l.cells[b.id]||[];
      if(!ids.length){cell.appendChild(el("div","empty",U.emptyCell))}
      else if(l.metrics){var wrap=el("div","chips");ids.forEach(function(cid){wrap.appendChild(chip(CAT[cid],li,BIDX[b.id]))});cell.appendChild(wrap)}
      else ids.forEach(function(oid){cell.appendChild(card(OUT[oid],li,BIDX[b.id]))});
      lane.appendChild(cell)});
    g.appendChild(lane)});
}
function card(o,li,bi){
  var c=el("div","node card");c.dataset.b=o.bucket;c.setAttribute("role","button");c.tabIndex=0;
  c.appendChild(el("h3",null,o.title));
  var m=el("div","meta"),seen={};
  o.backlogItems.forEach(function(it){if(!seen[it.ref]){seen[it.ref]=1;m.appendChild(el("em",null,it.tag?it.ref+" · "+it.tag:it.ref))}});
  c.appendChild(m);
  if(o.dependsOn.length)c.appendChild(depButton(o.id));
  c.addEventListener("click",function(){openPanel(o.id)});
  c.addEventListener("keydown",function(e){if(e.key==="Enter"){e.stopPropagation();openPanel(o.id)}});
  NODE[o.id]={el:c,lane:li,col:bi,title:o.title,deps:o.dependsOn};return c}
function chip(c,li,bi){
  var b=el("div","node chip");b.setAttribute("role","button");b.tabIndex=0;
  var hm=heroOf(c),real=hm.data==="actual";if(!real)b.classList.add("illus");b.appendChild(el("b",null,c.name));b.appendChild(el("span","cv",hm.value));b.appendChild(el("span","ctag"+(real?" actual":""),real?U.actual:U.illustrative));
  var s=el("small");s.appendChild(el("span",null,c.metrics.length+" "+(c.metrics.length===1?U.metricWord:U.metricsWord)));s.appendChild(icon("right"));b.appendChild(s);
  if(c.dependsOn.length)b.appendChild(depButton(c.id));
  b.addEventListener("click",function(){clearDeps();S.cat=c.index;S.jumped=true;go(2)});
  NODE[c.id]={el:b,lane:li,col:bi,title:c.name,deps:c.dependsOn};return b}
function applyReveal(){
  document.querySelectorAll(".lane").forEach(function(l,i){l.classList.toggle("revealed",i<S.revealed)});
  $("#btn-all").disabled=S.revealed>=LANES}

/* ---------- dependency lines ---------- */
var road=$("#s-road"),links=$("#links");
function boxOf(e){var x=0,y=0,n=e,f=1920/road.offsetWidth;while(n&&n!==road){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}return{x:x*f,y:y*f,w:e.offsetWidth*f,h:e.offsetHeight*f}}
function clearDeps(){
  if(!S.dep)return;S.dep=null;links.innerHTML="";links.classList.remove("on");$("#grid").classList.remove("dep-mode");
  document.querySelectorAll(".dep-src,.dep-tgt,.ghost").forEach(function(n){n.classList.remove("dep-src","dep-tgt","ghost")});
  $("#dep-notes").classList.remove("on");$("#rd-note").classList.remove("off")}
function showDeps(id){
  if(S.dep===id){clearDeps();return}clearDeps();
  var src=NODE[id];if(!src||!src.deps.length)return;S.dep=id;
  $("#grid").classList.add("dep-mode");src.el.classList.add("dep-src");
  var notes=$("#dep-notes"),drawn=[],NS="http://www.w3.org/2000/svg";notes.innerHTML="";
  src.deps.forEach(function(d){
    var t=NODE[d.id];if(!t)return;t.el.classList.add("dep-tgt");
    if(t.lane>=S.revealed)t.el.classList.add("ghost");
    var a=boxOf(src.el),b=boxOf(t.el),x1,y1,x2,y2,p;
    if(src.col===t.col){var up=t.lane<src.lane;x1=a.x+a.w/2;x2=b.x+b.w/2;y1=up?a.y:a.y+a.h;y2=up?b.y+b.h:b.y;var m=(y2-y1)/2;
      p="M"+x1+","+y1+" C"+x1+","+(y1+m)+" "+x2+","+(y2-m)+" "+x2+","+y2}
    else{var left=t.col<src.col;x1=left?a.x:a.x+a.w;x2=left?b.x+b.w:b.x;y1=a.y+a.h/2;y2=b.y+b.h/2;var mx=(x2-x1)/2;
      p="M"+x1+","+y1+" C"+(x1+mx)+","+y1+" "+(x2-mx)+","+y2+" "+x2+","+y2}
    ["glow",""].forEach(function(cls){var path=document.createElementNS(NS,"path");path.setAttribute("d",p);if(cls)path.setAttribute("class",cls);links.appendChild(path);
      var len=Math.ceil(path.getTotalLength())+2;path.style.strokeDasharray=len;path.style.strokeDashoffset=len;drawn.push(path)});
    [["halo",11],["",5]].forEach(function(c){var dot=document.createElementNS(NS,"circle");dot.setAttribute("cx",x2);dot.setAttribute("cy",y2);dot.setAttribute("r",c[1]);if(c[0])dot.setAttribute("class",c[0]);links.appendChild(dot)});
    var n=el("p");n.appendChild(el("b",null,t.title+": "));n.appendChild(document.createTextNode(d.note||""));notes.appendChild(n)});
  links.getBoundingClientRect();drawn.forEach(function(q){q.style.strokeDashoffset=0});links.classList.add("on");
  notes.classList.add("on");$("#rd-note").classList.add("off")}
document.addEventListener("click",function(e){if(S.dep&&!e.target.closest(".dep"))clearDeps()});

/* ---------- outcome panel ---------- */
var panel=$("#panel"),scrim=$("#scrim");
function section(title){var s=el("div","p-sec");s.appendChild(el("h4",null,title));return s}
function openPanel(id){
  var o=OUT[id];if(!o)return;clearDeps();S.panel=id;S.panelAt=Date.now();panel.innerHTML="";
  var lane=D.lanes.filter(function(l){return l.id===o.lane})[0],bucket=D.buckets[BIDX[o.bucket]];
  var head=el("div","p-head"),tags=el("div","p-tags");
  tags.appendChild(el("span","tag b-"+o.bucket,bucket.name));tags.appendChild(el("span","tag",lane.name));
  head.appendChild(tags);head.appendChild(el("h2",null,o.title));
  var x=el("button","p-close");x.title=U.close;x.appendChild(icon("x"));x.addEventListener("click",closePanel);head.appendChild(x);panel.appendChild(head);
  var body=el("div","p-body"),s;
  s=section(U.panelSummary);s.appendChild(el("p",null,o.summary));body.appendChild(s);
  s=section(U.panelWhy);s.appendChild(el("p",null,o.justification));body.appendChild(s);
  s=section(U.panelDepends);
  if(!o.dependsOn.length)s.appendChild(el("p","p-none",U.panelNoDepends));
  else{var list=el("div","p-deps");o.dependsOn.forEach(function(d){var t=OUT[d.id];if(!t)return;
      var b=el("button","p-dep");b.appendChild(icon("link"));var w=el("div");w.appendChild(el("b",null,t.title));if(d.note)w.appendChild(el("span",null,d.note));b.appendChild(w);
      b.addEventListener("click",function(){openPanel(d.id)});list.appendChild(b)});s.appendChild(list)}
  body.appendChild(s);
  s=section(U.panelItems+" ("+o.backlogItems.length+")");
  o.backlogItems.forEach(function(ref,i){s.appendChild(itemRow(ref,i===0))});body.appendChild(s);
  panel.appendChild(body);panel.classList.add("on");scrim.classList.add("on")}
function itemRow(ref,open){
  var it=D.items[ref.ref],w=el("div","item"+(open?" open":""));
  var h=el("button","item-h");h.appendChild(el("span","item-id",ref.ref));if(ref.tag)h.firstChild.title=ref.tag;
  var t=el("div","item-t");t.appendChild(el("b",null,it.title));
  var sub=el("span");sub.appendChild(document.createTextNode(it.priority+"  ·  "+U.itemOwner+": "));sub.appendChild(el("i",null,it.owner));t.appendChild(sub);
  h.appendChild(t);h.appendChild(icon("chev"));h.addEventListener("click",function(){w.classList.toggle("open")});w.appendChild(h);
  var b=el("div","item-b"),clip=el("div"),inn=el("div","item-in");
  function blk(title,node){var d=el("div");d.appendChild(el("h5",null,title));d.appendChild(node);inn.appendChild(d);return d}
  if(ref.scope)blk(U.itemScope,el("p",null,ref.scope));
  blk(U.itemWhat,el("p",null,it.what));
  blk(U.itemAcceptance,el("p",null,it.acceptance)).lastChild.className="acc";
  if(it.needs.length){var ul=el("ul");it.needs.forEach(function(n){ul.appendChild(el("li",null,n))});blk(U.itemNeeds,ul)}
  else blk(U.itemNeeds,el("p",null,U.itemNoNeeds));
  blk(U.itemWave,el("p",null,it.wave));
  clip.appendChild(inn);b.appendChild(clip);w.appendChild(b);return w}
function closePanel(){S.panel=null;panel.classList.remove("on");scrim.classList.remove("on")}
scrim.addEventListener("click",function(){if(Date.now()-S.panelAt>450)closePanel()});

/* ---------- metrics ---------- */
function trendEl(m){
  var t=el("span","trend "+(m.trend?(m.trendGood?"good":"bad"):"none"));
  if(m.trend&&m.trendDir!=="flat")t.appendChild(icon(m.trendDir==="up"?"up":"down"));
  t.appendChild(el("span",null,m.trend||U.noTrend));return t}
function badge(m){return el("span","badge"+(m.data==="actual"?" actual":""),m.data==="actual"?U.actual:U.illustrative)}
function stat(title,text,wide){var d=el("div",wide?"wide":null);d.appendChild(el("h5",null,title));d.appendChild(el("p",null,text));return d}
function renderMetrics(){
  var c=D.metricCategories[S.cat],hero=heroOf(c),rest=c.metrics.filter(function(m){return m!==hero}),T=D.metricCategories.length;
  $("#m-title").textContent=c.name;
  var w=$("#m-wave");w.innerHTML="";w.appendChild(document.createTextNode(U.firstOnline));w.appendChild(el("b",null,D.buckets[BIDX[c.wave]].name));
  $("#m-count").textContent=fmt(U.catPos,{n:S.cat+1,t:T});
  var dots=$("#m-dots");dots.innerHTML="";for(var i=0;i<T;i++)dots.appendChild(el("i",i<=S.cat?"on":null));
  var body=$("#m-body");body.innerHTML="";body.classList.toggle("solo",!rest.length);
  var h=el("div","hero"),L=el("div","h-left"),R=el("div","h-right");if(hero.data!=="actual")h.dataset.wm=U.watermark;
  L.appendChild(el("div")).appendChild(badge(hero));
  L.appendChild(el("div","h-name",hero.name));L.appendChild(el("div","h-q",hero.whatThisTellsUs));
  var v=el("div","h-val");v.appendChild(el("b",null,hero.value));var side=el("div","side");side.appendChild(trendEl(hero));side.appendChild(el("span","note",hero.valueNote));v.appendChild(side);L.appendChild(v);
  var g=hero.gauge,gz=el("div","gauge");gz.appendChild(el("div","g-track"));var fill=el("div","g-fill");gz.appendChild(fill);
  function mark(val,cls,label){if(val==null)return;var k=el("div","g-mark "+cls);k.style.left=Math.max(0,Math.min(100,val/g.max*100))+"%";k.appendChild(el("span",null,label));gz.appendChild(k)}
  mark(g.baseline,"base",U.baseline);mark(g.target,"tgt",U.target);L.appendChild(gz);
  requestAnimationFrame(function(){requestAnimationFrame(function(){fill.style.width=Math.min(100,g.current/g.max*100)+"%"})});
  R.appendChild(el("p","h-ctx",hero.context));
  var st=el("div","h-stats");st.appendChild(stat(U.baseline,hero.baseline||U.noBaseline));st.appendChild(stat(U.target,hero.target));
  st.appendChild(stat(U.sample,hero.sample,true));st.appendChild(stat(U.definition,hero.definition,true));R.appendChild(st);
  h.appendChild(L);h.appendChild(R);body.appendChild(h);
  if(rest.length){var tiles=el("div","tiles");
    rest.forEach(function(m,i){var t=el("button","tile");t.style.setProperty("--i",i);if(m.data!=="actual")t.dataset.wm=U.watermark;
      var top=el("div","t-top");top.appendChild(el("span","t-name",m.name));top.appendChild(badge(m));t.appendChild(top);
      t.appendChild(el("div","t-q",m.whatThisTellsUs));
      var bot=el("div","t-bot");bot.appendChild(el("span","t-val",m.value));bot.appendChild(trendEl(m));t.appendChild(bot);
      t.addEventListener("click",function(){S.hero[c.id]=m.id;renderMetrics()});tiles.appendChild(t)});
    body.appendChild(tiles)}
  var f=$("#m-foot");f.innerHTML="";f.appendChild(el("span",hero.data==="actual"?"real":"illus",hero.data==="actual"?U.actualNote:U.illustrativeNote));
  if(rest.length)f.appendChild(el("span","swap",U.swapHint))}

/* ---------- navigation ---------- */
function go(i){
  var prev=S.slide;S.slide=i;
  slides.forEach(function(s,k){s.classList.toggle("active",k===i);s.classList.toggle("before",k<i)});
  if(i===2)renderMetrics();
  if(i===1&&prev!==1)applyReveal();
  net.run(i===0);updateNav()}
function updateNav(){
  $("#btn-back").hidden=S.slide===0;
  $("#btn-next").hidden=S.slide===2&&S.cat===D.metricCategories.length-1;
  var p="";if(S.slide===1)p=fmt(U.lanePos,{n:S.revealed,t:LANES});
  $("#nav-pos").textContent=p}
function next(){
  if(S.panel)return;clearDeps();
  if(S.slide===0)go(1);
  else if(S.slide===1){if(S.revealed<LANES){S.revealed++;applyReveal();updateNav()}else{S.cat=0;S.jumped=false;go(2)}}
  else if(S.cat<D.metricCategories.length-1){S.cat++;S.jumped=false;renderMetrics();updateNav()}}
function back(){
  if(S.panel)return;clearDeps();
  if(S.slide===2){if(S.jumped||S.cat===0){S.jumped=false;go(1)}else{S.cat--;renderMetrics();updateNav()}}
  else if(S.slide===1){if(S.revealed>1){S.revealed--;applyReveal();updateNav()}else go(0)}}
$("#btn-next").addEventListener("click",next);$("#btn-back").addEventListener("click",back);
$("#btn-all").addEventListener("click",function(e){e.stopPropagation();clearDeps();S.revealed=LANES;applyReveal();updateNav()});
$("#btn-road").addEventListener("click",function(){S.jumped=false;go(1)});
addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(S.panel)closePanel();else clearDeps();return}
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();next()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();back()}});

/* ---------- cover: wireframe payment card inside orbiting token rings ---------- */
var net=(function(){
  var cv=$("#net"),c=cv.getContext("2d"),W=1920,H=1080,raf=0,on=false,t0=0,i;
  var seed=11;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
  var CX=1340,CY=540,F=1500;
  function dot(x,y,r,a){c.save();c.shadowColor="#4682ff";c.shadowBlur=16;c.fillStyle="rgba(222,232,255,"+a+")";c.beginPath();c.arc(x,y,r,0,6.2832);c.fill();c.restore()}
  function rot(x,y,z,ry,rx){var cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cx-Z*sx;return[X,Y,y*sx+Z*cx]}
  function pr(v){var k=F/(F+v[2]);return[CX+v[0]*k,CY+v[1]*k,v[2],k]}
  function rr(w,h,r,n){var pts=[],k,a;[[w-r,h-r,0],[-w+r,h-r,1.5708],[-w+r,-h+r,3.1416],[w-r,-h+r,4.7124]].forEach(function(q){for(k=0;k<=n;k++){a=q[2]+k/n*1.5708;pts.push([q[0]+r*Math.cos(a),q[1]+r*Math.sin(a)])}});pts.push(pts[0]);return pts}
  var outline=rr(300,188,32,8),chip=rr(46,34,9,3).map(function(p){return[p[0]-190,p[1]-34]});
  var rings=[{R:430,tx:1.25,tz:.25,n:46,v:.32},{R:520,tx:1.05,tz:-.35,n:58,v:-.22},{R:620,tx:1.38,tz:.08,n:70,v:.15}];
  rings.forEach(function(r){r.ph=[];for(i=0;i<r.n;i++)r.ph.push(i/r.n*6.2832+rnd()*.05);r.hot=[];for(i=0;i<7;i++)r.hot.push(Math.floor(rnd()*r.n))});
  function draw(t){var ry=.6*Math.sin(t*.38)-.28,rx=.26+.09*Math.sin(t*.27),rz=-.13,cz=Math.cos(rz),sz=Math.sin(rz);
    function cp(x,y,z){var X=x*cz-y*sz,Y=x*sz+y*cz;return pr(rot(X,Y,z,ry,rx))}
    function poly(pts,z,close){c.beginPath();pts.forEach(function(p,k){var q=cp(p[0],p[1],z);if(k)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1])});if(close)c.closePath()}
    function rp(r,a){var x=r.R*Math.cos(a),z=r.R*Math.sin(a),cx=Math.cos(r.tx),sx=Math.sin(r.tx),Y=-z*sx,Z=z*cx,ct=Math.cos(r.tz),st=Math.sin(r.tz);return pr(rot(x*ct-Y*st,x*st+Y*ct,Z,t*.05,.1))}
    c.clearRect(0,0,W,H);
    var g=c.createRadialGradient(CX,CY,60,CX,CY,640);g.addColorStop(0,"rgba(70,130,255,.10)");g.addColorStop(1,"rgba(70,130,255,0)");c.fillStyle=g;c.fillRect(CX-660,CY-660,1320,1320);
    rings.forEach(function(r){c.beginPath();for(var k=0;k<=96;k++){var q=rp(r,k/96*6.2832);if(k)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1])}c.strokeStyle="rgba(0,229,255,.20)";c.lineWidth=1;c.stroke()});
    function parts(front){rings.forEach(function(r){r.ph.forEach(function(a,k){var q=rp(r,a+t*r.v);if((q[2]<0)!==front)return;
      if(r.hot.indexOf(k)>=0){for(var j=1;j<=7;j++){var w=rp(r,a+t*r.v-j*.022*(r.v>0?1:-1));c.fillStyle="rgba(70,130,255,"+(.5*(1-j/8))+")";c.beginPath();c.arc(w[0],w[1],2.2*w[3],0,6.2832);c.fill()}dot(q[0],q[1],3.4*q[3],front?1:.55)}
      else{c.fillStyle="rgba(222,232,255,"+(front?.55:.2)+")";c.beginPath();c.arc(q[0],q[1],1.7*q[3],0,6.2832);c.fill()}})})}
    parts(false);
    poly(outline,0,true);c.fillStyle="rgba(9,12,24,.8)";c.fill();
    [-7,7].forEach(function(z,k){poly(outline,z,true);c.strokeStyle=k?"rgba(222,232,255,.95)":"rgba(0,229,255,.5)";c.lineWidth=k?2:1;c.save();if(k){c.shadowColor="#4682ff";c.shadowBlur=18}c.stroke();c.restore()});
    c.strokeStyle="rgba(70,130,255,.85)";c.lineWidth=1.4;poly(chip,7,true);c.stroke();
    [[-236,-34,-144,-34],[-190,-68,-190,0],[-212,-52,-168,-52],[-212,-16,-168,-16]].forEach(function(s){poly([[s[0],s[1]],[s[2],s[3]]],7);c.stroke()});
    [18,32,46].forEach(function(r0){var pts=[];for(var a=-.75;a<=.751;a+=.15)pts.push([-110+r0*Math.cos(a),-34+r0*Math.sin(a)]);poly(pts,7);c.stroke()});
    c.fillStyle="rgba(222,232,255,.8)";for(var gI=0;gI<4;gI++)for(var d=0;d<4;d++){var q=cp(-232+gI*122+d*22,58,7);c.beginPath();c.arc(q[0],q[1],3.2*q[3],0,6.2832);c.fill()}
    c.strokeStyle="rgba(222,232,255,.5)";c.lineWidth=2;poly([[-236,122],[-60,122]],7);c.stroke();poly([[60,122],[140,122]],7);c.stroke();
    var sw=((t*.22)%1.6)-.3;if(sw>-.2&&sw<1.2){var x0=-300+600*sw;poly([[x0-30,-188],[x0+30,188]],8);c.strokeStyle="rgba(222,232,255,.07)";c.lineWidth=34;c.stroke()}
    parts(true)}
  function frame(ts){if(!on)return;if(!t0)t0=ts;draw((ts-t0)/1000);raf=requestAnimationFrame(frame)}
  var lastT=0,_draw=draw;draw=function(t){lastT=t;_draw(t)};
  function size(k){var s=Math.max(.5,Math.min(3,k*(window.devicePixelRatio||1)));cv.width=Math.round(W*s);cv.height=Math.round(H*s);c.setTransform(s,0,0,s,0,0);draw(lastT)}
  size(Math.min(innerWidth/1920,innerHeight/1080));
  return{size:size,run:function(v){if(v===on)return;on=v;cancelAnimationFrame(raf);if(on)raf=requestAnimationFrame(frame)}}
})();

/* ---------- start ---------- */
buildGrid();applyReveal();fit();
/* optional deep links for rehearsal: #r3 (roadmap, 3 lanes), #m2 (metrics category 2), #o=ID (open outcome), #d=ID (show dependencies) */
(function(){var h=location.hash.slice(1),m;
  if(h.charAt(0)==="!"){h=h.slice(1);stage.classList.add("still")} /* "!" prefix turns motion off, for printing or screenshots */
  if((m=/^r(\d)/.exec(h))){S.revealed=Math.max(1,Math.min(LANES,+m[1]));go(1)}
  else if((m=/^m(\d)/.exec(h))){S.revealed=LANES;S.cat=Math.max(0,Math.min(D.metricCategories.length-1,+m[1]-1));go(2)}
  else if((m=/^o=(.+)/.exec(h))){S.revealed=LANES;go(1);openPanel(m[1])}
  else if((m=/^d=([^,]+)(?:,(\d))?/.exec(h))){S.revealed=m[2]?+m[2]:LANES;go(1);setTimeout(function(){showDeps(m[1])},50)}
  else go(0)})();
})();
</script>
